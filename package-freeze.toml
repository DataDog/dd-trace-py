# One entry per extraction. The freeze gate (scripts/package-split freeze
# --base <revision>) loads this file from the *base* revision, so a pull
# request cannot weaken its own rules by editing it. See
# scripts/package_split/freeze_manifest.py for the schema.
#
# The frozen hashes pin the extracted implementation at its pre-extraction
# content: the last revision before the bridge. Any change to a frozen path
# after the extraction revision must be recorded as an approved rewrite with
# an owner, a reason and a sync record on the destination side.

