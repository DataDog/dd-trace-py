# Protected freeze manifest for the dd-trace-py package split (schema v1).
#
# Pins the extraction provenance of the shared-native campaign copied to
# datadog-apm-python: the telemetry worker (already extracted, slice 1) plus
# the rest of the shared-runtime cluster (http_client, data_pipeline,
# remote_config/rc_shm) that the campaign migrates into
# packages/ddtrace-internal-native. The not-yet-copied files are pre-frozen at
# the same baseline revision so they cannot drift while the campaign is in
# flight; each copy records its provenance here as it happens. While this manifest
# is in force, the frozen paths may only change through the harness's
# exception mechanism (owner, reason, expiry, synchronization record) or an
# approved rewrite -- never silently. See docs/package-split/plan.md
# (Deliverable 4, "Freeze and transfer") and the sequencing revision recorded
# there: the shared-native campaign (telemetry, http_client, data_pipeline,
# remote_config/rc_shm, shared_runtime proper) is extracted under this freeze
# as one campaign with a standard compatibility window; the freeze ends when
# the dd-trace-py copies are deleted at bridge retirement, not at
# publication.
#
# Owner: @DataDog/apm-core-python.

schema_version = 1

[[frozen]]
destination_repository = "https://github.com/DataDog/datadog-apm-python"
# The dd-trace-py revision whose file states were copied into
# packages/ddtrace-internal-native (branch gnufede/native-telemetry, commit
# 03e115f2b). The frozen paths are identical in both revisions.
extraction_revision = "58dc111a530d8059759d3ce11c874edca4b03295"
owner = "@DataDog/apm-core-python"
source_paths = [
    "src/native/telemetry.rs",
    "src/native/shared_runtime",
    "src/native/native_proc_macro",
    "src/native/http_client",
    "src/native/data_pipeline",
    "src/native/remote_config.rs",
    "src/native/rc_shm.rs",
]
# Removal condition: the frozen dd-trace-py copies are deleted at bridge
# retirement, after the approved compatibility window (plan Deliverable 4,
# step 6). The manifest entry is dropped in that same change.

# Build inputs that determine the extracted artifact's behavior. The
# destination package pins the same libdatadog revision so payloads stay
# byte-comparable during the compatibility window.
build_inputs = [
    "src/native/Cargo.toml: libdatadog git dependency rev v46.1.1 (libdd-telemetry, libdd-shared-runtime, libdd-capabilities-impl)",
    "src/native/Cargo.toml: pyo3 0.29 and strum 0.26 dependency pins used by the copied code",
]

