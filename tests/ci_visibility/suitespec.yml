---
components:
  ci_visibility:
    - ddtrace/internal/ci_visibility/*
    - ddtrace/ext/test_visibility/*
    - ddtrace/ext/test.py
  dd_coverage:
    - ddtrace/internal/coverage/*
  pytest:
    - ddtrace/contrib/internal/pytest/*
    - ddtrace/contrib/internal/pytest_bdd/*
    - ddtrace/contrib/internal/pytest_benchmark/*
  selenium:
    - ddtrace/contrib/internal/selenium/*
  unittest:
    - ddtrace/contrib/internal/unittest/*
  testing:
    - ddtrace/testing/*
suites:
  ci_visibility:
    parallelism: 4
    paths:
      - '@ci_visibility'
      - '@ci'
      - '@core'
      - '@coverage'
      - '@git'
      - '@pytest'
      - '@codeowners'
      - '@unittest'
      - '@testing'
      - tests/ci_visibility/*
    pattern: 'ci_visibility$'
    matrix:
      command: >-
        pytest --ddtrace -n auto --dist=worksteal {cmdargs} tests/ci_visibility --ignore=tests/ci_visibility/api/test_api_fake_runners.py
      dependencies: [msgpack, pytest-randomly, pytest-xdist, gevent]
      env:
        DD_AGENT_PORT: '9126'
      python: ['3.9', '3.10', '3.11', '3.12', '3.13']
      variants: [{name: default}]
  ci_visibility:snapshot:
    parallelism: 4
    paths:
      - '@ci_visibility'
      - '@ci'
      - '@core'
      - '@coverage'
      - '@git'
      - '@pytest'
      - '@codeowners'
      - '@unittest'
      - '@testing'
      - tests/ci_visibility/*
      - tests/snapshots/test_api_fake_runners.*
    snapshot: true
    pattern: 'ci_visibility:snapshot'
    matrix:
      command: pytest --ddtrace {cmdargs} tests/ci_visibility/api/test_api_fake_runners.py
      dependencies: [msgpack, pytest-randomly, gevent]
      env:
        DD_AGENT_PORT: '9126'
      python: ['3.9', '3.10', '3.11', '3.12', '3.13']
      variants: [{name: default}]
  dd_coverage:
    parallelism: 6
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@dd_coverage'
      - tests/coverage/*
    snapshot: true
    matrix:
      command: pytest --no-cov {cmdargs} tests/coverage -s
      variants: [{name: default}]
  pytest:
    venvs_per_job: 2
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@pytest'
      - '@ci_visibility'
      - '@coverage'
      - '@codeowners'
      - '@testing'
      - tests/contrib/pytest/*
      - tests/contrib/internal/coverage/*
    snapshot: true
    pattern: 'pytest$'
    matrix:
      command: >-
        pytest --ddtrace --no-cov -n auto --dist=worksteal {cmdargs} tests/contrib/pytest/
        --ignore=tests/contrib/pytest/snapshot/
      dependencies: [pytest-randomly, pytest-xdist, msgpack, more_itertools<8.11.0,
        httpx<0.28.0]
      env:
        DD_AGENT_PORT: '9126'
        DD_PYTEST_USE_NEW_PLUGIN: 'false'
      variants:
        - name: pytest-6-0-pytest-mock-2-0-0-pytest-cov-2-9-0
          python: ['3.9']
          dependencies: [pytest~=6.0, pytest-mock==2.0.0, pytest-cov==2.9.0]
        - name: pytest-7-0-pytest-pytest-mock-2-0-0-pytest-cov-2-12-0
          python: ['3.9']
          dependencies: [pytest~=7.0, pytest-mock==2.0.0, pytest-cov==2.12.0]
        - name: pytest-latest-pytest-pytest-mock-2-0-0-pytest-cov-2-12-0
          python: ['3.9']
          dependencies: [pytest-mock==2.0.0, pytest-cov==2.12.0]
        - name: pytest-6-0-pytest-asynctest-0-13-0
          python: ['3.10', '3.11', '3.12', '3.13']
          dependencies: [pytest~=6.0, asynctest==0.13.0]
        - name: pytest-7-0-pytest-asynctest-0-13-0
          python: ['3.10', '3.11', '3.12', '3.13']
          dependencies: [pytest~=7.0, asynctest==0.13.0]
        - name: pytest-latest-pytest-asynctest-0-13-0
          python: ['3.10', '3.11', '3.12', '3.13']
          dependencies: [asynctest==0.13.0]
  pytest:snapshot:
    venvs_per_job: 1
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@pytest'
      - '@ci_visibility'
      - '@coverage'
      - '@codeowners'
      - '@testing'
      - tests/contrib/pytest/snapshot/*
      - tests/snapshots/tests.contrib.pytest.*
    snapshot: true
    pattern: 'pytest:snapshot'
    matrix:
      command: pytest {cmdargs} --ddtrace tests/contrib/pytest/snapshot/
      dependencies: [pytest-randomly, pytest-xdist, msgpack, more_itertools<8.11.0,
        httpx<0.28.0]
      env:
        DD_AGENT_PORT: '9126'
        DD_PYTEST_USE_NEW_PLUGIN: 'false'
      variants:
        - name: pytest-7-2-pytest
          python: ['3.9']
          dependencies: [pytest~=7.2]
        - name: pytest-8-0-pytest
          python: ['3.9']
          dependencies: [pytest~=8.0]
        - name: pytest-7-2-pytest-asynctest-0-13-0
          python: ['3.10', '3.11', '3.12', '3.13']
          dependencies: [pytest~=7.2, asynctest==0.13.0]
        - name: pytest-8-0-pytest-asynctest-0-13-0
          python: ['3.10', '3.11', '3.12', '3.13']
          dependencies: [pytest~=8.0, asynctest==0.13.0]
        - name: pytest-latest-pytest-asynctest-0-13-0
          python: ['3.10', '3.11', '3.12', '3.13']
          dependencies: [asynctest==0.13.0]
  pytest_benchmark:
    venvs_per_job: 3
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@pytest'
      - '@ci_visibility'
      - '@coverage'
      - '@codeowners'
      - '@testing'
      - tests/contrib/pytest/*
      - tests/testing/internal/pytest/test_pytest_benchmark.py
      - tests/contrib/internal/coverage/*
      - tests/snapshots/tests.contrib.pytest.*
    snapshot: true
    matrix:
      command: pytest {cmdargs} --no-cov tests/testing/internal/pytest/test_pytest_benchmark.py
      dependencies: [msgpack, pytest-randomly, 'pytest-benchmark>=3.1.0,<=4.0.0']
      variants: [{name: default}]
  pytest_bdd:
    venvs_per_job: 3
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@pytest'
      - '@ci_visibility'
      - '@coverage'
      - '@codeowners'
      - '@testing'
      - tests/contrib/pytest/*
      - tests/testing/internal/pytest/test_pytest_bdd.py
      - tests/contrib/internal/coverage/*
      - tests/snapshots/tests.contrib.pytest.*
    snapshot: true
    matrix:
      command: pytest {cmdargs} tests/testing/internal/pytest/test_pytest_bdd.py
      dependencies: [pytest==7.4.4, msgpack, more_itertools<8.11.0, pytest-randomly]
      variants:
        - name: pytest-bdd-gte-4-0-lt-5-0-pytest-bdd
          python: ['3.9']
          dependencies: ['pytest-bdd>=4.0,<5.0']
        - name: pytest-bdd-gte-6-0-lt-6-1
          dependencies: ['pytest-bdd>=6.0,<6.1']
  pytest_flaky:
    venvs_per_job: 3
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@pytest'
      - '@ci_visibility'
      - '@coverage'
      - '@codeowners'
      - '@testing'
      - tests/contrib/pytest/*
      - tests/testing/internal/pytest/test_pytest_flaky.py
      - tests/contrib/internal/coverage/*
      - tests/snapshots/tests.contrib.pytest.*
    snapshot: true
    pattern: 'pytest:flaky'
    matrix:
      command: pytest {cmdargs} --no-cov -p no:flaky tests/testing/internal/pytest/test_pytest_flaky.py
      dependencies: [flaky, pytest-randomly]
      variants: [{name: default}]
    integration: pytest
  testing:
    retry: 2
    venvs_per_job: 1
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@pytest'
      - '@ci_visibility'
      - '@coverage'
      - '@codeowners'
      - '@testing'
      - tests/testing/*
      - tests/contrib/internal/coverage/*
    snapshot: true
    matrix:
      command: pytest --ddtrace --no-cov -n auto --dist=worksteal {cmdargs} tests/testing/
      dependencies:
        - pytest-randomly
        - pytest-xdist
        - pytest-benchmark
        - pytest-bdd
        - pytest-timeout
        - msgpack
        - more_itertools<8.11.0
        - httpx<0.28.0
      env:
        DD_AGENT_PORT: '9126'
        DD_CIVISIBILITY_CODE_COVERAGE_REPORT_UPLOAD_ENABLED: 'false'
        _DD_CIVISIBILITY_USE_CI_CONTEXT_PROVIDER: '0'
      variants:
        - name: pytest-6-2-5-pytest
          python: ['3.9']
          dependencies: [pytest==6.2.5]
        - name: pytest-7-2-pytest
          python: ['3.9']
          dependencies: [pytest~=7.2]
        - name: pytest-8-0-pytest
          python: ['3.9']
          dependencies: [pytest~=8.0]
        - name: pytest-7-2-pytest-asynctest-0-13-0
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: [pytest~=7.2, asynctest==0.13.0]
        - name: pytest-8-0-pytest-asynctest-0-13-0
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: [pytest~=8.0, asynctest==0.13.0]
        - name: pytest-latest-pytest-asynctest-0-13-0
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: [asynctest==0.13.0]
  selenium:
    parallelism: 2
    env:
      SELENIUM_GRID_URL: http://selenium-chrome:4444
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@ci_visibility'
      - '@pytest'
      - '@unittest'
      - '@selenium'
      - '@testing'
      - tests/contrib/selenium/*
      - tests/snapshots/test_selenium*
    snapshot: true
    services:
      - selenium-chrome
    matrix:
      command: pytest --no-cov {cmdargs} -c /dev/null tests/contrib/selenium
      dependencies: [selenium~=4.0, webdriver-manager]
      env:
        DD_AGENT_PORT: '9126'
      variants:
        - name: pytest
          python: ['3.10', '3.12']
  unittest:
    parallelism: 2
    paths:
      - '@contrib'
      - '@unittest'
      - '@ci_visibility'
      - '@coverage'
      - '@testing'
      - tests/contrib/unittest/*
      - tests/snapshots/tests.contrib.unittest.*
    snapshot: true
    matrix:
      command: pytest {cmdargs} tests/contrib/unittest/
      dependencies: [msgpack, pytest-randomly]
      env:
        DD_AGENT_PORT: '9126'
        DD_PATCH_MODULES: unittest:true
        DD_UNITTEST_SERVICE: dd-trace-py
      variants: [{name: default}]
