---
components:
  anthropic:
    - ddtrace/contrib/internal/anthropic/*
  claude_agent_sdk:
    - ddtrace/contrib/internal/claude_agent_sdk/*
  google_adk:
    - ddtrace/contrib/internal/google_adk/*
  google_genai:
    - ddtrace/contrib/internal/google_genai/*
  vertexai:
    - ddtrace/contrib/internal/vertexai/*
  llama_index:
    - ddtrace/contrib/internal/llama_index/*
  langchain:
    - ddtrace/contrib/internal/langchain/*
  litellm:
    - ddtrace/contrib/internal/litellm/*
  llmobs:
    - ddtrace/llmobs/*
  mcp:
    - ddtrace/contrib/internal/mcp/*
  mistralai:
    - ddtrace/contrib/internal/mistralai/*
  openai:
    - ddtrace/contrib/internal/openai/*
  langgraph:
    - ddtrace/contrib/internal/langgraph/*
  crewai:
    - ddtrace/contrib/internal/crewai/*
  openai_agents:
    - ddtrace/contrib/internal/openai_agents/*
  pydantic_ai:
    - ddtrace/contrib/internal/pydantic_ai/*
  vllm:
    - ddtrace/contrib/internal/vllm/*
suites:
  anthropic:
    parallelism: 2
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@anthropic'
      - '@requests'
      - '@llmobs'
      - tests/contrib/anthropic/*
      - tests/snapshots/tests.contrib.anthropic.*
    snapshot: true
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/anthropic
      dependencies:
        - pytest-asyncio
        - vcrpy
      cases:
        - python: ['3.9', '3.10', '3.11', '3.12']
          dependencies:
            - anthropic~=0.28.0
            - httpx~=0.27.0
          axes:
            compatibility:
              anthropic-0-28-0-httpx-0-27-0: {}
        - python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies:
            - anthropic
            - httpx<0.28.0
          axes:
            compatibility:
              anthropic-latest-httpx-lt-0-28-0: {}
  claude_agent_sdk:
    parallelism: 3
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@claude_agent_sdk'
      - '@llmobs'
      - tests/contrib/claude_agent_sdk/*
      - tests/snapshots/tests.contrib.claude_agent_sdk.*
    snapshot: true
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/claude_agent_sdk/
      dependencies:
        - pytest-asyncio
      python: ['3.10', '3.11', '3.12', '3.13', '3.14']
      axes:
        claude-agent-sdk:
          claude-agent-sdk-0-0-23: claude-agent-sdk==0.0.23
          claude-agent-sdk-0-1-29: claude-agent-sdk==0.1.29
          claude-agent-sdk-0-1-49: claude-agent-sdk==0.1.49
          claude-agent-sdk-latest: claude-agent-sdk
  google_adk:
    venvs_per_job: 2
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@google_adk'
      - '@llmobs'
      - tests/contrib/google_adk/*
    snapshot: true
    runner: uv
    matrix:
      command: pytest -n auto --dist=worksteal {cmdargs} tests/contrib/google_adk
      dependencies:
        - pytest-asyncio
        - pytest-xdist
        - vcrpy
        - deprecated
      python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      axes:
        google-adk:
          google-adk-1-0-0: google-adk~=1.0.0
          google-adk-latest: google-adk
  google_genai:
    parallelism: 1
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@google_genai'
      - '@llmobs'
      - tests/contrib/google_genai/*
      - tests/snapshots/tests.contrib.google_genai.*
    snapshot: true
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/google_genai
      dependencies:
        - pytest-asyncio
        - google-genai
      python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
  vertexai:
    parallelism: 2
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@vertexai'
      - '@llmobs'
      - tests/contrib/vertexai/*
      - tests/snapshots/tests.contrib.vertexai.*
    snapshot: true
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/vertexai
      dependencies:
        - pytest-asyncio
        - vertexai
        - google-ai-generativelanguage
        - google-cloud-aiplatform
      python: ['3.9', '3.10', '3.11', '3.12']
  llama_index:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@llama_index'
      - '@llmobs'
      - tests/contrib/llama_index/*
      - tests/snapshots/tests.contrib.llama_index.*
    snapshot: true
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/llama_index
      dependencies:
        - pytest-asyncio
        - vcrpy
        - llama-index-llms-openai
        - llama-index-embeddings-openai
      python: ['3.10', '3.11', '3.12', '3.13']
      axes:
        llama-index-core:
          llama-index-core-0-11-0: llama-index-core~=0.11.0
          llama-index-core-latest: llama-index-core
  langchain:
    retry: 2
    parallelism: 6
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@langchain'
      - '@requests'
      - '@llmobs'
      - tests/contrib/langchain/*
      - tests/snapshots/tests.contrib.langchain.*
    snapshot: true
    runner: uv
    matrix:
      command: pytest -v {cmdargs} tests/contrib/langchain
      dependencies:
        - pytest-asyncio==0.23.7
        - tiktoken
        - huggingface-hub
        - ai21
        - exceptiongroup
        - psutil
        - pytest-randomly==3.10.1
        - numexpr==2.8.5
        - greenlet==3.0.3
        - respx
        - numpy
      cases:
        - python: ['3.9', '3.10', '3.11', '3.12']
          dependencies:
            - langchain-core~=0.1.0
            - langchain-openai~=0.1.0
            - langchain-anthropic~=0.1.0
            - langchain-aws~=0.1.0
            - langchain-cohere~=0.1.0
          axes:
            compatibility:
              langchain-core-0-1-0-langchain-openai-0-1-0-langchain-anthropic-: {}
        - python: ['3.9', '3.10', '3.11', '3.12']
          dependencies:
            - langchain-core~=0.3.0
            - langchain-openai~=0.3.0
            - langchain-anthropic~=0.3.0
            - langchain-aws~=0.2.0
            - langchain-cohere~=0.3.0
            - langchain-google-genai~=2.0.0
          axes:
            compatibility:
              langchain-core-0-3-0-langchain-openai-0-3-0-langchain-anthropic-: {}
        - python: ['3.10', '3.11', '3.12']
          dependencies:
            - langchain-core
            - langchain-openai
            - langchain-anthropic
            - langchain-aws
            - langchain-cohere
            - langchain-google-genai
          axes:
            compatibility:
              langchain-core-latest-langchain-openai-latest-langchain-anthropi: {}
  litellm:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@litellm'
      - '@llmobs'
      - tests/contrib/litellm/*
      - tests/snapshots/tests.contrib.litellm.*
    snapshot: true
    venvs_per_job: 1
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/litellm
      dependencies:
        - vcrpy
        - pytest-asyncio
        - botocore
        - boto3
      cases:
        - python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies:
            - litellm==1.65.4
            - openai==1.68.2
          axes:
            compatibility:
              litellm-1-65-4-openai-1-68-2: {}
        - python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies:
            - litellm==1.80.16
            - openai>=2.8.0
          axes:
            compatibility:
              litellm-1-80-16-openai-gte-2-8-0: {}
  llmobs:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@llmobs'
      - tests/llmobs/*
      - tests/cassettes/anthropic/*
      - tests/cassettes/azure_openai/*
      - tests/cassettes/bedrock/*
      - tests/cassettes/datadog/*
      - tests/cassettes/genai/*
      - tests/cassettes/openai/*
      - tests/cassettes/vertexai/*
      - tests/cassettes/tests.llmobs.*
    snapshot: true
    venvs_per_job: 1
    runner: uv
    matrix:
      dependencies:
        - pytest-xdist
      cases:
        - python: ['3.9']
          dependencies:
            - vcrpy
            - openai
            - google-cloud-aiplatform
            - boto3
            - pytest-asyncio==0.21.1
            - langchain
            - pandas
            - openfeature-sdk>=0.8,<1
          axes:
            compatibility:
              vcrpy-latest-openai-latest-google-cloud-aiplatform-latest-boto3-: {}
          command: pytest -n auto --dist=worksteal {cmdargs} tests/llmobs
        - python: ['3.10', '3.11', '3.12', '3.13']
          dependencies:
            - vcrpy
            - openai
            - google-cloud-aiplatform
            - boto3
            - pytest-asyncio==0.21.1
            - langchain
            - pandas
            - openfeature-sdk>=0.8,<1
            - deepeval
            - pydantic-evals>=1.31
          axes:
            compatibility:
              vcrpy-latest-openai-latest-google-cloud-aiplatform-latest-boto3--2: {}
          command: pytest -n auto --dist=worksteal {cmdargs} tests/llmobs
        - python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies:
            - pydantic~=1.10
          axes:
            compatibility:
              pydantic-1-10: {}
          command: pytest -n auto --dist=worksteal {cmdargs} tests/llmobs/test_utils.py
  mcp:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@mcp'
      - '@llmobs'
      - tests/contrib/mcp/*
      - tests/snapshots/tests.contrib.mcp.*
    snapshot: true
    venvs_per_job: 5
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/mcp
      dependencies:
        - pytest-asyncio
      python: ['3.10', '3.11', '3.12', '3.13', '3.14']
      axes:
        mcp:
          mcp-1-10-0: mcp~=1.10.0
          mcp-latest: mcp
  mistralai:
    parallelism: 1
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@mistralai'
      - '@llmobs'
      - tests/contrib/mistralai/*
      - tests/cassettes/mistral/*
      - tests/snapshots/tests.contrib.mistralai.*
    snapshot: true
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/mistralai
      dependencies:
        - pytest-asyncio
      python: ['3.10', '3.11', '3.12', '3.13', '3.14']
      axes:
        mistralai:
          mistralai-2-0-0: mistralai~=2.0.0
          mistralai-latest: mistralai
  openai:
    venvs_per_job: 1
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@openai'
      - '@requests'
      - '@llmobs'
      - tests/contrib/openai/*
      - tests/snapshots/tests.contrib.openai.*
    pattern: ^openai$
    snapshot: true
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/openai
      dependencies:
        - vcrpy
        - urllib3~=1.26
        - pytest-asyncio==0.21.1
        - pytest-randomly
      cases:
        - python: ['3.9', '3.10', '3.11']
          dependencies:
            - pillow==9.5.0
            - httpx==0.27.2
          axes:
            openai-embeddings-datalib:
              openai-embeddings-datalib-1-0-0: openai[embeddings,datalib]==1.0.0
              openai-embeddings-datalib-1-30-1: openai[embeddings,datalib]==1.30.1
            compatibility:
              openai-embeddings-datalib-pillow-9-5-0-httpx-0-27-2: {}
        - python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies:
            - pillow
          axes:
            openai:
              openai-latest: openai
              openai-lt-2-0-0: openai<2.0.0
              openai-1-76-2: openai~=1.76.2
              openai-1-66-0: openai==1.66.0
            compatibility:
              openai-pillow-latest: {}
  langgraph:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@langgraph'
      - '@requests'
      - '@llmobs'
      - tests/contrib/langgraph/*
    snapshot: true
    venvs_per_job: 4
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/langgraph
      dependencies:
        - pytest-asyncio
        - langchain_openai
        - langchain_core
        - langchain
      cases:
        - python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          axes:
            langgraph: &id001
              langgraph-0-2-23: langgraph==0.2.23
              langgraph-0-3-21: langgraph==0.3.21
              langgraph-0-3-22: langgraph==0.3.22
              langgraph-latest: langgraph
            compatibility:
              variant-1: {}
        - python: ['3.14']
          dependencies:
            - ormsgpack>=1.11.0
          axes:
            langgraph: *id001
            compatibility:
              ormsgpack-gte-1-11-0: {}
  crewai:
    retry: 2
    parallelism: 3
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@crewai'
      - '@requests'
      - '@llmobs'
      - tests/contrib/crewai/*
      - tests/snapshots/tests.contrib.crewai.*
    snapshot: true
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/crewai
      dependencies:
        - pytest-asyncio
        - openai
        - vcrpy==7.0.0
      python: ['3.10', '3.11', '3.12']
      axes:
        crewai:
          crewai-0-102-0: crewai~=0.102.0
          crewai-latest: crewai
  openai_agents:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@openai_agents'
      - '@llmobs'
      - tests/contrib/openai_agents/*
      - tests/snapshots/tests.contrib.openai_agents.*
    snapshot: true
    venvs_per_job: 2
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/openai_agents
      dependencies:
        - vcrpy
        - pytest-asyncio
        - openai
      cases:
        - python: ['3.9']
          dependencies:
            - urllib3<2
            - eval-type-backport
          axes:
            openai-agents:
              openai-agents-0-0-0: openai-agents~=0.0.0
              openai-agents-0-8-0: openai-agents~=0.8.0
            compatibility:
              openai-agents-urllib3-lt-2-eval-type-backport-latest: {}
        - python: ['3.10', '3.11', '3.12', '3.13']
          axes:
            openai-agents:
              openai-agents-0-0-0: openai-agents~=0.0.0
              openai-agents-0-8-0: openai-agents~=0.8.0
            compatibility:
              openai-agents: {}
        - python: ['3.10', '3.11', '3.12', '3.13']
          axes:
            openai-agents:
              openai-agents-0-14-0: openai-agents~=0.14.0
              openai-agents-latest: openai-agents
            compatibility:
              openai-agents-2: {}
  pydantic_ai:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@pydantic_ai'
      - '@llmobs'
      - tests/contrib/pydantic_ai/*
      - tests/snapshots/tests.contrib.pydantic_ai.*
    snapshot: true
    venvs_per_job: 2
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/pydantic_ai
      dependencies:
        - pytest-asyncio
        - vcrpy==7.0.0
        - typing_extensions
      cases:
        - python: ['3.9']
          dependencies:
            - pydantic-ai-slim[openai]==0.8.1
            - pydantic==2.12.0a1
          axes:
            compatibility:
              pydantic-ai-slim-openai-0-8-1-pydantic-2-12-0a1: {}
        - python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies:
            - pydantic==2.12.0a1
          axes:
            pydantic-ai-slim-openai:
              pydantic-ai-slim-openai-0-8-1: pydantic-ai-slim[openai]==0.8.1
              pydantic-ai-slim-openai-1-0-0: pydantic-ai-slim[openai]==1.0.0
            compatibility:
              pydantic-ai-slim-openai-pydantic-2-12-0a1: {}
        - python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies:
            - pydantic-ai-slim[openai]==1.63.0
          axes:
            compatibility:
              pydantic-ai-slim-openai-1-63-0: {}
  vllm:
    venvs_per_job: 1
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@vllm'
      - '@llmobs'
      - tests/contrib/vllm/*
      - tests/snapshots/tests.contrib.vllm.*
    gpu: true
    snapshot: true
    skip: true # Temporarily disabled
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/vllm
      dependencies:
        - pytest-asyncio==0.21.1
        - pytest-randomly
        - torch
        - vllm>=0.10.2
      python: ['3.10', '3.11', '3.12', '3.13']
