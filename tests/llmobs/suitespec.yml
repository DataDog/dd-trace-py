---
components:
  anthropic:
    - ddtrace/contrib/internal/anthropic/*
  claude_agent_sdk:
    - ddtrace/contrib/internal/claude_agent_sdk/*
  google_adk:
    - ddtrace/contrib/internal/google_adk/*
  google_genai:
    - ddtrace/contrib/internal/google_genai/*
  vertexai:
    - ddtrace/contrib/internal/vertexai/*
  llama_index:
    - ddtrace/contrib/internal/llama_index/*
  langchain:
    - ddtrace/contrib/internal/langchain/*
  litellm:
    - ddtrace/contrib/internal/litellm/*
  llmobs:
    - ddtrace/llmobs/*
  mcp:
    - ddtrace/contrib/internal/mcp/*
  mistralai:
    - ddtrace/contrib/internal/mistralai/*
  openai:
    - ddtrace/contrib/internal/openai/*
  langgraph:
    - ddtrace/contrib/internal/langgraph/*
  crewai:
    - ddtrace/contrib/internal/crewai/*
  openai_agents:
    - ddtrace/contrib/internal/openai_agents/*
  pydantic_ai:
    - ddtrace/contrib/internal/pydantic_ai/*
  vllm:
    - ddtrace/contrib/internal/vllm/*
suites:
  anthropic:
    parallelism: 2
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@anthropic'
      - '@requests'
      - '@llmobs'
      - tests/contrib/anthropic/*
      - tests/snapshots/tests.contrib.anthropic.*
    snapshot: true
    matrix:
      command: pytest {cmdargs} tests/contrib/anthropic
      variants:
        - name: anthropic
          python: ['3.9', '3.10', '3.11', '3.12']
          dependencies: [pytest-asyncio, vcrpy, 'anthropic~=0.28.0', 'httpx~=0.27.0']
        - name: anthropic
          dependencies: [pytest-asyncio, vcrpy, anthropic, 'httpx<0.28.0']
  claude_agent_sdk:
    parallelism: 3
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@claude_agent_sdk'
      - '@llmobs'
      - tests/contrib/claude_agent_sdk/*
      - tests/snapshots/tests.contrib.claude_agent_sdk.*
    snapshot: true
    matrix:
      command: pytest {cmdargs} tests/contrib/claude_agent_sdk/
      variants:
        - name: claude_agent_sdk
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: ['claude-agent-sdk==0.0.23', pytest-asyncio]
        - name: claude_agent_sdk
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: ['claude-agent-sdk==0.1.29', pytest-asyncio]
        - name: claude_agent_sdk
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: ['claude-agent-sdk==0.1.49', pytest-asyncio]
        - name: claude_agent_sdk
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: [claude-agent-sdk, pytest-asyncio]
  google_adk:
    venvs_per_job: 2
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@google_adk'
      - '@llmobs'
      - tests/contrib/google_adk/*
    snapshot: true
    matrix:
      command: pytest -n auto --dist=worksteal {cmdargs} tests/contrib/google_adk
      variants:
        - name: google_adk
          dependencies: [pytest-asyncio, pytest-xdist, 'google-adk~=1.0.0', vcrpy, deprecated]
        - name: google_adk
          dependencies: [pytest-asyncio, pytest-xdist, google-adk, vcrpy, deprecated]
  google_genai:
    parallelism: 1
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@google_genai'
      - '@llmobs'
      - tests/contrib/google_genai/*
      - tests/snapshots/tests.contrib.google_genai.*
    snapshot: true
    matrix:
      command: pytest {cmdargs} tests/contrib/google_genai
      variants:
        - name: google_genai
          dependencies: [pytest-asyncio, google-genai]
  vertexai:
    parallelism: 2
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@vertexai'
      - '@llmobs'
      - tests/contrib/vertexai/*
      - tests/snapshots/tests.contrib.vertexai.*
    snapshot: true
    matrix:
      command: pytest {cmdargs} tests/contrib/vertexai
      python: ['3.9', '3.10', '3.11', '3.12']
      variants:
        - name: vertexai
          dependencies: [pytest-asyncio, vertexai, google-ai-generativelanguage, google-cloud-aiplatform]
  llama_index:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@llama_index'
      - '@llmobs'
      - tests/contrib/llama_index/*
      - tests/snapshots/tests.contrib.llama_index.*
    snapshot: true
    matrix:
      command: pytest {cmdargs} tests/contrib/llama_index
      variants:
        - name: llama_index
          python: ['3.10', '3.11', '3.12', '3.13']
          dependencies: [pytest-asyncio, vcrpy, 'llama-index-core~=0.11.0', llama-index-llms-openai, llama-index-embeddings-openai]
        - name: llama_index
          python: ['3.10', '3.11', '3.12', '3.13']
          dependencies: [pytest-asyncio, vcrpy, llama-index-core, llama-index-llms-openai, llama-index-embeddings-openai]
  langchain:
    retry: 2
    parallelism: 6
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@langchain'
      - '@requests'
      - '@llmobs'
      - tests/contrib/langchain/*
      - tests/snapshots/tests.contrib.langchain.*
    snapshot: true
    matrix:
      command: pytest -v {cmdargs} tests/contrib/langchain
      variants:
        - name: langchain
          python: ['3.9', '3.10', '3.11', '3.12']
          dependencies: ['pytest-asyncio==0.23.7', tiktoken, huggingface-hub, ai21, exceptiongroup, psutil, 'pytest-randomly==3.10.1', 'numexpr==2.8.5', 'greenlet==3.0.3', respx, numpy, 'langchain-core~=0.1.0', 'langchain-openai~=0.1.0', 'langchain-anthropic~=0.1.0', 'langchain-aws~=0.1.0', 'langchain-cohere~=0.1.0']
        - name: langchain
          python: ['3.9', '3.10', '3.11', '3.12']
          dependencies: ['pytest-asyncio==0.23.7', tiktoken, huggingface-hub, ai21, exceptiongroup, psutil, 'pytest-randomly==3.10.1', 'numexpr==2.8.5', 'greenlet==3.0.3', respx, numpy, 'langchain-core~=0.3.0', 'langchain-openai~=0.3.0', 'langchain-anthropic~=0.3.0', 'langchain-aws~=0.2.0', 'langchain-cohere~=0.3.0', 'langchain-google-genai~=2.0.0']
        - name: langchain
          python: ['3.10', '3.11', '3.12']
          dependencies: ['pytest-asyncio==0.23.7', tiktoken, huggingface-hub, ai21, exceptiongroup, psutil, 'pytest-randomly==3.10.1', 'numexpr==2.8.5', 'greenlet==3.0.3', respx, numpy, langchain-core, langchain-openai, langchain-anthropic, langchain-aws, langchain-cohere, langchain-google-genai]
  litellm:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@litellm'
      - '@llmobs'
      - tests/contrib/litellm/*
      - tests/snapshots/tests.contrib.litellm.*
    snapshot: true
    venvs_per_job: 1
    matrix:
      command: pytest {cmdargs} tests/contrib/litellm
      variants:
        - name: litellm
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [vcrpy, pytest-asyncio, botocore, boto3, 'litellm==1.65.4', 'openai==1.68.2']
        - name: litellm
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [vcrpy, pytest-asyncio, botocore, boto3, 'litellm==1.80.16', 'openai>=2.8.0']
  llmobs:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@llmobs'
      - tests/llmobs/*
      - tests/cassettes/anthropic/*
      - tests/cassettes/azure_openai/*
      - tests/cassettes/bedrock/*
      - tests/cassettes/datadog/*
      - tests/cassettes/genai/*
      - tests/cassettes/openai/*
      - tests/cassettes/vertexai/*
      - tests/cassettes/tests.llmobs.*
    snapshot: true
    venvs_per_job: 1
    matrix:
      command: pytest -n auto --dist=worksteal {cmdargs} tests/llmobs
      variants:
        - name: llmobs
          python: ['3.9']
          dependencies: [vcrpy, openai, google-cloud-aiplatform, boto3, 'pytest-asyncio==0.21.1', pytest-xdist, langchain, pandas, 'openfeature-sdk>=0.8,<1']
        - name: llmobs
          python: ['3.10', '3.11', '3.12', '3.13']
          dependencies: [vcrpy, openai, google-cloud-aiplatform, boto3, 'pytest-asyncio==0.21.1', pytest-xdist, langchain, pandas, 'openfeature-sdk>=0.8,<1', deepeval, 'pydantic-evals>=1.31']
        - name: llmobs
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: ['pydantic~=1.10', pytest-xdist]
          command: pytest -n auto --dist=worksteal {cmdargs} tests/llmobs/test_utils.py
  mcp:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@mcp'
      - '@llmobs'
      - tests/contrib/mcp/*
      - tests/snapshots/tests.contrib.mcp.*
    snapshot: true
    venvs_per_job: 5
    matrix:
      command: pytest {cmdargs} tests/contrib/mcp
      variants:
        - name: mcp
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: [pytest-asyncio, 'mcp~=1.10.0']
        - name: mcp
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: [pytest-asyncio, mcp]
  mistralai:
    parallelism: 1
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@mistralai'
      - '@llmobs'
      - tests/contrib/mistralai/*
      - tests/cassettes/mistral/*
      - tests/snapshots/tests.contrib.mistralai.*
    snapshot: true
    matrix:
      command: pytest {cmdargs} tests/contrib/mistralai
      variants:
        - name: mistralai
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: [pytest-asyncio, 'mistralai~=2.0.0']
        - name: mistralai
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: [pytest-asyncio, mistralai]
  openai:
    venvs_per_job: 1
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@openai'
      - '@requests'
      - '@llmobs'
      - tests/contrib/openai/*
      - tests/snapshots/tests.contrib.openai.*
    pattern: ^openai$
    snapshot: true
    matrix:
      command: pytest {cmdargs} tests/contrib/openai
      variants:
        - name: openai
          python: ['3.9', '3.10', '3.11']
          dependencies: [vcrpy, 'urllib3~=1.26', 'pytest-asyncio==0.21.1', pytest-randomly, 'openai[embeddings,datalib]==1.0.0', 'pillow==9.5.0', 'httpx==0.27.2']
        - name: openai
          python: ['3.9', '3.10', '3.11']
          dependencies: [vcrpy, 'urllib3~=1.26', 'pytest-asyncio==0.21.1', pytest-randomly, 'openai[embeddings,datalib]==1.30.1', 'pillow==9.5.0', 'httpx==0.27.2']
        - name: openai
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [vcrpy, 'urllib3~=1.26', 'pytest-asyncio==0.21.1', pytest-randomly, openai, pillow]
        - name: openai
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [vcrpy, 'urllib3~=1.26', 'pytest-asyncio==0.21.1', pytest-randomly, 'openai<2.0.0', pillow]
        - name: openai
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [vcrpy, 'urllib3~=1.26', 'pytest-asyncio==0.21.1', pytest-randomly, 'openai~=1.76.2', pillow]
        - name: openai
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [vcrpy, 'urllib3~=1.26', 'pytest-asyncio==0.21.1', pytest-randomly, 'openai==1.66.0', pillow]
  langgraph:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@langgraph'
      - '@requests'
      - '@llmobs'
      - tests/contrib/langgraph/*
    snapshot: true
    venvs_per_job: 4
    matrix:
      command: pytest {cmdargs} tests/contrib/langgraph
      variants:
        - name: langgraph
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [pytest-asyncio, 'langgraph==0.2.23', langchain_openai, langchain_core, langchain]
        - name: langgraph
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [pytest-asyncio, 'langgraph==0.3.21', langchain_openai, langchain_core, langchain]
        - name: langgraph
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [pytest-asyncio, 'langgraph==0.3.22', langchain_openai, langchain_core, langchain]
        - name: langgraph
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [pytest-asyncio, langgraph, langchain_openai, langchain_core, langchain]
        - name: langgraph
          python: ['3.14']
          dependencies: [pytest-asyncio, 'langgraph==0.2.23', langchain_openai, langchain_core, langchain, 'ormsgpack>=1.11.0']
        - name: langgraph
          python: ['3.14']
          dependencies: [pytest-asyncio, 'langgraph==0.3.21', langchain_openai, langchain_core, langchain, 'ormsgpack>=1.11.0']
        - name: langgraph
          python: ['3.14']
          dependencies: [pytest-asyncio, 'langgraph==0.3.22', langchain_openai, langchain_core, langchain, 'ormsgpack>=1.11.0']
        - name: langgraph
          python: ['3.14']
          dependencies: [pytest-asyncio, langgraph, langchain_openai, langchain_core, langchain, 'ormsgpack>=1.11.0']
  crewai:
    retry: 2
    parallelism: 3
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@crewai'
      - '@requests'
      - '@llmobs'
      - tests/contrib/crewai/*
      - tests/snapshots/tests.contrib.crewai.*
    snapshot: true
    matrix:
      command: pytest {cmdargs} tests/contrib/crewai
      variants:
        - name: crewai
          python: ['3.10', '3.11', '3.12']
          dependencies: [pytest-asyncio, openai, 'crewai~=0.102.0', 'vcrpy==7.0.0']
        - name: crewai
          python: ['3.10', '3.11', '3.12']
          dependencies: [pytest-asyncio, openai, crewai, 'vcrpy==7.0.0']
  openai_agents:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@openai_agents'
      - '@llmobs'
      - tests/contrib/openai_agents/*
      - tests/snapshots/tests.contrib.openai_agents.*
    snapshot: true
    venvs_per_job: 2
    matrix:
      command: pytest {cmdargs} tests/contrib/openai_agents
      variants:
        - name: openai_agents
          python: ['3.9']
          dependencies: [vcrpy, pytest-asyncio, openai, 'openai-agents~=0.0.0', 'urllib3<2', eval-type-backport]
        - name: openai_agents
          python: ['3.9']
          dependencies: [vcrpy, pytest-asyncio, openai, 'openai-agents~=0.8.0', 'urllib3<2', eval-type-backport]
        - name: openai_agents
          python: ['3.10', '3.11', '3.12', '3.13']
          dependencies: [vcrpy, pytest-asyncio, openai, 'openai-agents~=0.0.0']
        - name: openai_agents
          python: ['3.10', '3.11', '3.12', '3.13']
          dependencies: [vcrpy, pytest-asyncio, openai, 'openai-agents~=0.8.0']
        - name: openai_agents
          python: ['3.10', '3.11', '3.12', '3.13']
          dependencies: [vcrpy, pytest-asyncio, openai, 'openai-agents~=0.14.0']
        - name: openai_agents
          python: ['3.10', '3.11', '3.12', '3.13']
          dependencies: [vcrpy, pytest-asyncio, openai, openai-agents]
  pydantic_ai:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@pydantic_ai'
      - '@llmobs'
      - tests/contrib/pydantic_ai/*
      - tests/snapshots/tests.contrib.pydantic_ai.*
    snapshot: true
    venvs_per_job: 2
    matrix:
      command: pytest {cmdargs} tests/contrib/pydantic_ai
      variants:
        - name: pydantic_ai
          python: ['3.9']
          dependencies: [pytest-asyncio, 'vcrpy==7.0.0', typing_extensions, 'pydantic-ai-slim[openai]==0.8.1', 'pydantic==2.12.0a1']
        - name: pydantic_ai
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: [pytest-asyncio, 'vcrpy==7.0.0', typing_extensions, 'pydantic-ai-slim[openai]==0.8.1', 'pydantic==2.12.0a1']
        - name: pydantic_ai
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: [pytest-asyncio, 'vcrpy==7.0.0', typing_extensions, 'pydantic-ai-slim[openai]==1.0.0', 'pydantic==2.12.0a1']
        - name: pydantic_ai
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: [pytest-asyncio, 'vcrpy==7.0.0', typing_extensions, 'pydantic-ai-slim[openai]==1.63.0']
  vllm:
    venvs_per_job: 1
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@vllm'
      - '@llmobs'
      - tests/contrib/vllm/*
      - tests/snapshots/tests.contrib.vllm.*
    gpu: true
    snapshot: true
    skip: true # Temporarily disabled
    matrix:
      command: pytest {cmdargs} tests/contrib/vllm
      python: ['3.10', '3.11', '3.12', '3.13']
      variants:
        - name: vllm
          dependencies: ['pytest-asyncio==0.21.1', pytest-randomly, torch, 'vllm~=0.10.2']
        - name: vllm
          dependencies: ['pytest-asyncio==0.21.1', pytest-randomly, torch, vllm]
