---
components:
  anthropic:
    - ddtrace/contrib/internal/anthropic/*
  claude_agent_sdk:
    - ddtrace/contrib/internal/claude_agent_sdk/*
  google_adk:
    - ddtrace/contrib/internal/google_adk/*
  google_genai:
    - ddtrace/contrib/internal/google_genai/*
  vertexai:
    - ddtrace/contrib/internal/vertexai/*
  llama_index:
    - ddtrace/contrib/internal/llama_index/*
  langchain:
    - ddtrace/contrib/internal/langchain/*
  litellm:
    - ddtrace/contrib/internal/litellm/*
  llmobs:
    - ddtrace/llmobs/*
  mcp:
    - ddtrace/contrib/internal/mcp/*
  mistralai:
    - ddtrace/contrib/internal/mistralai/*
  openai:
    - ddtrace/contrib/internal/openai/*
  langgraph:
    - ddtrace/contrib/internal/langgraph/*
  crewai:
    - ddtrace/contrib/internal/crewai/*
  openai_agents:
    - ddtrace/contrib/internal/openai_agents/*
  pydantic_ai:
    - ddtrace/contrib/internal/pydantic_ai/*
  vllm:
    - ddtrace/contrib/internal/vllm/*
suites:
  anthropic:
    parallelism: 2
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@anthropic'
      - '@requests'
      - '@llmobs'
      - tests/contrib/anthropic/*
      - tests/snapshots/tests.contrib.anthropic.*
    snapshot: true
    matrix:
      command: pytest {cmdargs} tests/contrib/anthropic
      dependencies: [pytest-asyncio, vcrpy]
      variants:
        - name: anthropic-0-28-0-httpx-0-27-0
          python: ['3.9', '3.10', '3.11', '3.12']
          dependencies: [anthropic~=0.28.0, httpx~=0.27.0]
        - name: anthropic-latest-httpx-lt-0-28-0
          dependencies: [anthropic, httpx<0.28.0]
  claude_agent_sdk:
    parallelism: 3
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@claude_agent_sdk'
      - '@llmobs'
      - tests/contrib/claude_agent_sdk/*
      - tests/snapshots/tests.contrib.claude_agent_sdk.*
    snapshot: true
    matrix:
      command: pytest {cmdargs} tests/contrib/claude_agent_sdk/
      dependencies: [pytest-asyncio]
      variants:
        - name: claude-agent-sdk-0-0-23
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: [claude-agent-sdk==0.0.23]
        - name: claude-agent-sdk-0-1-29
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: [claude-agent-sdk==0.1.29]
        - name: claude-agent-sdk-0-1-49
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: [claude-agent-sdk==0.1.49]
        - name: claude-agent-sdk-latest
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: [claude-agent-sdk]
  google_adk:
    venvs_per_job: 2
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@google_adk'
      - '@llmobs'
      - tests/contrib/google_adk/*
    snapshot: true
    matrix:
      command: pytest -n auto --dist=worksteal {cmdargs} tests/contrib/google_adk
      dependencies: [pytest-asyncio, pytest-xdist, vcrpy, deprecated]
      variants:
        - name: google-adk-1-0-0
          dependencies: [google-adk~=1.0.0]
        - name: google-adk-latest
          dependencies: [google-adk]
  google_genai:
    parallelism: 1
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@google_genai'
      - '@llmobs'
      - tests/contrib/google_genai/*
      - tests/snapshots/tests.contrib.google_genai.*
    snapshot: true
    matrix:
      command: pytest {cmdargs} tests/contrib/google_genai
      dependencies: [pytest-asyncio, google-genai]
  vertexai:
    parallelism: 2
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@vertexai'
      - '@llmobs'
      - tests/contrib/vertexai/*
      - tests/snapshots/tests.contrib.vertexai.*
    snapshot: true
    matrix:
      command: pytest {cmdargs} tests/contrib/vertexai
      dependencies: [pytest-asyncio, vertexai, google-ai-generativelanguage, google-cloud-aiplatform]
      python: ['3.9', '3.10', '3.11', '3.12']
  llama_index:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@llama_index'
      - '@llmobs'
      - tests/contrib/llama_index/*
      - tests/snapshots/tests.contrib.llama_index.*
    snapshot: true
    matrix:
      command: pytest {cmdargs} tests/contrib/llama_index
      dependencies: [pytest-asyncio, vcrpy, llama-index-llms-openai, llama-index-embeddings-openai]
      variants:
        - name: llama-index-core-0-11-0
          python: ['3.10', '3.11', '3.12', '3.13']
          dependencies: [llama-index-core~=0.11.0]
        - name: llama-index-core-latest
          python: ['3.10', '3.11', '3.12', '3.13']
          dependencies: [llama-index-core]
  langchain:
    retry: 2
    parallelism: 6
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@langchain'
      - '@requests'
      - '@llmobs'
      - tests/contrib/langchain/*
      - tests/snapshots/tests.contrib.langchain.*
    snapshot: true
    matrix:
      command: pytest -v {cmdargs} tests/contrib/langchain
      dependencies:
        - pytest-asyncio==0.23.7
        - tiktoken
        - huggingface-hub
        - ai21
        - exceptiongroup
        - psutil
        - pytest-randomly==3.10.1
        - numexpr==2.8.5
        - greenlet==3.0.3
        - respx
        - numpy
      variants:
        - name: langchain-core-0-1-0-langchain-openai-0-1-0-langchain-anthropic
          python: ['3.9', '3.10', '3.11', '3.12']
          dependencies:
            - langchain-core~=0.1.0
            - langchain-openai~=0.1.0
            - langchain-anthropic~=0.1.0
            - langchain-aws~=0.1.0
            - langchain-cohere~=0.1.0
        - name: langchain-core-0-3-0-langchain-openai-0-3-0-langchain-anthropic
          python: ['3.9', '3.10', '3.11', '3.12']
          dependencies:
            - langchain-core~=0.3.0
            - langchain-openai~=0.3.0
            - langchain-anthropic~=0.3.0
            - langchain-aws~=0.2.0
            - langchain-cohere~=0.3.0
            - langchain-google-genai~=2.0.0
        - name: langchain-core-latest-langchain-openai-latest-langchain-anthropi
          python: ['3.10', '3.11', '3.12']
          dependencies:
            - langchain-core
            - langchain-openai
            - langchain-anthropic
            - langchain-aws
            - langchain-cohere
            - langchain-google-genai
  litellm:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@litellm'
      - '@llmobs'
      - tests/contrib/litellm/*
      - tests/snapshots/tests.contrib.litellm.*
    snapshot: true
    venvs_per_job: 1
    matrix:
      command: pytest {cmdargs} tests/contrib/litellm
      dependencies: [vcrpy, pytest-asyncio, botocore, boto3]
      variants:
        - name: litellm-1-65-4-openai-1-68-2
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [litellm==1.65.4, openai==1.68.2]
        - name: litellm-1-80-16-openai-gte-2-8-0
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [litellm==1.80.16, openai>=2.8.0]
  llmobs:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@llmobs'
      - tests/llmobs/*
      - tests/cassettes/anthropic/*
      - tests/cassettes/azure_openai/*
      - tests/cassettes/bedrock/*
      - tests/cassettes/datadog/*
      - tests/cassettes/genai/*
      - tests/cassettes/openai/*
      - tests/cassettes/vertexai/*
      - tests/cassettes/tests.llmobs.*
    snapshot: true
    venvs_per_job: 1
    matrix:
      command: pytest -n auto --dist=worksteal {cmdargs} tests/llmobs
      dependencies: [pytest-xdist]
      variants:
        - name: vcrpy-latest-openai-latest-google-cloud-aiplatform-latest-boto3
          python: ['3.9']
          dependencies:
            - vcrpy
            - openai
            - google-cloud-aiplatform
            - boto3
            - pytest-asyncio==0.21.1
            - langchain
            - pandas
            - openfeature-sdk>=0.8,<1
        - name: vcrpy-latest-openai-latest-google-cloud-aiplatform-latest-boto3-2
          python: ['3.10', '3.11', '3.12', '3.13']
          dependencies:
            - vcrpy
            - openai
            - google-cloud-aiplatform
            - boto3
            - pytest-asyncio==0.21.1
            - langchain
            - pandas
            - openfeature-sdk>=0.8,<1
            - deepeval
            - pydantic-evals>=1.31
        - name: pydantic-1-10
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [pydantic~=1.10]
          command: pytest -n auto --dist=worksteal {cmdargs} tests/llmobs/test_utils.py
  mcp:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@mcp'
      - '@llmobs'
      - tests/contrib/mcp/*
      - tests/snapshots/tests.contrib.mcp.*
    snapshot: true
    venvs_per_job: 5
    matrix:
      command: pytest {cmdargs} tests/contrib/mcp
      dependencies: [pytest-asyncio]
      variants:
        - name: mcp-1-10-0
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: [mcp~=1.10.0]
        - name: mcp-latest
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: [mcp]
  mistralai:
    parallelism: 1
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@mistralai'
      - '@llmobs'
      - tests/contrib/mistralai/*
      - tests/cassettes/mistral/*
      - tests/snapshots/tests.contrib.mistralai.*
    snapshot: true
    matrix:
      command: pytest {cmdargs} tests/contrib/mistralai
      dependencies: [pytest-asyncio]
      variants:
        - name: mistralai-2-0-0
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: [mistralai~=2.0.0]
        - name: mistralai-latest
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: [mistralai]
  openai:
    venvs_per_job: 1
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@openai'
      - '@requests'
      - '@llmobs'
      - tests/contrib/openai/*
      - tests/snapshots/tests.contrib.openai.*
    pattern: ^openai$
    snapshot: true
    matrix:
      command: pytest {cmdargs} tests/contrib/openai
      dependencies: [vcrpy, urllib3~=1.26, pytest-asyncio==0.21.1, pytest-randomly]
      variants:
        - name:
            openai-embeddings-datalib-1-0-0-openai-embeddings-datalib-pillow-9-5-0-httpx-0-27-2
          python: ['3.9', '3.10', '3.11']
          dependencies: [pillow==9.5.0, httpx==0.27.2, 'openai[embeddings,datalib]==1.0.0']
        - name:
            openai-embeddings-datalib-1-30-1-openai-embeddings-datalib-pillow-9-5-0-httpx-0-27-2
          python: ['3.9', '3.10', '3.11']
          dependencies: [pillow==9.5.0, httpx==0.27.2, 'openai[embeddings,datalib]==1.30.1']
        - name: openai-latest-openai-pillow-latest
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [pillow, openai]
        - name: openai-lt-2-0-0-openai-pillow-latest
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [pillow, openai<2.0.0]
        - name: openai-1-76-2-openai-pillow-latest
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [pillow, openai~=1.76.2]
        - name: openai-1-66-0-openai-pillow-latest
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [pillow, openai==1.66.0]
  langgraph:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@langgraph'
      - '@requests'
      - '@llmobs'
      - tests/contrib/langgraph/*
    snapshot: true
    venvs_per_job: 4
    matrix:
      command: pytest {cmdargs} tests/contrib/langgraph
      dependencies: [pytest-asyncio, langchain_openai, langchain_core, langchain]
      variants:
        - name: langgraph-0-2-23-variant-1
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [langgraph==0.2.23]
        - name: langgraph-0-3-21-variant-1
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [langgraph==0.3.21]
        - name: langgraph-0-3-22-variant-1
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [langgraph==0.3.22]
        - name: langgraph-latest-variant-1
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [langgraph]
        - name: langgraph-0-2-23-ormsgpack-gte-1-11-0
          python: ['3.14']
          dependencies: [ormsgpack>=1.11.0, langgraph==0.2.23]
        - name: langgraph-0-3-21-ormsgpack-gte-1-11-0
          python: ['3.14']
          dependencies: [ormsgpack>=1.11.0, langgraph==0.3.21]
        - name: langgraph-0-3-22-ormsgpack-gte-1-11-0
          python: ['3.14']
          dependencies: [ormsgpack>=1.11.0, langgraph==0.3.22]
        - name: langgraph-latest-ormsgpack-gte-1-11-0
          python: ['3.14']
          dependencies: [ormsgpack>=1.11.0, langgraph]
  crewai:
    retry: 2
    parallelism: 3
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@crewai'
      - '@requests'
      - '@llmobs'
      - tests/contrib/crewai/*
      - tests/snapshots/tests.contrib.crewai.*
    snapshot: true
    matrix:
      command: pytest {cmdargs} tests/contrib/crewai
      dependencies: [pytest-asyncio, openai, vcrpy==7.0.0]
      variants:
        - name: crewai-0-102-0
          python: ['3.10', '3.11', '3.12']
          dependencies: [crewai~=0.102.0]
        - name: crewai-latest
          python: ['3.10', '3.11', '3.12']
          dependencies: [crewai]
  openai_agents:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@openai_agents'
      - '@llmobs'
      - tests/contrib/openai_agents/*
      - tests/snapshots/tests.contrib.openai_agents.*
    snapshot: true
    venvs_per_job: 2
    matrix:
      command: pytest {cmdargs} tests/contrib/openai_agents
      dependencies: [vcrpy, pytest-asyncio, openai]
      variants:
        - name: openai-agents-0-0-0-openai-agents-urllib3-lt-2-eval-type-backport-latest
          python: ['3.9']
          dependencies: [urllib3<2, eval-type-backport, openai-agents~=0.0.0]
        - name: openai-agents-0-8-0-openai-agents-urllib3-lt-2-eval-type-backport-latest
          python: ['3.9']
          dependencies: [urllib3<2, eval-type-backport, openai-agents~=0.8.0]
        - name: openai-agents-0-0-0-openai-agents
          python: ['3.10', '3.11', '3.12', '3.13']
          dependencies: [openai-agents~=0.0.0]
        - name: openai-agents-0-8-0-openai-agents
          python: ['3.10', '3.11', '3.12', '3.13']
          dependencies: [openai-agents~=0.8.0]
        - name: openai-agents-0-14-0-openai-agents-2
          python: ['3.10', '3.11', '3.12', '3.13']
          dependencies: [openai-agents~=0.14.0]
        - name: openai-agents-latest-openai-agents-2
          python: ['3.10', '3.11', '3.12', '3.13']
          dependencies: [openai-agents]
  pydantic_ai:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@pydantic_ai'
      - '@llmobs'
      - tests/contrib/pydantic_ai/*
      - tests/snapshots/tests.contrib.pydantic_ai.*
    snapshot: true
    venvs_per_job: 2
    matrix:
      command: pytest {cmdargs} tests/contrib/pydantic_ai
      dependencies: [pytest-asyncio, vcrpy==7.0.0, typing_extensions]
      variants:
        - name: pydantic-ai-slim-openai-0-8-1-pydantic-2-12-0a1
          python: ['3.9']
          dependencies: ['pydantic-ai-slim[openai]==0.8.1', pydantic==2.12.0a1]
        - name: pydantic-ai-slim-openai-0-8-1-pydantic-ai-slim-openai-pydantic-2-12-0a1
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: [pydantic==2.12.0a1, 'pydantic-ai-slim[openai]==0.8.1']
        - name: pydantic-ai-slim-openai-1-0-0-pydantic-ai-slim-openai-pydantic-2-12-0a1
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: [pydantic==2.12.0a1, 'pydantic-ai-slim[openai]==1.0.0']
        - name: pydantic-ai-slim-openai-1-63-0
          python: ['3.10', '3.11', '3.12', '3.13', '3.14']
          dependencies: ['pydantic-ai-slim[openai]==1.63.0']
  vllm:
    venvs_per_job: 1
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@vllm'
      - '@llmobs'
      - tests/contrib/vllm/*
      - tests/snapshots/tests.contrib.vllm.*
    gpu: true
    snapshot: true
    skip: true # Temporarily disabled
    matrix:
      command: pytest {cmdargs} tests/contrib/vllm
      dependencies: [pytest-asyncio==0.21.1, pytest-randomly, torch, vllm>=0.10.2]
      python: ['3.10', '3.11', '3.12', '3.13']
