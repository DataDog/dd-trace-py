---
components:
  $harness:
    - docker/*
    - docker-compose.base.yml
    - docker-compose.podman.yml
    - docker-compose.yml
    - riotfile.py
    - .riot/requirements/*
    - scripts/ddtest
    - pyproject.toml
    - tests/conftest.py
    - tests/utils.py
    - tests/__init__.py
    - tests/suitespec.yml
    - tests/suitespec.py
    - tests/meta/*
    - tests/smoke_test.py
    - tests/subprocesstest.py
    - tests/wait-for-services.py
    - tests/webclient.py
    - tests/test_module/*
    - .gitlab-ci.yml
    - .gitlab/*
  $setup:
    - setup.py
    - setup.cfg
    - pyproject.toml
  bootstrap:
    - ddtrace/bootstrap/*
    - ddtrace/commands/*
    - ddtrace/auto.py
  crashtracker:
    - ddtrace/internal/core/crashtracking.py
    - ddtrace/internal/settings/crashtracker.py
    - ddtrace/internal/native/_native.pyi
    - src/native/crashtracker.rs
    - src/native/crashtracker/*
    - tests/crashtracker/*
  ci:
    - ddtrace/ext/ci/*
  codeowners:
    - ddtrace/internal/codeowners.py
  core:
    - ddtrace/internal/__init__.py
    - ddtrace/internal/_exceptions.py
    - ddtrace/internal/_service_state.py
    - ddtrace/internal/_threads.*
    - ddtrace/internal/_unpatched.py
    - ddtrace/internal/agent.py
    - ddtrace/internal/assembly.py
    - ddtrace/internal/atexit.py
    - ddtrace/internal/compat.py
    - ddtrace/internal/core/*
    - ddtrace/internal/datadog/__init__.py
    - ddtrace/internal/debug.py
    - ddtrace/internal/dogstatsd.py
    - ddtrace/internal/forksafe.py
    - ddtrace/internal/gitmetadata.py
    - ddtrace/internal/glob_matching.py
    - ddtrace/internal/ipc.py
    - ddtrace/internal/logger.py
    - ddtrace/_logger.py
    - ddtrace/internal/hostname.py
    - ddtrace/internal/http.py
    - ddtrace/internal/bytecode_injection/*
    - ddtrace/internal/logger.py
    - ddtrace/internal/lazy.py
    - ddtrace/internal/metrics.py
    - ddtrace/internal/module.py
    - ddtrace/internal/native/*
    - ddtrace/internal/packages.py
    - ddtrace/internal/third-party.tar.gz
    - ddtrace/internal/periodic.py
    - ddtrace/internal/process_tags/__init__.py
    - ddtrace/internal/products.py
    - ddtrace/internal/rate_limiter.py
    - ddtrace/internal/safety.py
    - ddtrace/internal/service.py
    - ddtrace/internal/uds.py
    - ddtrace/internal/utils/*
    - ddtrace/internal/uwsgi.py
    - ddtrace/internal/wrapping/*
    - ddtrace/__init__.py
    - ddtrace/py.typed
    - ddtrace/version.py
    - ddtrace/internal/settings/_config.py
    - src/native/*
  datastreams:
    - ddtrace/internal/datastreams/*
    - ddtrace/data_streams.py
    - ddtrace/ext/schema.py
  openfeature:
    - ddtrace/openfeature/*
    - ddtrace/internal/openfeature/*
    - tests/openfeature/*
  git:
    - ddtrace/ext/git.py
  lib_injection:
    - lib-injection/*
    - tests/lib_injection/*
  opentelemetry:
    - ddtrace/opentelemetry/*
    - ddtrace/internal/opentelemetry/*
  profiling:
    - ddtrace/profiling/*
    - ddtrace/internal/datadog/profiling/*
    - ddtrace/_trace/processor/endpoint_call_counter.py
    - ddtrace/internal/settings/profiling.py
  remoteconfig:
    - ddtrace/internal/remoteconfig/*
  runtime:
    - ddtrace/runtime/*
  serverless:
    - ddtrace/internal/serverless/*
  settings:
    - ddtrace/internal/settings/*
  sourcecode:
    - ddtrace/sourcecode/*
  symbol_db:
    - ddtrace/internal/symbol_db/*
    - ddtrace/internal/settings/symbol_db.py
  telemetry:
    - ddtrace/internal/telemetry/*
  tracing:
    - ddtrace/_logger.py
    - ddtrace/_monkey.py
    - ddtrace/_trace/*
    - ddtrace/trace/*
    - ddtrace/constants.py
    - ddtrace/internal/settings/__init__.py
    - ddtrace/internal/settings/_config.py
    - ddtrace/internal/settings/http.py
    - ddtrace/internal/settings/integration.py
    - ddtrace/internal/_encoding.py*
    - ddtrace/internal/_tagset.py*
    - ddtrace/internal/_utils.*
    - ddtrace/internal/constants.py
    - ddtrace/internal/encoding.py
    - ddtrace/internal/flare/*
    - ddtrace/internal/pack.h
    - ddtrace/internal/pack_template.h
    - ddtrace/internal/peer_service/*
    - ddtrace/internal/settings/peer_service.py
    - ddtrace/internal/runtime/*
    - ddtrace/internal/sampling.py
    - ddtrace/internal/schema/*
    - ddtrace/internal/sma.py
    - ddtrace/internal/tracemethods.py
    - ddtrace/internal/sysdep.h
    - ddtrace/internal/writer/*
  vendor:
    - ddtrace/vendor/*
suites:
  smoke_test:
    type: helper
    paths:
      - '@core'
      - tests/smoke_test.py
    matrix:
      command: python tests/smoke_test.py {cmdargs}
      python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
      variants: [{name: smoke_test}]
  crashtracker:
    venvs_per_job: 6
    env:
      # Dogfood dynamic ATR (duration-based retry budgets) in this CI suite.
      DD_CIVISIBILITY_DYNAMIC_ATR_ENABLED: '1'
      DD_CIVISIBILITY_DYNAMIC_ATR_BUCKETS: '6,4,3,1,1'
    paths:
      - '@crashtracker'
      - '@core'
      - '@profiling'
    snapshot: true
    matrix:
      command: pytest -v {cmdargs} tests/crashtracker/
      env:
        DD_CIVISIBILITY_ITR_ENABLED: '0'
        DD_INSTRUMENTATION_TELEMETRY_ENABLED: '0'
      variants:
        - name: crashtracker
          dependencies: [pytest-randomly, 'python-json-logger==2.0.7', pyfakefs, 'pytest-asyncio~=0.23.7', 'setuptools<82']
          python: ['3.9', '3.10', '3.11']
        - name: crashtracker
          python: ['3.12', '3.13', '3.14']
          dependencies: [pytest-randomly, 'python-json-logger==2.0.7', pyfakefs, 'pytest-asyncio~=0.23.7', 'setuptools<82', 'zope-event==5.0', 'zope-interface==7.2']
          env:
            PYTHONWARNINGS: 'ignore:This process:DeprecationWarning::'
  conftest:
    parallelism: 1
    paths:
      - 'conftest.py'
      - '**/conftest.py'
      - 'tests/_ddtest_conftest_helpers.py'
      - 'tests/_ddtest_env_helpers.py'
    pattern: meta-testing
    snapshot: false
    matrix:
      command: pytest {cmdargs} tests/meta
      env:
        DD_CIVISIBILITY_FLAKY_RETRY_ENABLED: '0'
        DD_TRACE_PY_ENABLE_ITR_FOR_JOB: 'false'
      python: ['3.10']
      variants: [{name: meta-testing}]
  ddtracerun:
    parallelism: 3
    paths:
      - '@contrib'
      - '@bootstrap'
      - '@core'
      - tests/commands/*
      - tests/ddtrace_run.py
    services:
      - redis
    matrix:
      command: pytest {cmdargs} --no-cov tests/commands/test_runner.py
      variants:
        - name: ddtracerun
          dependencies: [redis, gevent, pytest-randomly]
  detect_global_locks:
    venvs_per_job: 1
    paths:
      - 'ddtrace/*'
      - 'setup.py'
      - 'setup.cfg'
      - 'pyproject.toml'
      - 'src/native/*'
      - 'scripts/global-lock-detection.py'
    matrix:
      command: python -X importtime scripts/global-lock-detection.py
      env:
        DD_APPSEC_ENABLED: '1'
        DD_APPSEC_SCA_ENABLED: '1'
        DD_CODE_ORIGIN_FOR_SPANS_ENABLED: '1'
        DD_DYNAMIC_INSTRUMENTATION_ENABLED: '1'
        DD_EXCEPTION_REPLAY_ENABLED: '1'
        DD_IAST_ENABLED: '1'
        DD_PROFILING_ENABLED: '1'
        DD_PROFILING_LOCK_ENABLED: '0'
        DD_REMOTE_CONFIGURATION_ENABLED: '1'
        DD_RUNTIME_METRICS_ENABLED: '1'
        DD_TRACE_PY_ENABLE_ITR_FOR_JOB: 'false'
      variants: [{name: detect_global_locks}]
  integration_agent:
    ddtest_nodes: 2
    ddtest: true
    env:
      _DD_PYTEST_XDIST_INFERRED_SERVICE: tests.integration
    parallelism: 2
    paths:
      - '@tracing'
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@vendor'
      - tests/integration/*
      - tests/snapshots/tests.integration.*
    pattern: integration-latest*
    matrix:
      env:
        AGENT_VERSION: latest
      variants:
        - name: integration-latest
          dependencies: [msgpack, pytest-randomly]
          command: pytest -vv --no-cov --ignore-glob='*civisibility*' {cmdargs} ${{DDTEST_SUITE_PATH}}/
          env:
            DDTEST_SUITE_PATH: tests/integration
            DDTEST_TESTS_LOCATION: tests/integration/**/test*.py
            DDTEST_PYTEST_ADDOPTS: "-vv --ignore-glob='*civisibility*'"
        - name: integration-latest-civisibility
          dependencies: [msgpack, pytest-randomly]
          command: pytest --no-cov {cmdargs} ${{DDTEST_SUITE_PATH}}
          env:
            DDTEST_SUITE_PATH: tests/integration/test_integration_civisibility.py
            DDTEST_TESTS_LOCATION: tests/integration/test_integration_civisibility.py
  integration_testagent:
    ddtest_nodes: 2
    ddtest: true
    env:
      _DD_PYTEST_XDIST_INFERRED_SERVICE: tests.integration
      # Dogfood dynamic ATR (duration-based retry budgets) in this CI suite.
      DD_CIVISIBILITY_DYNAMIC_ATR_ENABLED: '1'
      DD_CIVISIBILITY_DYNAMIC_ATR_BUCKETS: '6,4,3,1,1'
    venvs_per_job: 3
    paths:
      - '@tracing'
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@vendor'
      - tests/integration/*
      - tests/snapshots/tests.integration.*
    pattern: integration-snapshot*
    snapshot: true
    matrix:
      env:
        AGENT_VERSION: testagent
      variants:
        - name: integration-snapshot
          dependencies: [msgpack, pytest-randomly]
          command: pytest -vv --no-cov --ignore-glob='*civisibility*' {cmdargs} ${{DDTEST_SUITE_PATH}}/
          env:
            DDTEST_SUITE_PATH: tests/integration
            DDTEST_TESTS_LOCATION: tests/integration/**/test*.py
            DDTEST_PYTEST_ADDOPTS: "-vv --ignore-glob='*civisibility*'"
        - name: integration-snapshot-civisibility
          dependencies: [msgpack, pytest-randomly]
          command: pytest --no-cov {cmdargs} ${{DDTEST_SUITE_PATH}}
          env:
            DDTEST_SUITE_PATH: tests/integration/test_integration_civisibility.py
            DDTEST_TESTS_LOCATION: tests/integration/test_integration_civisibility.py
  internal:
    retry: 2
    venvs_per_job: 2
    env:
      # Dogfood dynamic ATR (duration-based retry budgets) in this CI suite.
      DD_CIVISIBILITY_DYNAMIC_ATR_ENABLED: '1'
      DD_CIVISIBILITY_DYNAMIC_ATR_BUCKETS: '6,4,3,1,1'
    paths:
      - '@core'
      - '@remoteconfig'
      - '@symbol_db'
      - '@tracing'
      - '@vendor'
      - ddtrace/internal/*
      - scripts/gen_gitlab_config.py
      - tests/internal/*
      - tests/submod/*
      - tests/cache/*
      - tests/snapshots/tests.internal.*
    snapshot: true
    matrix:
      command: pytest -v -n auto --dist=worksteal {cmdargs} tests/internal/
      env:
        DD_CIVISIBILITY_ITR_ENABLED: '0'
        DD_INSTRUMENTATION_TELEMETRY_ENABLED: '0'
        # uWSGI leaves native objects in uv's shared source cache across Python builds.
        # Disable that cache only for internal-suite environment construction.
        UV_NO_CACHE: '1'
      variants:
        - name: internal
          python: ['3.9', '3.10', '3.11']
          dependencies: [httpretty, gevent, pytest-randomly, pytest-xdist, 'python-json-logger==2.0.7', pyfakefs, pytest-benchmark, wrapt, uwsgi, PyYAML, cloudpickle, 'pytest-asyncio~=0.23.7', 'setuptools<82']
        - name: internal
          python: ['3.9', '3.10', '3.11']
          dependencies: [httpretty, gevent, pytest-randomly, pytest-xdist, 'python-json-logger==2.0.7', pyfakefs, pytest-benchmark, 'wrapt<2.0.0', uwsgi, PyYAML, cloudpickle, 'pytest-asyncio~=0.23.7', 'setuptools<82']
        - name: internal
          python: ['3.12', '3.13', '3.14']
          dependencies: [httpretty, gevent, pytest-randomly, pytest-xdist, 'python-json-logger==2.0.7', pyfakefs, pytest-benchmark, wrapt, uwsgi, PyYAML, cloudpickle, 'pytest-asyncio~=0.23.7', 'setuptools<82', 'zope-event==5.0', 'zope-interface==7.2']
          env:
            PYTHONWARNINGS: 'ignore:This process:DeprecationWarning::'
        - name: internal
          python: ['3.12', '3.13', '3.14']
          dependencies: [httpretty, gevent, pytest-randomly, pytest-xdist, 'python-json-logger==2.0.7', pyfakefs, pytest-benchmark, 'wrapt<2.0.0', uwsgi, PyYAML, cloudpickle, 'pytest-asyncio~=0.23.7', 'setuptools<82', 'zope-event==5.0', 'zope-interface==7.2']
          env:
            PYTHONWARNINGS: 'ignore:This process:DeprecationWarning::'
        - name: internal
          command: pytest -v {cmdargs} tests/internal/bytecode_injection/test_pyarmor_obfuscation.py
          dependencies: [httpretty, gevent, pytest-randomly, pytest-xdist, 'python-json-logger==2.0.7', pyfakefs, pytest-benchmark, wrapt, uwsgi, PyYAML, cloudpickle, pyarmor]
  wrapping:
    venvs_per_job: 6
    paths:
      - '@core'
      - '@tracing'
      - ddtrace/internal/wrapping/*
      - ddtrace/_trace/tracer.py
      - tests/wrapping/*
    matrix:
      command: pytest -v -n auto --dist=worksteal {cmdargs} tests/wrapping/
      env:
        DD_TRACE_WRAP_SPAN_NAME_INCLUDE_CLASS: 'true'
      variants:
        - name: wrapping
          dependencies: [pytest-xdist, wrapt]
        - name: wrapping
          dependencies: [pytest-xdist, 'wrapt<2.0.0']
  lib_injection:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@lib_injection'
    parallelism: 2
    pattern: ^lib_injection$
    matrix:
      command: pytest {cmdargs} tests/lib_injection/
      variants:
        - name: lib_injection
          dependencies: [PyYAML, 'pip==26.0.1; python_version < ''3.10''', 'pip==26.2.1; python_version >= ''3.10''', pytest-randomly]
          riot_lock_dependencies: [mock, pytest, pytest-mock, coverage, pytest-cov, opentracing, 'hypothesis<6.45.1', PyYAML, pytest-randomly]
  runtime:
    paths:
      - '@bootstrap'
      - '@core'
      - '@runtime'
      - '@vendor'
      - tests/runtime/*
    skip: true
    matrix:
      command: pytest {cmdargs} tests/runtime/
      variants:
        - name: runtime
          dependencies: [msgpack, pytest-randomly]
  openfeature:
    parallelism: 1
    paths:
      - '@openfeature'
      - '@remoteconfig'
      - '@core'
    pattern: ^openfeature$
    matrix:
      command: pytest {cmdargs} tests/openfeature
      variants:
        - name: openfeature
          dependencies: [pytest-randomly, 'openfeature-sdk~=0.8.0']
        - name: openfeature
          dependencies: [pytest-randomly, openfeature-sdk]
  telemetry:
    parallelism: 1
    env:
      # Dogfood dynamic ATR (duration-based retry budgets) in this CI suite.
      DD_CIVISIBILITY_DYNAMIC_ATR_ENABLED: '1'
      DD_CIVISIBILITY_DYNAMIC_ATR_BUCKETS: '6,4,3,1,1'
    paths:
      - '@bootstrap'
      - '@contrib'
      - '@core'
      - '@telemetry'
      - '@tracing'
      - '@settings'
      - '@profiling'
      - '@vendor'
      # tests/telemetry runs real django and flask apps; '@contrib' is only shared infrastructure.
      - '@django'
      - '@flask'
      - tests/telemetry/*
      - tests/snapshots/tests.telemetry.*
    snapshot: true
    matrix:
      command: pytest {cmdargs} tests/telemetry/
      variants:
        - name: telemetry
          python: ['3.14']
          dependencies: [requests, gunicorn, 'httpretty<1.1', pytest-randomly, xmltodict, django, 'flask>=3.1.2']
        - name: telemetry
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [requests, gunicorn, 'httpretty<1.1', pytest-randomly, xmltodict, django, 'flask<=2.2.3', 'werkzeug<2.0', 'markupsafe<2.0']
  tracer:
    ddtest: true
    ddtest_nodes: 2
    env:
      DD_TRACE_AGENT_URL: http://localhost:8126
      DDTEST_SUITE_PATH: tests/tracer
      DDTEST_TESTS_LOCATION: tests/tracer/**/test*.py
      DD_TEST_OPTIMIZATION_RUNNER_TESTS_EXCLUDE_PATTERN: tests/tracer/test_uwsgi_*.py
      KUBERNETES_MEMORY_REQUEST: "4Gi"
      KUBERNETES_MEMORY_LIMIT: "4Gi"
    paths:
      - '@tracing'
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@llmobs'
      - '@serverless'
      - '@remoteconfig'
      - '@futures'
      - '@ci_visibility'
      - '@vendor'
      - tests/tracer/*
      - tests/snapshots/test_*
    retry: 2
    venvs_per_job: 1
    matrix:
      command: pytest -v {cmdargs} --ignore=tests/tracer/test_uwsgi_shutdown.py --ignore=tests/tracer/test_uwsgi_fork_hooks.py tests/tracer/
      env:
        DD_CIVISIBILITY_LOG_LEVEL: none
        DD_INSTRUMENTATION_TELEMETRY_ENABLED: '0'
        _DD_CIVISIBILITY_PARTIAL_FLUSH_MIN_SPANS: '50'
        DDTEST_SUITE_PATH: tests/tracer
        DDTEST_TESTS_LOCATION: tests/tracer/**/test*.py
        DD_TEST_OPTIMIZATION_RUNNER_TESTS_EXCLUDE_PATTERN: tests/tracer/test_uwsgi_*.py
        _DD_PYTEST_XDIST_INFERRED_SERVICE: tests.tracer
      variants:
        - name: tracer
          dependencies: [msgpack, attrs, structlog, httpretty, wheel, fastapi, 'httpx<0.28.0', pytest-randomly, setuptools, boto3, freezegun]
        - name: tracer-python-optimize
          dependencies: [msgpack, attrs, structlog, httpretty, wheel, fastapi, 'httpx<0.28.0', pytest-randomly, setuptools, boto3, freezegun]
          env:
            PYTHONOPTIMIZE: '1'
        - name: tracer-legacy-attrs
          python: ['3.9']
          dependencies: [msgpack, 'attrs==22.1.0', structlog, httpretty, wheel, fastapi, 'httpx<0.28.0', pytest-randomly, setuptools, boto3, freezegun, 'cattrs<23.2.0']
        - name: tracer-128-bit-traceid-disabled
          python: ['3.14']
          dependencies: [msgpack, attrs, structlog, httpretty, wheel, fastapi, 'httpx<0.28.0', pytest-randomly, setuptools, boto3, freezegun]
          env:
            DD_TRACE_128_BIT_TRACEID_GENERATION_ENABLED: 'false'
  tracer-uwsgi:
    venvs_per_job: 1
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@vendor'
      - tests/tracer/test_uwsgi_shutdown.py
      - tests/tracer/test_uwsgi_fork_hooks.py
      - tests/tracer/uwsgi-app.py
      - tests/tracer/uwsgi-fork-smoke-app.py
      - tests/contrib/uwsgi/__init__.py
    pattern: tracer-uwsgi
    matrix:
      command: pytest -v {cmdargs} tests/tracer/test_uwsgi_shutdown.py tests/tracer/test_uwsgi_fork_hooks.py
      env:
        DDTEST_SUITE_PATH: tests/tracer
        DDTEST_TESTS_LOCATION: tests/tracer/**/test*.py
        DD_TEST_OPTIMIZATION_RUNNER_TESTS_EXCLUDE_PATTERN: tests/tracer/test_uwsgi_*.py
        _DD_PYTEST_XDIST_INFERRED_SERVICE: tests.tracer
        DD_CIVISIBILITY_LOG_LEVEL: none
        DD_INSTRUMENTATION_TELEMETRY_ENABLED: '0'
        _DD_CIVISIBILITY_PARTIAL_FLUSH_MIN_SPANS: '50'
      variants:
        - name: tracer-uwsgi
          python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies: [msgpack, attrs, structlog, httpretty, wheel, fastapi, 'httpx<0.28.0', pytest-randomly, setuptools, boto3, freezegun, uwsgi]
  wait:
    type: helper
    paths:
      - tests/wait-for-services.py
    matrix:
      # Python 3.10 is incompatible with the pinned kombu and vertica clients.
      command: python tests/wait-for-services.py {cmdargs}
      env:
        AGENT_VERSION: testagent
        DD_TRACE_AGENT_URL: http://testagent:9126
      python: ['3.9']
      variants:
        - name: wait
          dependencies: [azure-data-tables, azure-storage-blob, azure-storage-queue, cassandra-driver, psycopg2-binary, 'mysql-connector-python!=8.0.18', 'vertica-python>=0.6.0,<0.7.0', 'kombu>=4.2.0,<4.3.0', pymssql, pytest-randomly, redis, requests]
  vendor:
    parallelism: 1
    paths:
      - '@vendor'
      - tests/vendor/*
    matrix:
      command: pytest {cmdargs} tests/vendor/
      variants:
        - name: vendor
          dependencies: ['msgpack~=1.0.0', pytest-randomly]
        - name: vendor
          dependencies: [msgpack, pytest-randomly]
