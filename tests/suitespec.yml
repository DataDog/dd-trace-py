---
matrix_defaults:
  dependencies:
    - mock
    - pytest
    - pytest-mock
    - coverage
    - pytest-cov
    - opentracing
    - hypothesis<6.45.1
  dependency_groups:
    - test-common
  env:
    _DD_CIVISIBILITY_USE_CI_CONTEXT_PROVIDER: '1'
    DD_TESTING_RAISE: '1'
    DD_REMOTE_CONFIGURATION_ENABLED: 'false'
    DD_INJECTION_ENABLED: '1'
    DD_INJECT_FORCE: '1'
    DD_PATCH_MODULES: 'unittest:false'
    CMAKE_BUILD_PARALLEL_LEVEL: '12'
    CARGO_BUILD_JOBS: '12'
    DD_TRACE_COMPUTE_STATS: 'false'
    DD_CODE_ORIGIN_FOR_SPANS_ENABLED: 'false'
    DD_CIVISIBILITY_BACKEND_API_TIMEOUT_MILLIS: '2000'
    _DD_CIVISIBILITY_OUT_OF_SESSION_RETRIES_ENABLED: '1'
  nightly_env:
    DD_CIVISIBILITY_CODE_COVERAGE_REPORT_UPLOAD_ENABLED: '1'
components:
  $harness:
    - docker/*
    - docker-compose.base.yml
    - docker-compose.podman.yml
    - docker-compose.yml
    - scripts/ddtest
    - scripts/_testenv.py
    - scripts/test-env
    - pyproject.toml
    - tests/conftest.py
    - tests/utils.py
    - tests/__init__.py
    - tests/suitespec.yml
    - tests/suitespec.py
    - .uv/*.txt
    - tests/meta/*
    - tests/smoke_test.py
    - tests/subprocesstest.py
    - tests/wait-for-services.py
    - tests/webclient.py
    - tests/test_module/*
    - .gitlab-ci.yml
    - .gitlab/*
  $setup:
    - setup.py
    - setup.cfg
    - pyproject.toml
  bootstrap:
    - ddtrace/bootstrap/*
    - ddtrace/commands/*
    - ddtrace/auto.py
  crashtracker:
    - ddtrace/internal/core/crashtracking.py
    - ddtrace/internal/settings/crashtracker.py
    - ddtrace/internal/native/_native.pyi
    - src/native/crashtracker.rs
    - src/native/crashtracker/*
    - tests/crashtracker/*
  ci:
    - ddtrace/ext/ci/*
  codeowners:
    - ddtrace/internal/codeowners.py
  core:
    - ddtrace/internal/__init__.py
    - ddtrace/internal/_exceptions.py
    - ddtrace/internal/_service_state.py
    - ddtrace/internal/_threads.*
    - ddtrace/internal/_unpatched.py
    - ddtrace/internal/agent.py
    - ddtrace/internal/assembly.py
    - ddtrace/internal/atexit.py
    - ddtrace/internal/compat.py
    - ddtrace/internal/core/*
    - ddtrace/internal/datadog/__init__.py
    - ddtrace/internal/debug.py
    - ddtrace/internal/dogstatsd.py
    - ddtrace/internal/forksafe.py
    - ddtrace/internal/gitmetadata.py
    - ddtrace/internal/glob_matching.py
    - ddtrace/internal/ipc.py
    - ddtrace/internal/logger.py
    - ddtrace/_logger.py
    - ddtrace/internal/hostname.py
    - ddtrace/internal/http.py
    - ddtrace/internal/bytecode_injection/*
    - ddtrace/internal/logger.py
    - ddtrace/internal/metrics.py
    - ddtrace/internal/module.py
    - ddtrace/internal/native/*
    - ddtrace/internal/packages.py
    - ddtrace/internal/third-party.tar.gz
    - ddtrace/internal/periodic.py
    - ddtrace/internal/process_tags/__init__.py
    - ddtrace/internal/products.py
    - ddtrace/internal/rate_limiter.py
    - ddtrace/internal/safety.py
    - ddtrace/internal/service.py
    - ddtrace/internal/uds.py
    - ddtrace/internal/utils/*
    - ddtrace/internal/uwsgi.py
    - ddtrace/internal/wrapping/*
    - ddtrace/__init__.py
    - ddtrace/py.typed
    - ddtrace/version.py
    - ddtrace/internal/settings/_config.py
    - src/native/*
  datastreams:
    - ddtrace/internal/datastreams/*
    - ddtrace/data_streams.py
    - ddtrace/ext/schema.py
  openfeature:
    - ddtrace/openfeature/*
    - ddtrace/internal/openfeature/*
    - tests/openfeature/*
  git:
    - ddtrace/ext/git.py
  lib_injection:
    - lib-injection/*
    - tests/lib_injection/*
  opentelemetry:
    - ddtrace/opentelemetry/*
    - ddtrace/internal/opentelemetry/*
  profiling:
    - ddtrace/profiling/*
    - ddtrace/internal/datadog/profiling/*
    - ddtrace/_trace/processor/endpoint_call_counter.py
    - ddtrace/internal/settings/profiling.py
  remoteconfig:
    - ddtrace/internal/remoteconfig/*
  runtime:
    - ddtrace/runtime/*
  serverless:
    - ddtrace/internal/serverless/*
  settings:
    - ddtrace/internal/settings/*
  sourcecode:
    - ddtrace/sourcecode/*
  symbol_db:
    - ddtrace/internal/symbol_db/*
    - ddtrace/internal/settings/symbol_db.py
  telemetry:
    - ddtrace/internal/telemetry/*
  tracing:
    - ddtrace/_logger.py
    - ddtrace/_monkey.py
    - ddtrace/_trace/*
    - ddtrace/trace/*
    - ddtrace/constants.py
    - ddtrace/internal/settings/__init__.py
    - ddtrace/internal/settings/_config.py
    - ddtrace/internal/settings/http.py
    - ddtrace/internal/settings/integration.py
    - ddtrace/internal/_encoding.py*
    - ddtrace/internal/_tagset.py*
    - ddtrace/internal/_utils.*
    - ddtrace/internal/constants.py
    - ddtrace/internal/encoding.py
    - ddtrace/internal/flare/*
    - ddtrace/internal/pack.h
    - ddtrace/internal/pack_template.h
    - ddtrace/internal/peer_service/*
    - ddtrace/internal/settings/peer_service.py
    - ddtrace/internal/runtime/*
    - ddtrace/internal/sampling.py
    - ddtrace/internal/schema/*
    - ddtrace/internal/sma.py
    - ddtrace/internal/tracemethods.py
    - ddtrace/internal/sysdep.h
    - ddtrace/internal/writer/*
  vendor:
    - ddtrace/vendor/*
suites:
  build_docs:
    type: helper
    paths:
      - docs/*
      - scripts/docs/*
      - benchmarks/README.rst
      - .readthedocs.yml
    matrix:
      python: ['3.10']
      command: scripts/docs/build.sh
      dependencies:
        - reno~=3.5.0
        - sphinx~=4.0
        - sphinxcontrib-applehelp<1.0.8
        - sphinxcontrib-devhelp<1.0.6
        - sphinxcontrib-htmlhelp<2.0.5
        - sphinxcontrib-serializinghtml<1.1.10
        - sphinxcontrib-qthelp<1.0.7
        - sphinxcontrib-spelling==7.7.0
        - PyEnchant==3.2.2
        - sphinx-copybutton==0.5.1
        - furo<=2023.05.20
        - standard-imghdr
      env:
        DD_TRACE_ENABLED: 'false'
  smoke_test:
    type: helper
    paths:
      - '@core'
      - tests/smoke_test.py
    matrix:
      python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      command: python tests/smoke_test.py {cmdargs}
  reno:
    type: helper
    install_project: false
    paths:
      - releasenotes/*
      - docs/releasenotes.rst
    matrix:
      python: ['3']
      command: reno {cmdargs}
      dependencies:
        - reno
        - PyYAML>=6.0.1
  crashtracker:
    venvs_per_job: 6
    paths:
      - '@crashtracker'
      - '@core'
      - '@profiling'
    snapshot: true
    matrix:
      command: pytest -v {cmdargs} tests/crashtracker/
      dependencies:
        - pytest-randomly
        - python-json-logger==2.0.7
        - pyfakefs
        - pytest-asyncio~=0.23.7
        - setuptools<82
      env:
        DD_INSTRUMENTATION_TELEMETRY_ENABLED: '0'
        DD_CIVISIBILITY_ITR_ENABLED: '0'
      cases:
        - python: ['3.9', '3.10', '3.11']
        - python: ['3.12', '3.13', '3.14']
          dependencies:
            - zope-event==5.0
            - zope-interface==7.2
          env:
            PYTHONWARNINGS: 'ignore:This process:DeprecationWarning::'
  conftest:
    parallelism: 1
    paths:
      - 'conftest.py'
      - '**/conftest.py'
    pattern: meta-testing
    snapshot: false
    matrix:
      name: meta-testing
      python: ['3.10']
      command: pytest {cmdargs} tests/meta
      env:
        DD_CIVISIBILITY_FLAKY_RETRY_ENABLED: '0'
  ddtracerun:
    parallelism: 3
    paths:
      - '@contrib'
      - '@bootstrap'
      - '@core'
      - tests/commands/*
      - tests/ddtrace_run.py
    services:
      - redis
    matrix:
      python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      command: pytest {cmdargs} --no-cov tests/commands/test_runner.py
      dependencies:
        - redis
        - gevent
        - pytest-randomly
  detect_global_locks:
    venvs_per_job: 1
    paths:
      - 'ddtrace/*'
      - 'setup.py'
      - 'setup.cfg'
      - 'pyproject.toml'
      - 'src/native/*'
      - 'scripts/global-lock-detection.py'
    matrix:
      python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      command: python -X importtime scripts/global-lock-detection.py
      env:
        DD_DYNAMIC_INSTRUMENTATION_ENABLED: '1'
        DD_CODE_ORIGIN_FOR_SPANS_ENABLED: '1'
        DD_EXCEPTION_REPLAY_ENABLED: '1'
        DD_APPSEC_ENABLED: '1'
        DD_APPSEC_SCA_ENABLED: '1'
        DD_IAST_ENABLED: '1'
        DD_RUNTIME_METRICS_ENABLED: '1'
        DD_PROFILING_ENABLED: '1'
        DD_PROFILING_LOCK_ENABLED: '0'
        DD_REMOTE_CONFIGURATION_ENABLED: '1'
  integration_agent:
    parallelism: 2
    paths:
      - '@tracing'
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@vendor'
      - tests/integration/*
      - tests/snapshots/tests.integration.*
    pattern: integration-latest*
    matrix:
      dependencies:
        - msgpack
        - pytest-randomly
      env:
        AGENT_VERSION: latest
      cases:
        - python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
          name: integration-latest
          axes:
            compatibility:
              integration-latest: {}
          command: pytest -vv --no-cov --ignore-glob='*civisibility*' {cmdargs} tests/integration/
        - python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
          name: integration-latest-civisibility
          axes:
            compatibility:
              integration-latest-civisibility: {}
          command: pytest --no-cov {cmdargs} tests/integration/test_integration_civisibility.py
  integration_testagent:
    venvs_per_job: 3
    paths:
      - '@tracing'
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@vendor'
      - tests/integration/*
      - tests/snapshots/tests.integration.*
    pattern: integration-snapshot*
    snapshot: true
    matrix:
      dependencies:
        - msgpack
        - pytest-randomly
      env:
        AGENT_VERSION: testagent
      cases:
        - python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
          name: integration-snapshot
          axes:
            compatibility:
              integration-snapshot: {}
          command: pytest -vv --no-cov --ignore-glob='*civisibility*' {cmdargs} tests/integration/
        - python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
          name: integration-snapshot-civisibility
          axes:
            compatibility:
              integration-snapshot-civisibility: {}
          command: pytest --no-cov {cmdargs} tests/integration/test_integration_civisibility.py
  integration_registry:
    parallelism: 1
    paths:
      - '@contrib'
      - scripts/integration_registry/*
    matrix:
      command: pytest {cmdargs} tests/contrib/integration_registry
      dependencies:
        - pip==26.2.1
        - ruamel.yaml==0.18.6
        - pytest-randomly
        - pytest-asyncio==0.23.7
        - PyYAML
        - jsonschema
      python: ['3.13']
  internal:
    retry: 2
    venvs_per_job: 2
    paths:
      - '@core'
      - '@remoteconfig'
      - '@symbol_db'
      - '@tracing'
      - '@vendor'
      - ddtrace/internal/*
      - scripts/gen_gitlab_config.py
      - tests/internal/*
      - tests/submod/*
      - tests/cache/*
      - tests/snapshots/tests.internal.*
    snapshot: true
    matrix:
      command: pytest -v -n auto --dist=worksteal {cmdargs} tests/internal/
      dependencies:
        - httpretty
        - gevent
        - pytest-randomly
        - pytest-xdist
        - python-json-logger==2.0.7
        - pyfakefs
        - pytest-benchmark
        - uwsgi
        - PyYAML
        - cloudpickle
      env:
        DD_INSTRUMENTATION_TELEMETRY_ENABLED: '0'
        DD_CIVISIBILITY_ITR_ENABLED: '0'
      axes:
        wrapt:
          wrapt-latest:
            dependencies: wrapt
          wrapt-1:
            dependencies: wrapt<2.0.0
      cases:
        - python: ['3.9', '3.10', '3.11']
          dependencies:
            - pytest-asyncio~=0.23.7
            - setuptools<82
        - python: ['3.12', '3.13', '3.14']
          dependencies:
            - pytest-asyncio~=0.23.7
            - setuptools<82
            - zope-event==5.0
            - zope-interface==7.2
          env:
            PYTHONWARNINGS: 'ignore:This process:DeprecationWarning::'
  wrapping:
    venvs_per_job: 6
    paths:
      - '@core'
      - '@tracing'
      - ddtrace/internal/wrapping/*
      - ddtrace/_trace/tracer.py
      - tests/wrapping/*
    matrix:
      python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      command: pytest -v -n auto --dist=worksteal {cmdargs} tests/wrapping/
      dependencies: pytest-xdist
      env:
        DD_TRACE_WRAP_SPAN_NAME_INCLUDE_CLASS: 'true'
      axes:
        wrapt:
          wrapt-latest:
            dependencies: wrapt
          wrapt-1:
            dependencies: wrapt<2.0.0
  lib_injection:
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@lib_injection'
    parallelism: 2
    pattern: ^lib_injection$
    matrix:
      python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      command: pytest {cmdargs} tests/lib_injection/
      dependencies:
        - PyYAML
        - "pip==26.0.1; python_version < '3.10'"
        - "pip==26.2.1; python_version >= '3.10'"
        - pytest-randomly
  runtime:
    paths:
      - '@bootstrap'
      - '@core'
      - '@runtime'
      - '@vendor'
      - tests/runtime/*
    skip: true
    matrix:
      python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      command: pytest {cmdargs} tests/runtime/
      dependencies:
        - msgpack
        - pytest-randomly
  openfeature:
    parallelism: 1
    paths:
      - '@openfeature'
      - '@remoteconfig'
      - '@core'
    pattern: ^openfeature$
    matrix:
      python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      command: pytest {cmdargs} tests/openfeature
      dependencies:
        - pytest-randomly
        - mock
      axes:
        openfeature:
          openfeature-0-8:
            dependencies: openfeature-sdk~=0.8.0
          openfeature-latest:
            dependencies: openfeature-sdk
  telemetry:
    parallelism: 1
    paths:
      - '@bootstrap'
      - '@contrib'
      - '@core'
      - '@telemetry'
      - '@tracing'
      - '@settings'
      - '@profiling'
      - '@vendor'
      # tests/telemetry runs real django and flask apps; '@contrib' is only shared infrastructure.
      - '@django'
      - '@flask'
      - tests/telemetry/*
      - tests/snapshots/tests.telemetry.*
    snapshot: true
    matrix:
      command: pytest {cmdargs} tests/telemetry/
      dependencies:
        - requests
        - gunicorn
        - httpretty<1.1
        - pytest-randomly
        - xmltodict
        - django
      cases:
        - python: ['3.14']
          dependencies: flask>=3.1.2
        - python: ['3.9', '3.10', '3.11', '3.12', '3.13']
          dependencies:
            - flask<=2.2.3
            - werkzeug<2.0
            - markupsafe<2.0
  tracer:
    env:
      DD_TRACE_AGENT_URL: http://localhost:8126
      KUBERNETES_MEMORY_REQUEST: "4Gi"
      KUBERNETES_MEMORY_LIMIT: "4Gi"
    paths:
      - '@tracing'
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@llmobs'
      - '@serverless'
      - '@remoteconfig'
      - '@futures'
      - '@ci_visibility'
      - '@vendor'
      - tests/tracer/*
      - tests/snapshots/test_*
    retry: 2
    venvs_per_job: 1
    matrix:
      python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      command: pytest -v {cmdargs} --ignore=tests/tracer/test_uwsgi_shutdown.py tests/tracer/
      dependencies:
        - msgpack
        - coverage
        - attrs
        - structlog
        - httpretty
        - wheel
        - fastapi
        - httpx<0.28.0
        - pytest-randomly
        - setuptools
        - boto3
        - freezegun
      env:
        DD_CIVISIBILITY_LOG_LEVEL: none
        DD_INSTRUMENTATION_TELEMETRY_ENABLED: '0'
        _DD_CIVISIBILITY_PARTIAL_FLUSH_MIN_SPANS: '50'
      axes:
        variant:
          default:
            group:
          traceid-64-bit:
            group:
            name: tracer-128-bit-traceid-disabled
            python: ['3.14']
            env:
              DD_TRACE_128_BIT_TRACEID_GENERATION_ENABLED: 'false'
          optimize:
            group:
            name: tracer-python-optimize
            env:
              PYTHONOPTIMIZE: '1'
          legacy-attrs:
            name: tracer-legacy-attrs
            python: ['3.9']
            dependencies:
              - cattrs<23.2.0
              - attrs==22.1.0
          uwsgi:
            name: tracer-uwsgi
            python: ['3.9', '3.10', '3.11', '3.12', '3.13']
            command: pytest -v {cmdargs} tests/tracer/test_uwsgi_shutdown.py
            dependencies: uwsgi
  wait:
    type: helper
    paths:
      - tests/wait-for-services.py
    matrix:
      # Python 3.10 is incompatible with the pinned kombu and vertica clients.
      python: ['3.9']
      command: python tests/wait-for-services.py {cmdargs}
      dependencies:
        - azure-data-tables
        - azure-storage-blob
        - azure-storage-queue
        - cassandra-driver
        - psycopg2-binary
        - mysql-connector-python!=8.0.18
        - vertica-python>=0.6.0,<0.7.0
        - kombu>=4.2.0,<4.3.0
        - pymssql
        - pytest-randomly
        - redis
        - requests
      env:
        AGENT_VERSION: testagent
        DD_TRACE_AGENT_URL: http://testagent:9126
  vendor:
    parallelism: 1
    paths:
      - '@vendor'
      - tests/vendor/*
    matrix:
      python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      command: pytest {cmdargs} tests/vendor/
      dependencies: pytest-randomly
      axes:
        msgpack:
          msgpack-1:
            dependencies: msgpack~=1.0.0
          msgpack-latest:
            dependencies: msgpack
