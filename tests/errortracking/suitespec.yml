---
components:
  errortracking:
    - ddtrace/errortracking/*
    - ddtrace/internal/settings/errortracking.py
suites:
  errortracker:
    parallelism: 1
    paths:
      - '@errortracking'
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - tests/errortracking/*
    matrix:
      python: ['3.10', '3.11', '3.12', '3.13', '3.14']
      command: pytest {cmdargs} tests/errortracking/
      dependencies:
        - flask
        - pip==26.2.1
