---
components:
  errortracking:
    - ddtrace/errortracking/*
    - ddtrace/internal/settings/errortracking.py
suites:
  errortracker:
    parallelism: 1
    paths:
      - '@errortracking'
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - tests/errortracking/*
    matrix:
      command: pytest {cmdargs} tests/errortracking/
      python: ['3.10', '3.11', '3.12', '3.13', '3.14']
      variants:
        - name: errortracker
          dependencies: [flask, 'pip==26.2.1']
          riot_lock_dependencies: [mock, pytest, pytest-mock, coverage, pytest-cov, opentracing, 'hypothesis<6.45.1', flask]
