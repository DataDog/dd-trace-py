---
components:
  profiling:
    - ddtrace/profiling/*
    - ddtrace/internal/datadog/profiling/*
    - ddtrace/_trace/processor/endpoint_call_counter.py
    - ddtrace/internal/settings/profiling.py
suites:
  profile:
    env:
      DD_TRACE_AGENT_URL: ''
    venvs_per_job: 1
    paths:
      - '@bootstrap'
      - '@core'
      - '@profiling'
      - '@vendor'
      - tests/profiling/suitespec.yml
      - tests/profiling/*
    pattern: profile$
    retry: 2
    matrix:
      command: >-
        python -m tests.profiling.run pytest -v --no-cov --capture=no --benchmark-disable
        --ignore='tests/profiling/collector/test_memalloc.py' --ignore='tests/profiling/test_memalloc_fork.py'
        {cmdargs} tests/profiling
      dependencies:
        - gunicorn
        - jsonschema
        - zstandard
        - pytest-cpp
        - pytest-benchmark
        - py-cpuinfo~=8.0.0
        - pytest-asyncio==0.21.1
        - pytest-randomly
        - numpy
        - uwsgi
      env:
        CPUCOUNT: '12'
        DD_PROFILING_ENABLE_ASSERTS: '1'
        DD_PROFILING_MEMALLOC_ASSERT_ON_REENTRY: '1'
        PYTHONWARNINGS: ignore::UserWarning:gevent.events
      variants:
        - name: protobuf-3-19-0-protobuf
          python: ['3.9', '3.10']
          dependencies: [protobuf==3.19.0]
        - name: protobuf-latest
          dependencies: [protobuf]
        - name: gunicorn-gevent-latest-gevent-latest-protobuf-latest
          dependencies: ['gunicorn[gevent]', gevent, protobuf]
          env:
            DD_PROFILE_TEST_GEVENT: '1'
        - name: uvloop-latest-protobuf-latest
          dependencies: [uvloop, protobuf]
          env:
            USE_UVLOOP: '1'
        - name: protobuf-4-22-0-protobuf-2
          python: ['3.11', '3.12', '3.13']
          dependencies: [protobuf==4.22.0]
  profile-uwsgi:
    env:
      DD_TRACE_AGENT_URL: ''
    venvs_per_job: 1
    paths:
      - '@bootstrap'
      - '@core'
      - '@profiling'
      - '@vendor'
      - tests/profiling/suitespec.yml
      - tests/profiling/*
    pattern: profile-uwsgi
    retry: 2
    matrix:
      command: >-
        python -m tests.profiling.run pytest -v --no-cov --capture=no --benchmark-disable
        {cmdargs} tests/profiling/test_uwsgi.py
      dependencies:
        - gunicorn
        - jsonschema
        - zstandard
        - pytest-cpp
        - pytest-benchmark
        - py-cpuinfo~=8.0.0
        - pytest-asyncio==0.21.1
        - pytest-randomly
        - numpy
        - uwsgi<2.0.30
        - protobuf
      env:
        CPUCOUNT: '12'
        DD_PROFILING_ENABLE_ASSERTS: '1'
        DD_PROFILING_MEMALLOC_ASSERT_ON_REENTRY: '1'
        PYTHONWARNINGS: ignore::UserWarning:gevent.events
      python: ['3.9', '3.10', '3.11', '3.12', '3.13']
      variants: [{name: default}]
  profile-memalloc:
    env:
      DD_TRACE_AGENT_URL: ''
    venvs_per_job: 1
    paths:
      - '@bootstrap'
      - '@core'
      - '@profiling'
      - '@vendor'
      - tests/profiling/suitespec.yml
      - tests/profiling/*
    pattern: profile-memalloc
    retry: 2
    matrix:
      command: >-
        python -m tests.profiling.run pytest -v --no-cov --capture=no --benchmark-disable
        {cmdargs} tests/profiling/collector/test_memalloc.py tests/profiling/test_memalloc_fork.py
      dependencies:
        - gunicorn
        - jsonschema
        - zstandard
        - pytest-cpp
        - pytest-benchmark
        - py-cpuinfo~=8.0.0
        - pytest-asyncio==0.21.1
        - pytest-randomly
        - numpy
        - protobuf
      env:
        CPUCOUNT: '12'
        DD_PROFILING_ENABLE_ASSERTS: '1'
        DD_PROFILING_MEMALLOC_ASSERT_ON_REENTRY: '1'
        PYTHONWARNINGS: ignore::UserWarning:gevent.events
      runs:
        - env:
            PYTHONMALLOC: malloc
        - env:
            PYTHONMALLOC: pymalloc
        - env:
            PYTHONMALLOC: malloc_debug
        - env:
            PYTHONMALLOC: pymalloc_debug
      variants: [{name: default}]
