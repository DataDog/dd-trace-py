    - ddtrace/contrib/internal/celery/*
    - tests/snapshots/tests.contrib.celery.*
  cherrypy:
    - ddtrace/contrib/cherrypy.py
    - ddtrace/contrib/internal/cherrypy/*
  consul:
    - ddtrace/contrib/internal/consul/*
    - ddtrace/ext/consul.py
  contrib:
    # Shared package infrastructure (not covered by any specific component)
    - ddtrace/contrib/__init__.py
    - ddtrace/contrib/trace_utils.py
    - ddtrace/contrib/_events/*
    - ddtrace/contrib/internal/__init__.py
    - ddtrace/contrib/internal/trace_utils.py
    - ddtrace/contrib/internal/trace_utils_async.py
    - ddtrace/contrib/internal/trace_utils_base.py
    # Shared ext files used broadly across many integrations
    - ddtrace/ext/__init__.py
    - ddtrace/ext/http.py
    - ddtrace/ext/net.py
    - ddtrace/ext/user.py
    - ddtrace/ext/websocket.py
    # Propagation and settings shared across all integrations
    - ddtrace/propagation/*
    - ddtrace/internal/settings/_database_monitoring.py
    # Shared test utilities
    - tests/contrib/patch.py
    - tests/contrib/config.py
    - tests/contrib/__init__.py
    - tests/contrib/suitespec.yml
  coverage:
    - ddtrace/contrib/internal/coverage/*
  dbapi:
    - ddtrace/contrib/dbapi.py
    - ddtrace/contrib/dbapi_async.py
    - ddtrace/ext/db.py
    - ddtrace/ext/sql.py
  ddtrace_api:
    - ddtrace/contrib/internal/ddtrace_api/*
    - tests/snapshots/tests.contrib.ddtrace_api.*
  django:
    - ddtrace/contrib/internal/django/*
  dogpile_cache:
    - ddtrace/contrib/internal/dogpile_cache/*
  dramatiq:
    - ddtrace/contrib/internal/dramatiq/*
  elasticsearch:
    - ddtrace/contrib/internal/elasticsearch/*
    - ddtrace/ext/elasticsearch.py
  falcon:
    - ddtrace/contrib/falcon.py
    - ddtrace/contrib/internal/falcon/*
  fastapi:
    - ddtrace/contrib/internal/fastapi/*
  flask:
    - ddtrace/contrib/internal/flask/*
    - ddtrace/contrib/flask_cache.py
    - ddtrace/contrib/internal/flask_cache/*
  futures:
    - ddtrace/contrib/internal/futures/*
  gevent:
    - ddtrace/contrib/internal/gevent/*
  google_cloud_pubsub:
    - ddtrace/contrib/internal/google_cloud_pubsub/*
    - ddtrace/internal/datastreams/google_cloud_pubsub.py
  graphql:
    - ddtrace/contrib/internal/graphql/*
  grpc:
    - ddtrace/contrib/internal/grpc/*
  gunicorn:
    - ddtrace/contrib/internal/gunicorn/*
  httplib:
    - ddtrace/contrib/internal/httplib/*
  httpx:
    - ddtrace/contrib/internal/httpx/*
  integration_registry:
    - scripts/integration_registry/*
  jinja2:
    - ddtrace/contrib/internal/jinja2/*
  kafka:
    - ddtrace/contrib/internal/kafka/*
    - ddtrace/ext/kafka.py
  kombu:
    - ddtrace/contrib/internal/kombu/*
    - ddtrace/ext/kombu.py
    - tests/snapshots/tests.contrib.kombu.*
  logbook:
    - ddtrace/contrib/internal/logbook/*
  logging:
    - ddtrace/contrib/internal/logging/*
  loguru:
    - ddtrace/contrib/internal/loguru/*
  mako:
    - ddtrace/contrib/internal/mako/*
  mlflow:
    - ddtrace/contrib/internal/mlflow/*
  mariadb:
    - ddtrace/contrib/internal/mariadb/*
  molten:
    - ddtrace/contrib/internal/molten/*
  mongo:
    - ddtrace/contrib/internal/pymongo/*
    - ddtrace/ext/mongo.py
  mysql:
    - ddtrace/contrib/internal/mysql/*
    - ddtrace/contrib/internal/mysqldb/*
    - ddtrace/contrib/internal/pymysql/*
    - ddtrace/contrib/internal/aiomysql/*
  pg:
    - ddtrace/contrib/internal/aiopg/*
    - ddtrace/contrib/internal/psycopg/*
    - ddtrace/contrib/internal/asyncpg/*
  protobuf:
    - ddtrace/contrib/internal/protobuf/*
  pylibmc:
    - ddtrace/contrib/pylibmc.py
    - ddtrace/contrib/internal/pylibmc/*
  pymemcache:
    - ddtrace/contrib/internal/pymemcache/*
    - ddtrace/ext/memcached.py
  pynamodb:
    - ddtrace/contrib/internal/pynamodb/*
  pytorch:
    - ddtrace/contrib/internal/pytorch/*
  pyodbc:
    - ddtrace/contrib/internal/pyodbc/*
  pyramid:
    - ddtrace/contrib/pyramid.py
    - ddtrace/contrib/internal/pyramid/*
  ray:
    - ddtrace/contrib/internal/ray/*
    - ddtrace/contrib/ray.py
  ray_serve:
    - ddtrace/contrib/internal/ray_serve/*
  redis:
    - ddtrace/contrib/internal/rediscluster/*
    - ddtrace/contrib/internal/redis/*
    - ddtrace/contrib/internal/aredis/*
    - ddtrace/contrib/internal/yaaredis/*
    - ddtrace/contrib/internal/redis_utils.py
    - ddtrace/ext/redis.py
  requests:
    - ddtrace/contrib/requests.py
    - ddtrace/contrib/internal/requests/*
  rq:
    - ddtrace/contrib/internal/rq/*
  sanic:
    - ddtrace/contrib/internal/sanic/*
  snowflake:
    - ddtrace/contrib/internal/snowflake/*
  sqlalchemy:
    - ddtrace/contrib/sqlalchemy.py
    - ddtrace/contrib/internal/sqlalchemy/*
  sqlite3:
    - ddtrace/contrib/internal/sqlite3/*
  starlette:
    - ddtrace/contrib/internal/starlette/*
  structlog:
    - ddtrace/contrib/internal/structlog/*
  subprocess:
    - ddtrace/contrib/internal/subprocess/*
  tornado:
    - ddtrace/contrib/internal/tornado/*
  urllib3:
    - ddtrace/contrib/internal/urllib3/*
  valkey:
    - ddtrace/contrib/internal/valkey/*
    - ddtrace/contrib/internal/valkey_utils.py
    - ddtrace/_trace/utils_valkey.py
    - ddtrace/ext/valkey.py
  vertica:
    - ddtrace/contrib/internal/vertica/*
  wsgi:
    - ddtrace/contrib/wsgi.py
    - ddtrace/contrib/internal/wsgi/*
suites:
  aiobotocore:
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@botocore'
      - tests/contrib/aiobotocore/*
    services:
      - moto
    env:
      TEST_MOTO_PORT: '3000'
    snapshot: true
    venvs_per_job: 2
    runner: uv
    matrix:
      command: pytest {cmdargs} --no-cov tests/contrib/aiobotocore
      dependencies:
        - pytest-asyncio==0.21.1
        - async_generator~=1.10
        - pytest-randomly
      cases:
        - python: ['3.9', '3.10', '3.11']
          axes:
            aiobotocore:
              aiobotocore-1-0-0: aiobotocore~=1.0.0
              aiobotocore-1-4-2: aiobotocore~=1.4.2
              aiobotocore-2-0-0: aiobotocore~=2.0.0
              aiobotocore-latest: aiobotocore
            compatibility:
              aiobotocore: {}
        - python: ['3.12', '3.13', '3.14']
          dependencies:
            - aiobotocore
          axes:
            compatibility:
              aiobotocore-latest: {}
  aiohttp:
    runner: uv
    pattern: ^aiohttp$
    venvs_per_job: 3
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@aiohttp'
      - tests/contrib/aiohttp/*
      - tests/snapshots/tests.{suite}.*
    services:
      - httpbin
    snapshot: true
    matrix:
      python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      command: pytest {cmdargs} tests/contrib/aiohttp
      dependencies:
        - pytest-randomly
        - yarl~=1.0
      axes:
        compatibility:
          aiohttp-legacy:
            python: ['3.9']
            dependencies:
              - pytest-aiohttp<=1.0.5
              - pytest-asyncio<=0.23.7
            command: >-
              pytest {cmdargs} tests/contrib/aiohttp/test_aiohttp_client.py
              tests/contrib/aiohttp/test_aiohttp_patch.py
          aiohttp-py39-py312:
            python: ['3.9', '3.10', '3.11', '3.12']
            dependencies:
              - pytest-asyncio==0.23.7
              - pytest-aiohttp==1.0.5
          aiohttp-py313-plus:
            python: ['3.13', '3.14']
            dependencies:
              - pytest-asyncio>=1.0.0
              - pytest-aiohttp
        aiohttp:
          aiohttp-3-7:
            dependencies: aiohttp~=3.7
          aiohttp-legacy-3-7:
            python: ['3.9']
            dependencies: aiohttp~=3.7.0
          aiohttp-latest:
            dependencies: aiohttp
      exclude:
        - compatibility: aiohttp-legacy
          aiohttp: [aiohttp-3-7, aiohttp-latest]
        - compatibility: [aiohttp-py39-py312, aiohttp-py313-plus]
          aiohttp: aiohttp-legacy-3-7
  aiohttp_jinja2:
    runner: uv
    venvs_per_job: 6
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@aiohttp'
      - '@aiohttp_jinja2'
      - tests/contrib/aiohttp/*
      - tests/contrib/aiohttp_jinja2/*
      - tests/snapshots/tests.{suite}.*
    services:
      - httpbin
    snapshot: true
    matrix:
      python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      command: pytest {cmdargs} tests/contrib/aiohttp_jinja2
      dependencies:
        - pytest-aiohttp
        - pytest-randomly
        - jinja2
      axes:
        aiohttp:
          aiohttp-3-7: aiohttp~=3.7
          aiohttp-latest: aiohttp
        aiohttp-jinja2:
          aiohttp-jinja2-1-5: aiohttp_jinja2~=1.5.0
          aiohttp-jinja2-latest: aiohttp_jinja2
        pytest-asyncio:
          pytest-asyncio-0-23:
            python: ['3.9', '3.10', '3.11', '3.12']
            dependencies: pytest-asyncio==0.23.7
          pytest-asyncio-latest:
            python: ['3.13', '3.14']
            dependencies: pytest-asyncio>=1.0.0
  aiomysql:
    parallelism: 2
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@dbapi'
      - '@mysql'
      - tests/contrib/aiomysql/*
      - tests/snapshots/tests.{suite}.*
      - tests/contrib/shared_tests_async.py
    services:
      - mysql
    snapshot: true
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/aiomysql
      dependencies:
        - pytest-randomly
      cases:
        - python: ['3.9', '3.10', '3.11', '3.12']
          dependencies:
            - pytest-asyncio==0.23.7
          axes:
            aiomysql: &id001
              aiomysql-0-1-0: aiomysql~=0.1.0
              aiomysql-latest: aiomysql
            compatibility:
              pytest-asyncio-0-23-7: {}
        - python: ['3.13', '3.14']
          dependencies:
            - pytest-asyncio
          axes:
            aiomysql: *id001
            compatibility:
              pytest-asyncio-latest: {}
  aiokafka:
    env:
      TEST_KAFKA_HOST: kafka
      TEST_KAFKA_PORT: '29092'
    venvs_per_job: 2
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@contrib'
      - '@aiokafka'
      - '@datastreams'
      - tests/contrib/aiokafka/*
      - tests/snapshots/tests.contrib.aiokafka.*
    services:
      - kafka
    snapshot: true
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/aiokafka/
      dependencies:
        - pytest-asyncio
        - pytest-randomly
      env:
        DD_DATA_STREAMS_ENABLED: 'true'
        _DD_TRACE_STATS_WRITER_INTERVAL: '1000000000'
      python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      axes:
        aiokafka:
          aiokafka-0-9-0: aiokafka~=0.9.0
          aiokafka-latest: aiokafka
  aiopg:
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@dbapi'
      - '@pg'
      - '@aiopg'
      - tests/contrib/aiopg/*
      - tests/contrib/shared_tests_async.py
    snapshot: true
    services:
      - postgres
    venvs_per_job: 2
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/aiopg
      dependencies:
        - sqlalchemy
        - pytest-randomly
      cases:
        - python: ['3.9']
          dependencies:
            - aiopg~=0.16.0
          axes:
            compatibility:
              aiopg-0-16-0: {}
        - python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
          axes:
            aiopg:
              aiopg-1-0: aiopg~=1.0
              aiopg-1-4-0: aiopg~=1.4.0
            compatibility:
              aiopg: {}
  algoliasearch:
    runner: uv
    parallelism: 2
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@algoliasearch'
      - tests/contrib/algoliasearch/*
    snapshot: true
    matrix:
      python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      command: pytest {cmdargs} tests/contrib/algoliasearch
      dependencies:
        - urllib3~=1.26.15
        - pytest-randomly
        - algoliasearch~=2.6
  aredis:
    parallelism: 1
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@redis'
      - tests/contrib/aredis/*
      - tests/snapshots/tests.{suite}.*
    pattern: aredis$
    services:
      - redis
    snapshot: true
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/aredis
      dependencies:
        - pytest-asyncio==0.21.1
        - aredis
        - pytest-randomly
      python: ['3.9']
  asgi:
    venvs_per_job: 1
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@asyncio'
      - '@appsec'
      - '@asgi'
      - tests/contrib/asgi/*
      - tests/snapshots/tests.{suite}.*
    pattern: asgi$
    snapshot: true
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/asgi
      dependencies:
        - pytest-asyncio==0.21.1
        - httpx<0.28.0
        - pytest-randomly
      python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      axes:
        asgiref:
          asgiref-3-0-0: asgiref~=3.0.0
          asgiref-3-0: asgiref~=3.0
          asgiref-latest: asgiref
  asyncpg:
    retry: 2
    parallelism: 2
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@pg'
      - tests/contrib/asyncpg/*
      - tests/snapshots/tests.{suite}.*
      - tests/contrib/shared_tests_async.py
    snapshot: true
    services:
      - postgres
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/asyncpg
      dependencies:
        - pytest-asyncio~=0.21.1
        - pytest-randomly
      cases:
        - python: ['3.9']
          axes:
            asyncpg:
              asyncpg-0-23-0: asyncpg~=0.23.0
              asyncpg-latest: asyncpg
            compatibility:
              asyncpg: {}
        - python: ['3.10']
          axes:
            asyncpg:
              asyncpg-0-24-0: asyncpg~=0.24.0
              asyncpg-latest: asyncpg
            compatibility:
              asyncpg-2: {}
        - python: ['3.11']
          axes:
            asyncpg:
              asyncpg-0-27: asyncpg~=0.27
              asyncpg-latest: asyncpg
            compatibility:
              asyncpg-3: {}
        - python: ['3.12', '3.13', '3.14']
          dependencies:
            - asyncpg
          axes:
            compatibility:
              asyncpg-latest: {}
  asynctest:
    parallelism: 1
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - tests/contrib/asynctest/*
    pattern: asynctest$
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/asynctest/
      dependencies:
        - pytest>=6.0,<7.0
        - pytest-randomly
        - asynctest==0.13.0
      python: ['3.9']
  avro:
    runner: uv
    parallelism: 1
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@avro'
      - tests/contrib/avro/*
    snapshot: true
    matrix:
      python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      command: pytest {cmdargs} tests/contrib/avro
      dependencies:
        - avro
        - pytest-randomly
  aws_lambda:
    parallelism: 2
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@aws_lambda'
      - tests/contrib/aws_lambda/*
      - tests/snapshots/tests.{suite}.*
    snapshot: true
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/aws_lambda
      dependencies:
        - boto3
        - pytest-asyncio==0.21.1
        - pytest-randomly
      python: ['3.9', '3.10', '3.11', '3.12', '3.13']
      axes:
        datadog-lambda:
          datadog-lambda-gte-6-105-0: datadog-lambda>=6.105.0
          datadog-lambda-latest: datadog-lambda
  aws_durable_execution_sdk_python:
    venvs_per_job: 2
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@aws_durable_execution_sdk_python'
      - tests/contrib/aws_durable_execution_sdk_python/*
      - tests/snapshots/tests.{suite}.*
    snapshot: true
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/aws_durable_execution_sdk_python
      dependencies:
        - aws-durable-execution-sdk-python-testing
      python: ['3.11', '3.12', '3.13', '3.14']
      axes:
        aws-durable-execution-sdk-python:
          aws-durable-execution-sdk-python-1-4-0: aws-durable-execution-sdk-python~=1.4.0
          aws-durable-execution-sdk-python-latest: aws-durable-execution-sdk-python
  azure_cosmos:
    venvs_per_job: 4
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@azure_cosmos'
      - tests/contrib/azure_cosmos/*
      - tests/snapshots/tests.contrib.azure_cosmos.*
    snapshot: true
    services:
      - azurite
      - azurecosmosemulator
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/azure_cosmos
      dependencies:
        - pytest-asyncio==0.23.7
        - aiohttp
        - six
      python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      axes:
        azure-cosmos:
          azure-cosmos-4-9-0: azure.cosmos~=4.9.0
          azure-cosmos-latest: azure.cosmos
  azure_eventhubs:
    parallelism: 4
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@azure_eventhubs'
      - tests/contrib/azure_eventhubs/*
      - tests/snapshots/tests.contrib.azure_eventhubs.*
    snapshot: true
    services:
      - azurite
      - azureeventhubsemulator
    env:
      # This job's services are heavier than average; pin resources and disable
      # the VPA to make sure it consistently gets enough CPU/memory to start.
      DD_DISABLE_VPA: 'true'
      KUBERNETES_CPU_REQUEST: '2'
      KUBERNETES_CPU_LIMIT: '2'
      KUBERNETES_MEMORY_REQUEST: '8Gi'
      KUBERNETES_MEMORY_LIMIT: '8Gi'
      KUBERNETES_SERVICE_CPU_REQUEST: '2'
      KUBERNETES_SERVICE_CPU_LIMIT: '2'
      KUBERNETES_SERVICE_MEMORY_REQUEST: '8Gi'
      KUBERNETES_SERVICE_MEMORY_LIMIT: '8Gi'      
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/azure_eventhubs
      dependencies:
        - pytest-asyncio==0.23.7
      python: ['3.9', '3.10', '3.11', '3.12', '3.13']
      axes:
        azure-eventhub:
          azure-eventhub-5-12-0: azure.eventhub~=5.12.0
          azure-eventhub-latest: azure.eventhub
  azure_durable_functions:
    venvs_per_job: 3
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@azure_durable_functions'
      - tests/contrib/azure_durable_functions/*
      - tests/snapshots/tests.contrib.azure_durable_functions.*
    snapshot: true
    services:
      - azurite
  # the azure_functions suites don't work in the arm64 testrunner container
  # (the one that runs from scripts/ddtest on Mac OS)
  # they can be run on OSX bare metal after `brew tap azure/functions && brew install azure-functions-core-tools@4`
    runner: uv
    matrix:
      command: pytest {cmdargs} tests/contrib/azure_durable_functions
      python: ['3.9', '3.10', '3.11', '3.12', '3.13']
      axes:
        azure-functions-durable:
          azure-functions-durable-1-2-1: azure-functions-durable==1.2.1
          azure-functions-durable-latest: azure-functions-durable
  azure_functions:
    parallelism: 4
    paths:
      - '@bootstrap'
      - '@core'
      - '@contrib'
      - '@tracing'
      - '@azure_functions'
