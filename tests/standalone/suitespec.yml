---
suites:
  standalone:
    venvs_per_job: 6
    paths:
      - '@bootstrap'
      - '@core'
      - '@tracing'
      - '@settings'
      - '@ai_guard'
      - '@appsec'
      - '@llmobs'
      - tests/standalone/*
      - tests/aiguard/utils.py
    matrix:
      command: pytest {cmdargs} tests/standalone/
      env:
        DD_TRACE_PY_ENABLE_ITR_TEST_SKIPPING_FOR_JOB: 'true'
      variants:
        - name: standalone
