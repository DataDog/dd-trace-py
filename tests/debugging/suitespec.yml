---
components:
  debugging:
    - ddtrace/debugging/*
    - ddtrace/internal/settings/dynamic_instrumentation.py
    - ddtrace/internal/settings/exception_replay.py
suites:
  debugger:
    parallelism: 1
    paths:
      - '@debugging'
      - '@bootstrap'
      - '@core'
      - '@remoteconfig'
      - '@tracing'
      - tests/debugging/*
    matrix:
      command: pytest {cmdargs} tests/debugging/
      dependencies: [msgpack, httpretty, typing-extensions, pytest-asyncio, pytest-benchmark,
        pytest-memray, numpy]
      variants: [{name: default}]
