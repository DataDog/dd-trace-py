# Shared service definitions for Docker and Podman test environments.
# Runtime-specific networking belongs in docker-compose.yml and
# docker-compose.podman.yml.
services:
    elasticsearch:
        image: elasticsearch:9.5.1
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=false
    opensearch:
        image: opensearchproject/opensearch:3.8.0
        environment:
            - "DISABLE_SECURITY_PLUGIN=true"
            - "discovery.type=single-node"
    cassandra:
        image: cassandra:5.0.9
        environment:
            - MAX_HEAP_SIZE=512M
            - HEAP_NEWSIZE=256M
    consul:
        image: consul:1.15.4
    postgres:
        image: postgres:18-alpine
        environment:
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_USER=postgres
            - POSTGRES_DB=postgres
    mariadb:
        image: mariadb:lts
        environment:
            - MYSQL_ROOT_PASSWORD=example
            - MYSQL_DATABASE=test
            - MYSQL_USER=test
            - MYSQL_PASSWORD=test
    mysql:
        image: mysql:26.7.0
        platform: linux/amd64
        environment:
            - MYSQL_ROOT_PASSWORD=admin
            - MYSQL_PASSWORD=test
            - MYSQL_USER=test
            - MYSQL_DATABASE=test
    redis:
        image: redis:8.10-alpine
    kafka:
        image: apache/kafka:4.3.1
        environment:
            - ALLOW_PLAINTEXT_LISTENER=yes
            - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
            - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
            - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - KAFKA_NODE_ID=1
            - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
            - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
            - CLUSTER_ID=5L6g3nShT-eMCtK--X86sw
            - KAFKA_PROCESS_ROLES=broker,controller
            - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
            - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
    rediscluster:
        platform: linux/amd64
        image: grokzen/redis-cluster:7.2.5
        environment:
            - IP=0.0.0.0
    mongo:
        image: mongo:8.2.12
    memcached:
        image: memcached:1.6.45-alpine
    moto:
        image: motoserver/moto:5.2.2
        environment:
            - MOTO_PORT=3000
    rabbitmq:
        image: rabbitmq:4.3.4-alpine
    ddagent:
        image: datadog/agent:latest
        environment:
            - DD_HOSTNAME=github-actions-worker
            - DD_BIND_HOST=0.0.0.0
            - DD_REMOTE_CONFIGURATION_ENABLED=true
            - DD_SITE=${DD_SITE-datadoghq.com}
            - DD_API_KEY=${DD_API_KEY-invalid_but_this_is_fine}
            - DD_REMOTE_CONFIGURATION_KEY=${DD_REMOTE_CONFIGURATION_KEY-invalid_but_this_is_fine}
            - DD_REMOTE_CONFIGURATION_REFRESH_INTERVAL=5s
            - DD_APM_RECEIVER_SOCKET=/tmp/ddagent/trace.sock
            - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
        volumes:
          - ddagent:/tmp/ddagent:rw
    testagent:
        image: ghcr.io/datadog/dd-apm-test-agent/ddapm-test-agent:v1.65.0
        volumes:
            - ./tests/snapshots:/snapshots
            - ./tests/cassettes:/cassettes
        environment:
            - LOG_LEVEL=WARNING
            - SNAPSHOT_DIR=/snapshots
            - VCR_CASSETTES_DIRECTORY=/cassettes
            - VCR_PROVIDER_MAP=azure_openai=https://llmobs-test-resource.openai.azure.com/,mistral=https://api.mistral.ai/
            - SNAPSHOT_CI=0
            - DD_POOL_TRACE_CHECK_FAILURES=true
            - DD_DISABLE_ERROR_RESPONSES=true
            - ENABLED_CHECKS=trace_content_length,trace_stall,meta_tracer_version_header,trace_count_header,trace_peer_service,trace_dd_service
            - SNAPSHOT_IGNORED_ATTRS=span_id,trace_id,parent_id,duration,start,metrics.system.pid,metrics.system.process_id,metrics.process_id,meta.runtime-id,meta._dd.p.tid,meta.pathway.hash,metrics._dd.tracer_kr,meta._dd.parent_id,meta.kafka.cluster_id,meta._dd.git.repository_url
    vertica:
        image: vertica/vertica-ce
        environment:
          - VP_TEST_USER=dbadmin
          - VP_TEST_PASSWORD=abc123
          - VP_TEST_DATABASE=docker
    azurecosmosemulator:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
        environment:
            ACCEPT_EULA: "Y"
            BLOB_SERVER: azurite
            METADATA_SERVER: azurite
    azureeventhubsemulator:
        image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:2.2.1
        environment:
            ACCEPT_EULA: "Y"
            BLOB_SERVER: azurite
            METADATA_SERVER: azurite
    azureservicebusemulator:
        image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1
        environment:
            ACCEPT_EULA: "Y"
            MSSQL_SA_PASSWORD: "Localtestpass1!"
            SQL_SERVER: dd-trace-py-azuresqledge-1
    azuresqledge:
        image: mcr.microsoft.com/azure-sql-edge:2.0.0
        environment:
            ACCEPT_EULA: "Y"
            MSSQL_SA_PASSWORD: "Localtestpass1!"
    azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    selenium-chrome:
        image: selenium/standalone-chrome:151.0.7922.108
        platform: linux/amd64
        environment:
            - SE_NODE_MAX_SESSIONS=2
            - SE_VNC_NO_PASSWORD=1
        shm_size: 2g
    testrunner:
        # DEV uncomment to test local changes to the Dockerfile
        # build:
        #  context: ./docker
        #  dockerfile: Dockerfile
        image: ghcr.io/datadog/dd-trace-py/testrunner:4d842eb2d0671790e4dc3e30309a8e3ffe91ac8b
        command: bash
        # Resource limits: defaults to 0 (unlimited, uses all available system resources)
        # Set DD_TEST_CPUS (e.g., "4") and DD_TEST_MEMORY (e.g., "8g") to apply limits
        cpus: "${DD_TEST_CPUS:-0}"
        mem_limit: "${DD_TEST_MEMORY:-0}"
        cap_add:
          - SYS_PTRACE
          - SYS_ADMIN
        environment:
          DD_FAST_BUILD: "1"
          CMAKE_BUILD_PARALLEL_LEVEL: "12"
          CARGO_BUILD_JOBS: "12"
          CYTHON_CACHE_DIR: "/home/bits/.cache/cython"
          DD_USE_SCCACHE: "1"
          SCCACHE_DIR: "/home/bits/.cache/sccache"
          DD_PROFILING_MEMALLOC_ASSERT_ON_REENTRY: "1"
          # Store riot venvs in a subdir separate from the host's .riot/venv* dirs
          # (shared via the project bind mount below). Without this, venvs built
          # inside the Linux container and venvs built natively on the host (e.g.
          # macOS) collide in the same path, and riot picks up incompatible
          # prebuilt binaries.
          RIOT_ENV_BASE_PATH: ".riot/docker"
        userns_mode: host
        working_dir: /home/bits/project/
        volumes:
          - ddagent:/tmp/ddagent
          - ${DD_TEST_CACHE_DIR:-./.cache}:/home/bits/.cache
          - ./:/home/bits/project
    localstack:
        image: localstack/localstack:4.14.0
        environment:
          - SERVICES=${SERVICES- }
          - DEBUG=${DEBUG- }
          - LAMBDA_EXECUTOR=local
          - KINESIS_ERROR_PROBABILITY=${KINESIS_ERROR_PROBABILITY- }
          - DOCKER_HOST=unix:///var/run/docker.sock
        volumes:
          - "${TMPDIR:-/var/lib/localstack}:/var/lib/localstack"
          - "/var/run/docker.sock:/var/run/docker.sock"
    httpbin:
      image: kennethreitz/httpbin@sha256:599fe5e5073102dbb0ee3dbb65f049dab44fa9fc251f6835c9990f8fb196a72b
      platform: linux/amd64
    valkey:
        image: valkey/valkey:9.1-alpine
    pubsub:
        image: google/cloud-sdk:580.0.0-emulators
        command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    valkeycluster:
        platform: linux/amd64
        image: grokzen/redis-cluster:7.2.5
        environment:
            - IP=0.0.0.0

volumes:
    ddagent:
