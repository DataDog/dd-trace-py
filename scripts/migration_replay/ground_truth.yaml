# Rubric-only (open / no merged PR yet)
rubric_only:
  - id: supported_versions_job
    issue: 19995
    category: ci
    keywords:
      - "supported-versions"
      - "3.15"
  - id: pyproject_classifier
    issue: 17815
    category: packaging
    keywords:
      - "Programming Language :: Python :: 3.15"
      - "classifier"

# Hard gates (pass/fail). Commands run in the sandbox after the agent finishes.
gates:
  - id: natives_build_315
    category: profiling
    description: "natives build on 3.15rc2"
    command: "python setup.py build_ext --inplace"
    python: "3.15"
    interpreter_env: "PY315RC2"
  - id: verify_compat_315
    category: profiling
    description: "verify_profiler_compatibility.py --python 3.15"
    command: "python scripts/verify_profiler_compatibility.py --python 3.15"
  - id: verify_compare
    category: profiling
    description: "verify_profiler_compatibility.py --compare"
    command: "python scripts/verify_profiler_compatibility.py --python 3.15 --compare"
  - id: profiling_tests_profile
    category: profiling
    description: "run-profiling-tests profile subset on 3.15"
    command: "scripts/run-profiling-tests --python 3.15"
  - id: layout_gtests
    category: profiling
    description: "Echion layout gtests (test_frame_state_315)"
    file_glob: "**/test_frame_state_315.cpp"
    expect_file: true
  - id: no_314_regression
    category: profiling
    description: "3.14 has no regressions (compat quick)"
    command: "python scripts/verify_profiler_compatibility.py --python 3.14 --quick"
  - id: prof_correctness_315
    category: ci
    description: "prof-correctness python_*_3.15 scenarios (external; may be skipped)"
    optional: true
    command: "echo 'prof-correctness exercised outside sandbox; see README'"

# Coverage facts — fraction of hits. file+regex OR keyword in REPLAY_ACTIONS.md.
coverage:
  - id: pyo3_028
    category: shared
    pr: 18429
    checks:
      - file: "src/native/Cargo.toml"
        regex: 'pyo3\s*=\s*\{\s*version\s*=\s*"0\.28"'
  - id: sys_monitoring_multiplexer
    category: shared
    pr: 19247
    checks:
      - file: "ddtrace/internal/monitoring.py"
        regex: "Multiplexed sys\\.monitoring|multiplexer"
  - id: import_degrade
    category: profiling
    pr: 19724
    checks:
      - file: "tests/internal/test_py315_import_degrade.py"
        regex: "."
      - file: "ddtrace/profiling/__init__.py"
        regex: "ImportError|except Exception|degrad"
  - id: wrapping_context_315
    category: shared
    pr: 17849
    checks:
      - file: "ddtrace/internal/wrapping/context.py"
        regex: "3,?\\s*15|sys\\.monitoring|PY_VERSION"
  - id: wrap_trampoline_315
    category: shared
    pr: 19910
    checks:
      - file: "ddtrace/internal/compat.py"
        regex: "3,?\\s*15"
  - id: setup_py_315_gates
    category: profiling
    pr: 19269
    checks:
      - file: "setup.py"
        regex: "3,?\\s*15|0x030f|sys\\.version_info\\s*<\\s*\\(3,\\s*16\\)"
  - id: echion_frame_state
    category: profiling
    pr: 19269
    checks:
      - file: "ddtrace/internal/datadog/profiling/stack/test/test_frame_state_315.cpp"
        regex: "FRAME_|PyFrameState|3\\.15"
      - file: "ddtrace/internal/datadog/profiling/stack/echion/echion/cpython/tasks.h"
        regex: "FRAME_SUSPENDED_YIELD_FROM_LOCKED|FRAME_OWNED|gi_frame_state"
  - id: asyncio_sys_monitoring_ge_315
    category: profiling
    pr: 19272
    checks:
      - file: "ddtrace/profiling/_asyncio.py"
        regex: "sys\\.version_info\\s*>=\\s*\\(3,\\s*15\\)|_ASYNCIO_MONITORING_MIN"
  - id: exception_pyx_315
    category: profiling
    pr: 19272
    checks:
      - file: "ddtrace/profiling/collector/_exception.pyx"
        regex: "3,?\\s*15|sys\\.monitoring|PY_VERSION"
  - id: registry_entry_315
    category: profiling
    checks:
      - file: "scripts/profiles/profiling_versions.json"
        regex: "\"3\\.15\""
  - id: cython_pin
    category: packaging
    pr: 19861
    checks:
      - file: "pyproject.toml"
        regex: "[Cc]ython\\s*<\\s*3\\.3"
  - id: wheels_withheld
    category: packaging
    pr: 19880
    checks:
      - file: ".gitlab/package.yml"
        regex: "cp315|prerelease|withhold|prune"
      - file: ".gitlab/scripts/prune-unsupported-wheels.sh"
        regex: "."
  - id: wheels_optional_then_required
    category: packaging
    pr: 20450
    checks:
      - file: ".gitlab/package.yml"
        regex: "cp315"
  - id: ssi_exclusive_max_316
    category: packaging
    pr: 19843
    checks:
      - file: "lib-injection/sources/sitecustomize.py"
        regex: "3\\.16|3\\.15"
  - id: logging_version_warning
    category: profiling
    pr: 19267
    checks:
      - file: "ddtrace/contrib/internal/logging/patch.py"
        regex: "3,?\\s*15|version"
  - id: pycontextvar_limited_api
    category: shared
    pr: 19903
    checks:
      - file: "src/native/contextvar.rs"
        regex: "PyContextVar"
  - id: base_images_cp315_unblock
    category: packaging
    pr: 17959
    checks:
      - file: ".gitlab/package.yml"
        regex: "cp315"
  - id: prof_correctness_workflow
    category: ci
    pr: 19207
    checks:
      - file: ".github/workflows/prof-correctness.yml"
        regex: "3\\.15|prof-correctness|python_"

