# Microbenchmark: multiplexer vs. direct sys.monitoring for EXCEPTION_HANDLED and RAISE.
# The direct_* configs reproduce the pre-multiplexer code path (dedicated tool
# slot, raw register_callback).  The multiplexer_* configs use the shared
# multiplexer's register_global / unregister_global API.

# === EXCEPTION_HANDLED (error-tracking path) ===

# Direct sys.monitoring: callback does no work (pure callback overhead).
direct_passive:
  handler: "direct_passive"

# Direct sys.monitoring: callback records each exception (realistic path).
direct_active:
  handler: "direct_active"

# Multiplexer: global EXCEPTION_HANDLED handler does no work (dispatch overhead).
multiplexer_passive:
  handler: "multiplexer_passive"

# Multiplexer: global EXCEPTION_HANDLED handler records each exception (realistic path).
multiplexer_active:
  handler: "multiplexer_active"

# === RAISE (exception profiler path) ===

# Direct sys.monitoring: RAISE callback does no work (old profiler, pure callback overhead).
direct_raise_passive:
  handler: "direct_raise_passive"

# Direct sys.monitoring: RAISE callback records each exception (old profiler, realistic path).
direct_raise_active:
  handler: "direct_raise_active"

# Multiplexer: global RAISE handler does no work (new profiler, dispatch overhead).
multiplexer_raise_passive:
  handler: "multiplexer_raise_passive"

# Multiplexer: global RAISE handler records each exception (new profiler, realistic path).
multiplexer_raise_active:
  handler: "multiplexer_raise_active"
