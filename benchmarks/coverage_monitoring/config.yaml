# Control for subprocess and generated-corpus noise.
baseline: &base
  ncontexts: 1000
  nmodules: 25
  functions_per_module: 4
  modules_per_context: 3
  collect_coverage: false
  file_level_coverage: false
  exception_consumers: false
  startup_order: "coverage_first"

# Line-level coverage records each executable line through LINE events.
line_level:
  <<: *base
  collect_coverage: true

# File-level coverage records each executed file through PY_START events.
file_level:
  <<: *base
  collect_coverage: true
  file_level_coverage: true

line_level_exceptions_first:
  <<: *base
  collect_coverage: true
  exception_consumers: true
  startup_order: "exceptions_first"

line_level_coverage_first:
  <<: *base
  collect_coverage: true
  exception_consumers: true

file_level_exceptions_first:
  <<: *base
  collect_coverage: true
  file_level_coverage: true
  exception_consumers: true
  startup_order: "exceptions_first"

file_level_coverage_first:
  <<: *base
  collect_coverage: true
  file_level_coverage: true
  exception_consumers: true
