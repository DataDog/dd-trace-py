# Control: plugin loaded but never activated (--ddtrace not passed). Both baseline and
# candidate ddtrace builds should match here; used to confirm pytest itself is stable.
baseline: &base
  ntests: 1000
  nmodules: 5
  ddtrace: false
  coverage: false

# Plugin active, hermetic offline mode, with backend features disabled.
ddtrace:
  <<: *base
  ddtrace: true

# Product path exercised by Test Impact Analysis on Python 3.12+: the pytest
# plugin collects file-level coverage for every test through sys.monitoring.
ddtrace_coverage:
  <<: *base
  ddtrace: true
  coverage: true
