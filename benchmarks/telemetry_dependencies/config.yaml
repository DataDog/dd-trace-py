# First heartbeat — all deps are new (SCA on vs off comparison)
# Only first-heartbeat configs are enabled; the idle, cve_registration and
# sca_hits phases in scenario.py have no configs or SLOs yet.
first-50-deps-sca-off: &first
  num_deps: 50
  phase: first
  sca_enabled: false
  pct_cve: 5
  cves_per_dep: 2
first-50-deps-sca-on:
  <<: *first
  sca_enabled: true
