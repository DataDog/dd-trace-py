baseline: &defaults
  env: {}
  sdk_action: ""
  ddtrace_run: false
  send_span: false
  import_ddtrace: false
  import_ddtrace_auto: false
  import_flask: false
  import_django: false
baseline_flask:
  <<: *defaults
  import_flask: true
baseline_django:
  <<: *defaults
  import_django: true
import_ddtrace:
  <<: *defaults
  import_ddtrace: true
import_ddtrace_flask:
  <<: *defaults
  import_ddtrace: true
  import_flask: true
import_ddtrace_django:
  <<: *defaults
  import_ddtrace: true
  import_django: true
import_ddtrace_auto:
  <<: *defaults
  import_ddtrace_auto: true
import_ddtrace_auto_flask:
  <<: *defaults
  import_ddtrace_auto: true
  import_flask: true
import_ddtrace_auto_django:
  <<: *defaults
  import_ddtrace_auto: true
  import_django: true
ddtrace_run:
  <<: *defaults
  ddtrace_run: true
ddtrace_run_appsec:
  <<: *defaults
  env: {"DD_APPSEC_ENABLED": "true"}
  ddtrace_run: true
ddtrace_run_llmobs:
  <<: *defaults
  # Use agent transport so startup does not require an API key.
  env:
    DD_LLMOBS_ENABLED: "true"
    DD_LLMOBS_AGENTLESS_ENABLED: "false"
    DD_SERVICE: "startup-benchmark"
  ddtrace_run: true
ddtrace_run_profiling:
  <<: *defaults
  env: {"DD_PROFILING_ENABLED": "true"}
  ddtrace_run: true
ddtrace_run_telemetry_enabled:
  <<: *defaults
  env: {"_DD_INSTRUMENTATION_TELEMETRY_TESTS_FORCE_APP_STARTED": "true"}
  ddtrace_run: true
ddtrace_run_telemetry_disabled:
  <<: *defaults
  env: {"DD_INSTRUMENTATION_TELEMETRY_ENABLED": "false", "_DD_INSTRUMENTATION_TELEMETRY_TESTS_FORCE_APP_STARTED": "false"}
  ddtrace_run: true
ddtrace_run_send_span:
  <<: *defaults
  send_span: true
ddtrace_run_runtime_metrics:
  <<: *defaults
  env: {"DD_RUNTIME_METRICS_ENABLED": "true"}
  ddtrace_run: true
import_tracer:
  <<: *defaults
  sdk_action: "from ddtrace.trace import tracer"
import_then_tracer:
  <<: *defaults
  import_ddtrace: true
  sdk_action: "from ddtrace import tracer"
import_then_first_span:
  <<: *defaults
  import_ddtrace: true
  sdk_action: "from ddtrace import tracer; tracer.enabled = False; tracer.trace('startup').finish()"
configure_logger:
  <<: *defaults
  sdk_action: "from ddtrace._logger import configure_ddtrace_logger; configure_ddtrace_logger()"
