id: product-config-import-name
message: Product-owned DDConfig instances must be imported as `config` for telemetry reporting
severity: error
language: python
files:
  - "ddtrace/**/product.py"
  - "ddtrace/**/_product.py"
  - "ddtrace/**/_products/**/*.py"
  - "ddtrace/**/products/**/*.py"
rule:
  any:
    - all:
        - any:
            - all:
                - pattern: from $MODULE import $IMPORTED
                - not:
                    pattern: from $MODULE import config
            - pattern: from $MODULE import $IMPORTED as $ALIAS
        - not:
            any:
              - pattern: from ddtrace.internal.settings.asm import config as asm_config
              - pattern: from ddtrace.internal.settings.appsec_telemetry import config as appsec_telemetry_config
              - pattern: from ddtrace.internal.settings._agent import config as agent_config
    - all:
        - any:
            - kind: function_definition
            - kind: class_definition
        - any:
            - has:
                pattern: from $MODULE import $IMPORTED as config
                stopBy: end
            - has:
                pattern: from $MODULE import ($IMPORTED as config)
                stopBy: end
    - all:
        - pattern: from $MODULE import $IMPORTED
        - inside:
            kind: function_definition
            stopBy: end
        - not:
            pattern: from ddtrace.internal.settings._config import config
    - all:
        - pattern: from $MODULE import ($IMPORTED)
        - inside:
            kind: function_definition
            stopBy: end
        - not:
            pattern: from ddtrace.internal.settings._config import (config)
    - all:
        - pattern: from $MODULE import $IMPORTED
        - inside:
            kind: class_definition
            stopBy: end
    - all:
        - pattern: from $MODULE import ($IMPORTED)
        - inside:
            kind: class_definition
            stopBy: end
constraints:
  MODULE:
    regex: "^ddtrace\\.(internal|debugging)(\\.|$)"
  IMPORTED:
    regex: "(^config$|_config$)"
  ALIAS:
    not:
      regex: "^config$"
note: |
  ProductManager reports a product's DDConfig telemetry only when the product
  module exposes the instance as `config`.

  Import a product-owned configuration using that local name:

    from ddtrace.internal.settings.example import config
    from ddtrace.internal.settings.example import example_config as config

  If the product only consumes a configuration owned and reported elsewhere,
  add its exact import to the shared-config exclusions and valid test cases.
