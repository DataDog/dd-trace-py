id: no-rst-double-backticks
valid:
  - |
    def get_version() -> str:
        # `logging.__version__` on 3.15+
        return ""
  - |
    def patch():
        """Patch `logging` module via `Logger.makeRecord`."""
        pass
  - |
    x = "not a docstring with `single` backticks"
invalid:
  - |
    def get_version() -> str:
        # ``logging.__version__`` deprecated
        return ""
  - |
    def patch():
        """Patch ``logging`` module."""
        pass
  - |
    class C:
        """Wrap ``Logger.makeRecord``."""
