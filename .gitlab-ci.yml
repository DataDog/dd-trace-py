# Temporary scoped measurement only; not part of the fix PR.
# Baseline forces the previous cache-helper behavior; changed uses the new default.
# Four manual jobs, zero automatic retries. No publish or deployment jobs.
stages:
- baseline_1
- changed_1
- changed_2
- baseline_2
workflow:
  rules:
  - when: always
default:
  interruptible: true
variables:
  REPO_LANG: python
  REPO_NOTIFICATION_CHANNEL: '#apm-python-release'
  RELEASE_ALLOW_TEST_FAILURES: false
  RELEASE_ALLOW_BENCHMARK_FAILURES: false
  CI_OTEL_OPERATOR_IMAGES_ENABLED: 'true'
  CI_OTEL_OPERATOR_LANGUAGE: python
  DD_VPA_TEMPLATE: vpa-template-cpu-p70-10percent-2x-oom-min-cap
  SYSTEM_TESTS_REF: 7beb580eafaab6d2f388a109d4c7ebb7b3f95ca3
  PROFILING_NATIVE_IMAGE: registry.ddbuild.io/dd-trace-py:v148356102-1e18d4b-profiling_native
  DD_GIT_REPOSITORY_URL: https://github.com/DataDog/dd-trace-py.git
  CI_UTILS_IMAGE: registry.ddbuild.io/dd-trace-py:v149816936-0fbc9e3-ci-utils@sha256:c94e6149a7aae045ee27c9e8c5b30a16f84addb5e92d690024d920d12d8df83c
  EXT_CACHE_POLICY: pull
  OCI_PACKAGE_MAX_SIZE_BYTES: 80000000
  LIB_INJECTION_IMAGE_MAX_SIZE_BYTES: 120000000
  SUPPORTED_VERSIONS_GENERATOR: scripts/integration_registry/generate_supported_versions.py
  PIP_INDEX_URL: https://depot-read-api-python.us1.ddbuild.io/datadog/python/@current/simple/
  UV_DEFAULT_INDEX: https://depot-read-api-python.us1.ddbuild.io/datadog/python/@current/simple/
  CURRENT_YEAR: '2026'
  CURRENT_BIWEEK: '23'
.macos_measurement:
  stage: package
  variables:
    CMAKE_BUILD_PARALLEL_LEVEL: '12'
    CARGO_BUILD_JOBS: '12'
    CMAKE_ARGS: -DNATIVE_TESTING=OFF
    CIBW_BUILD: '1'
    DD_USE_SCCACHE: '1'
    DD_SERVERLESS_BUILD: '0'
    KUBERNETES_CPU_REQUEST: '6'
    KUBERNETES_MEMORY_REQUEST: 10Gi
    KUBERNETES_MEMORY_LIMIT: 10Gi
    DD_DISABLE_VPA: true
    SYSTEM_VERSION_COMPAT: '0'
    MACOSX_DEPLOYMENT_TARGET: '14.7'
    ARCH_TAG: amd64
    PYTHON_VERSIONS: 3.9 3.10 3.11
  artifacts:
    when: always
    paths:
    - pywheels/*.whl
    - pywheels/*.tar.gz
    - debugwheelhouse/*.log
    - debugwheelhouse/*.zip
  cache:
  - key: v1-download-cache-${CURRENT_YEAR}-${CURRENT_BIWEEK}
    paths:
    - .download_cache
  retry: 0
  script: "set -euo pipefail\nif ! command -v sccache &> /dev/null; then\n  brew install sccache\nfi\nfor python_version in\
    \ ${PYTHON_VERSIONS}; do\n  echo -e \"\\e[0Ksection_start:`date +%s`:build_macos_${python_version}\\r\\e[0KBuilding macOS\
    \ wheel for Python ${python_version}\"\n\n  export UV_PYTHON=\"${python_version}\"\n  .gitlab/scripts/build-wheel.sh\n\
    \n  echo -e \"\\e[0Ksection_end:`date +%s`:build_macos_${python_version}\\r\\e[0K\"\ndone\nsccache --show-stats\n"
  tags:
  - macos:sonoma-amd64
  - specific:true
  before_script:
  - .gitlab/scripts/sccache-diagnostics.sh start
  - '# after_script may not run at the job timeout; capture the live hang first.

    python3 .gitlab/scripts/sccache-watchdog.py &

    # Resolve the current Bash job to avoid signaling a reused PID.

    trap ''kill "%?sccache-watchdog.py" 2>/dev/null || true; wait "%?sccache-watchdog.py" 2>/dev/null || true'' EXIT

    '
  after_script:
  - if [ "$CI_JOB_STATUS" = "failed" ]; then .gitlab/scripts/sccache-diagnostics.sh failure; fi
  when: manual
  allow_failure: false
  timeout: 60m
  dependencies: []
  resource_group: sdct-1443-macos-cache-measure
macos cache baseline_1:
  extends: .macos_measurement
  stage: baseline_1
  variables:
    EXT_CACHE_ENABLED: '1'
macos cache changed_1:
  extends: .macos_measurement
  stage: changed_1
  variables:
    EXT_CACHE_ENABLED: '0'
macos cache changed_2:
  extends: .macos_measurement
  stage: changed_2
  variables:
    EXT_CACHE_ENABLED: '0'
macos cache baseline_2:
  extends: .macos_measurement
  stage: baseline_2
  variables:
    EXT_CACHE_ENABLED: '1'
