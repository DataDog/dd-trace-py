# ddtest pilot for the `internal` suite.
#
# This file is included into the child pipeline via .gitlab/tests.yml (the
# template gen_gitlab_config.py copies into .gitlab/tests-gen.yml). It is
# NOT wired into gen_gitlab_config.py — it is a standalone pilot job that
# lives next to build_base_venvs so it can reuse the prebuilt riot venvs
# instead of recompiling ddtrace.
#
# Option 1 (chosen): ddtest stays unchanged; riot knowledge stays in the
# bridge (scripts/ddtest-riot.py).
#
# The pilot runs ONE riot venv (Python 3.10) to prove the flow; fanning out
# across all 12 `internal` hashes and multiple CI nodes per venv is a
# follow-up once this is green.
#
# Flow (single job, auto-run):
#   needs build_base_venvs (PYTHON_VERSION=3.10)  -> restores .riot/venv_py310
#   download ddtest binary
#   riot prepare (via bridge)                       -> install per-hash deps (envier, ...)
#   eval "$(python scripts/ddtest-riot.py venv-env 4f70b3c)"  -> activate venv
#   ddtest plan  -p python -f pytest --tests-location tests/internal \
#                 --min-parallelism 1 --max-parallelism 1
#   ddtest run   -p python -f pytest --ci-node 0 --ci-node-workers ncpu
#
# The pilot does NOT run `riot generate`: it reuses the venv built by
# build_base_venvs (which already compiled the native extensions), so it
# needs only default runner resources. It calls the bridge's `prepare`
# subcommand (riot's VenvInstance.prepare via the library API) to install
# the per-hash deps into the prefix, because build_base_venvs only
# installs ddtrace into the base venv — the per-hash deps are installed
# lazily by prepare, exactly as the legacy `riot run -s <hash> -- --ddtrace`
# job does before pytest.
#
# The pilot runs automatically on every child pipeline (push) so it can be
# observed without merging. `allow_failure: true` keeps a pilot failure
# from blocking merges while the ddtest path is being validated; drop it
# once green.

ddtest-internal-pilot:
  extends: .testrunner
  stage: core
  services:
    - !reference [.services, ddagent]
  needs:
    - prechecks
    - job: build_base_venvs
      artifacts: true
      parallel:
        matrix:
          - PYTHON_VERSION: "3.10"
  before_script:
    - !reference [.testrunner, before_script]
    - unset DD_SERVICE
    - unset DD_ENV
    - unset DD_TAGS
    - unset DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED
  variables:
    # The riot short hash for the `internal` venv on Python 3.10. Regenerate
    # with `python scripts/ddtest-riot.py hashes internal` if the riotfile
    # package spec changes.
    RIOT_HASH: "4f70b3c"
    DDTEST_VERSION: "latest"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: true
    - allow_failure: true
  script:
    - |
      set -e
      # 1. Download the ddtest binary.
      mkdir -p bin
      curl -fsSL "https://github.com/DataDog/ddtest/releases/${DDTEST_VERSION}/download/ddtest-linux-amd64" -o bin/ddtest
      chmod +x bin/ddtest

      # 2. Prepare the per-hash riot venv. build_base_venvs only installs
      #    ddtrace into the base venv (venv_py310); the per-hash deps
      #    (envier, pytest, ...) are installed into the prefix
      #    (venv_py310_<ident>) by riot's VenvInstance.prepare.
      #    Call prepare directly via the bridge (riot as a library,
      #    skip_deps=True skips the ddtrace reinstall already in the base)
      #    so the per-hash deps are present before ddtest runs.
      python scripts/ddtest-riot.py prepare "${RIOT_HASH}"

      # 3. Activate the riot venv for this hash. The build_base_venvs
      #    artifact already restored .riot/venv_py310 with ddtrace compiled;
      #    the bridge reads the riotfile and emits KEY=value lines (VIRTUAL_ENV,
      #    PATH with the venv bin first, PYTHONPATH site-packages, the venv's
      #    env vars, riot's RIOT_* vars, and DDTEST_SUITE_PATH). We eval them so
      #    `python` resolves to the venv interpreter and ddtrace/pytest are
      #    importable.
      eval "$(python scripts/ddtest-riot.py venv-env "${RIOT_HASH}")"
      python -c "import ddtrace, pytest"

      # 4. Plan: discover tests/internal files and write .testoptimization/.
      #    Single CI node for this pilot (see file header).
      ./bin/ddtest plan \
        --platform python \
        --framework pytest \
        --tests-location "tests/internal/**/test*.py" \
        --min-parallelism 1 \
        --max-parallelism 1

      # 5. Run: execute this node's files in the activated venv. ncpu fans out
      #    with xdist inside the job.
      ./bin/ddtest run \
        --platform python \
        --framework pytest \
        --ci-node 0 \
        --ci-node-workers ncpu
