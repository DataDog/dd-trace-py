# Auto-bump libdatadog to a target commit. Mirrors dd-trace-php's
# libdatadog-latest job: the bump itself is deterministic, and validation is
# delegated to the real dd-trace-py pipeline — this job does NOT run the test
# suite itself. Flow (logic in scripts/libdatadog-auto-update.py, prompts in
# .gitlab/libdatadog-auto-update-{repair,review}-prompt.md):
#
#   1. Bump the libdatadog revs in src/native/Cargo.toml (+Cargo.lock, release
#      note) and push the result to a branch as a GitHub-signed commit.
#   2. The push triggers the full, parallelized dd-trace-py pipeline for that
#      branch; the job waits for it via the GitLab API.
#   3. On red: collect failed jobs (retrying a handful once to filter flaky
#      tests), hand their trace tails to Claude — which has no cargo/Bash
#      access and must reason from the errors alone — then gate the repair
#      with an independent "changes are mechanical" review agent, push the
#      repair commit, and wait for the next pipeline run.
#
# Runs on the testrunner image because it carries the Rust toolchain the
# lockfile refresh (cargo update) relies on. Three credentials are wired:
#
# - AI Gateway for the repair and review agents
# - GitHub (dd-octo-sts) for the branch push
# - GitLab (BTI, via authanywhere) for pipeline polling/failure collection
#
# The intended usage of this job is to be triggered from libdatadog in order to
# either check the performance of a new change, check for regression, etc.
# without having to wait for the change to land in a release and then in the
# tracer.

include:
  - local: ".gitlab/testrunner.yml"

libdatadog-auto-update:
  stage: tests
  extends: .testrunner
  # Like the PHP job (timeout: 5h): waiting for a full pipeline run plus up to
  # a few repair rounds takes hours, not minutes.
  timeout: 5h
  needs: []
  interruptible: false
  rules:
    - if: '$UPDATE_LIBDATADOG_VERSION == "true"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: manual
      allow_failure: true
  id_tokens:
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
  variables:
    ARTIFACTS_DIR: "${CI_PROJECT_DIR}/libdatadog-auto-update"
    # The commit is created server-side via the GitHub API (see the script), so
    # GitHub attributes it to the dd-octo-sts bot and signs it ("Verified") — no
    # local git author/committer, push remote, or token-in-URL needed.
  before_script:
    - !reference [.testrunner, before_script]
  script:
    # Download authanywhere, install Node LTS and the Claude CLI (for the repair
    # loop). Slow steps first so the short-lived AI token is minted last.
    # auth artifacts live in $HOME (outside the repo working tree) so they can
    # never appear in `git status` and thus never be committed.
    - |
      if [ "$(uname -m)" = "x86_64" ]; then ARCH="amd64"; else ARCH="arm64"; fi
      curl -fsSL -o "$HOME/authanywhere" "https://binaries.ddbuild.io/dd-source/authanywhere/LATEST/authanywhere-linux-${ARCH}"
      chmod +x "$HOME/authanywhere"
      curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
      # The testrunner image sets NPM_CONFIG_PREFIX, which nvm refuses to run with.
      unset NPM_CONFIG_PREFIX
      export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh"
      nvm install --lts
      npm install -g @anthropic-ai/claude-code
    # GitHub token for the push (used only by the script's GitHub API calls — never
    # placed in a git remote URL). Best-effort: if unavailable, the script still
    # bumps + validates and just lists the changes instead of pushing.
    # Written to $HOME (outside the repo, not an artifact) so after_script can revoke it.
    - |
      if command -v dd-octo-sts >/dev/null 2>&1; then
        dd-octo-sts token --scope DataDog/dd-trace-py --policy gitlab.libdatadog-update.create-pr > "$HOME/.dd_octo_sts_token" || true
        if [ -s "$HOME/.dd_octo_sts_token" ]; then
          export GH_TOKEN="$(cat "$HOME/.dd_octo_sts_token")"
        else
          echo "dd-octo-sts produced no token (is gitlab.libdatadog-update.create-pr merged to main?). The push will be skipped."
        fi
      else
        echo "dd-octo-sts not found in image. The push will be skipped (changes listed only)."
      fi
    # Mint the AI Gateway token immediately before use (short expiry), re-source
    # nvm so the claude CLI is on PATH, then run the update. The script mints its
    # own BTI/GitLab token (for pipeline polling) from the authanywhere binary
    # via AUTHANYWHERE_BIN. Live: a green run pushes a verified commit to a
    # branch via the GitHub API and validates it with the pipeline that the push
    # triggers (no-op if already on latest main, or skipped if no token was minted).
    - |
      unset NPM_CONFIG_PREFIX
      export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh"
      export AUTHANYWHERE_BIN="$HOME/authanywhere"
      raw_token="$("$HOME/authanywhere" --audience rapid-ai-platform)"
      export ANTHROPIC_AUTH_TOKEN="${raw_token#Authorization: Bearer }"
      export ANTHROPIC_BASE_URL="https://ai-gateway.us1.ddbuild.io"
      export ANTHROPIC_CUSTOM_HEADERS=$'source: claude\norg-id: 2\nprovider: anthropic\nx-dd-tag-ml_app: dd-trace-py-libdatadog-update\nx-dd-tag-dd.team: apm-python'
      scripts/libdatadog-auto-update.py
  after_script:
    # Preserve the testrunner's core-backtrace step, then revoke the GitHub token
    # immediately via the broker (rather than waiting out its short lifetime).
    # after_script runs in a fresh shell, so the token is read from the file.
    - !reference [.testrunner, after_script]
    - if [[ -s "$HOME/.dd_octo_sts_token" ]]; then dd-octo-sts revoke -t "$(cat "$HOME/.dd_octo_sts_token")" || true; fi
    - rm -f "$HOME/.dd_octo_sts_token"
  artifacts:
    when: always
    paths:
      - libdatadog-auto-update/
    expire_in: 1 month
