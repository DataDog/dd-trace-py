stages:
  - setup
  - riot
  - exploration

variables:
  RIOT_RUN_CMD: riot -P -v run --exitfirst --pass-env -s
  REPO_LANG: python # "python" is used everywhere rather than "py"
  # CI_DEBUG_SERVICES: "true"

include:
  - local: ".gitlab/services.yml"
  - local: ".gitlab/testrunner.yml"


# Do not define a `needs:` in order to depend on the whole `precheck` stage
.test_base_riot:
  extends: .testrunner
  stage: riot
  needs: [ build_base_venvs, prechecks ]
  parallel: 4
  services:
    - !reference [.services, ddagent]
  # DEV: This is the max retries that GitLab currently allows for
  before_script:
    - !reference [.testrunner, before_script]
    - unset DD_SERVICE
    - unset DD_ENV
    - unset DD_TAGS
    - unset DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED
  script:
    - |
      hashes=( $(.gitlab/scripts/get-riot-hashes.sh "${SUITE_NAME}") )
      echo "NIGHTLY_BUILD: ${NIGHTLY_BUILD}"
      if [[ ${#hashes[@]} -eq 0 ]]; then
        echo "No riot hashes found for ${SUITE_NAME}"
        exit 1
      fi
      for hash in "${hashes[@]}"
      do
        echo "Running riot hash: ${hash}"
        riot list "${hash}"
        ${RIOT_RUN_CMD} "${hash}" -- --ddtrace
      done
      ./scripts/check-diff ".riot/requirements/" \
        "Changes detected after running riot. Consider deleting changed files, running scripts/compile-and-prune-test-requirements and committing the result."
      ./scripts/check-diff "scripts/integration_registry/registry.yaml" \
        "Registry YAML file (scripts/integration_registry/registry.yaml) was modified. Please run: scripts/integration_registry/update_and_format_registry.py and commit the changes."


.test_base_riot_snapshot:
  extends: .test_base_riot
  services:
    - !reference [.test_base_riot, services]
    - !reference [.services, testagent]
  before_script:
    - !reference [.test_base_riot, before_script]
    # DEV: All job variables get shared with services, setting `DD_TRACE_AGENT_URL` on the testagent will tell it to forward all requests to the
    # agent at that host. Therefore setting this as a variable will cause recursive requests to the testagent
    - export DD_TRACE_AGENT_URL="http://testagent:9126"
    - ln -s "${CI_PROJECT_DIR}" "/home/bits/project"

.test_base_riot_gpu:
  extends: .test_base_riot
  image: !reference [.testrunner_gpu, image]
  tags: !reference [.testrunner_gpu, tags]
  timeout: 40m
  parallel: 2
  variables:
    KUBERNETES_MEMORY_REQUEST: "12Gi"
    KUBERNETES_MEMORY_LIMIT: "12Gi"
    KUBERNETES_CPU_REQUEST: "2"
    KUBERNETES_CPU_LIMIT: "2"
  before_script:
    - !reference [.testrunner_gpu, before_script]
    - !reference [.test_base_riot, before_script]

.test_base_riot_gpu_snapshot:
  extends: .test_base_riot_gpu
  services:
    - !reference [.test_base_riot_gpu, services]
    - !reference [.services, testagent]
  before_script:
    - !reference [.test_base_riot_gpu, before_script]
    - export DD_TRACE_AGENT_URL="http://testagent:9126"
    - ln -s "${CI_PROJECT_DIR}" "/home/bits/project"

# ---------------------------------------------------------------------------
# ddtest job templates. Used by gen_gitlab_config.py for suites with
# `ddtest: true` in suitespec. ddtest owns plan/run + file splitting; riot
# knowledge stays in scripts/ddtest-riot.py (the bridge). See
# docs/ddtest-dogfooding.md for the full design.
#
# before_script and script share the same shell session in GitLab. Venv
# preparation and activation are deliberately kept out of this common base:
# plan jobs iterate over several hashes, while run jobs have one hash each.
# ---------------------------------------------------------------------------
.ddtest_build:
  extends: .testrunner
  stage: setup
  needs: [prechecks]
  script:
    - |
      set -e -o pipefail
      mkdir -p bin
      # Build ddtest from main (merged but not yet released).
      curl -fsSL https://go.dev/dl/go1.26.5.linux-amd64.tar.gz | tar xz -C /tmp
      export PATH="/tmp/go/bin:$PATH"
      rm -rf /tmp/ddtest-src
      git clone --depth 1 https://github.com/DataDog/ddtest.git /tmp/ddtest-src
      (cd /tmp/ddtest-src && go build -o "${CI_PROJECT_DIR}/bin/ddtest" .)
      chmod +x bin/ddtest
  artifacts:
    paths:
      - bin/ddtest
    expire_in: 1 week

.ddtest_base:
  extends: .testrunner
  services:
    - !reference [.services, ddagent]
  before_script:
    - !reference [.testrunner, before_script]
    - unset DD_SERVICE
    - unset DD_ENV
    - unset DD_TAGS
    - unset DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED

.ddtest_base_snapshot:
  extends: .ddtest_base
  services:
    - !reference [.ddtest_base, services]
    - !reference [.services, testagent]
  before_script:
    - !reference [.ddtest_base, before_script]
    - ln -s "${CI_PROJECT_DIR}" "/home/bits/project"

# Plan: discover the venv's suite files and write .testoptimization/.
# No snapshot variant — plan only collects (glob + Datadog API) and sends
# no traces, so the testagent is never needed at plan time.
# --tests-location is a raw glob (ddtest does not combine it with python_files),
# so it must include the file-glob part. A file::node selector is handled by
# using the file for discovery; the matching pytest filter is supplied through
# DDTEST_PYTEST_ADDOPTS.
.ddtest_plan:
  extends: .ddtest_base
  script:
    - |
      # Keep each hash in a subshell. venv-env starts from the current process
      # environment, so a loop without a subshell would accumulate PATH and
      # PYTHONPATH entries from every previously activated venv.
      for _hash in ${RIOT_HASHES}; do
        scripts/ddtest-riot.py prepare "${_hash}"
        (
          eval "$(scripts/ddtest-riot.py venv-env "${_hash}")"
          : "${DDTEST_SUITE_PATH:?DDTEST_SUITE_PATH is required for every ddtest venv}"
          _test_path="${DDTEST_SUITE_PATH%%::*}"
          case "${_test_path}" in
            *.py) _tests_location="${_test_path}" ;;
            *) _tests_location="${_test_path%/}/**/test*.py" ;;
          esac
          _pytest_addopts="${DDTEST_PYTEST_ADDOPTS:-}"
          if [[ "${NIGHTLY_BUILD}" != "true" && "${_pytest_addopts}" != *"--no-cov"* ]]; then
            _pytest_addopts="${_pytest_addopts} --no-cov"
          fi
          export PYTEST_ADDOPTS="${_pytest_addopts# }"
          # ddtest reads DD_TRACE_AGENT_URL for the agent URL.
          # _CI_DD_AGENT_URL is set by .testrunner before_script to
          # the real agent (ddagent sidecar). Export it as
          # DD_TRACE_AGENT_URL so ddtest's API requests go
          # through the agent's EVP proxy (not localhost:8126
          # default, which may not reach the agent in all setups).
          export DD_TRACE_AGENT_URL="${_CI_DD_AGENT_URL}"
          ./bin/ddtest plan \
            --platform python \
            --framework pytest \
            --tests-location "${_tests_location}" \
            --min-parallelism "${DDTEST_NODES}" \
            --max-parallelism "${DDTEST_NODES}"
        )
        mv .testoptimization ".testoptimization-${_hash}"
      done
  artifacts:
    when: always
    paths:
      - .testoptimization-*/
    expire_in: 1 week

# Run: execute this CI node's files in the activated venv.
# 4 workers (not ncpu): the testrunner image runs on many-core k8s pods
# where ncpu spawns too many workers and corrupts pytest-cov's sqlite DB;
# matching PYTEST_XDIST_AUTO_NUM_WORKERS=4 from testrunner.yml.
.ddtest_run:
  extends: .ddtest_base
  script:
    - |
      scripts/ddtest-riot.py prepare "${RIOT_HASH}"
      eval "$(scripts/ddtest-riot.py venv-env "${RIOT_HASH}")"
      : "${DDTEST_SUITE_PATH:?DDTEST_SUITE_PATH is required for every ddtest venv}"
      _pytest_addopts="${DDTEST_PYTEST_ADDOPTS:-}"
      if [[ "${NIGHTLY_BUILD}" != "true" && "${_pytest_addopts}" != *"--no-cov"* ]]; then
        _pytest_addopts="${_pytest_addopts} --no-cov"
      fi
      export PYTEST_ADDOPTS="${_pytest_addopts# }"
      # Restore this venv's plan artifact (partitioned by RIOT_HASH in the plan job).
      rm -rf .testoptimization
      mv ".testoptimization-${RIOT_HASH}" .testoptimization
      # Use a unique coverage data file per run to avoid sqlite corruption
      # when multiple xdist workers (--ci-node-workers) write to the
      # same .coverage file simultaneously. Coverage is still collected
      # and can be consolidated afterwards via 'coverage combine'.
      export COVERAGE_FILE=".coverage.${RIOT_HASH}.${CI_NODE_INDEX}"
      ./bin/ddtest run \
        --platform python \
        --framework pytest \
        --ci-node "${CI_NODE_INDEX}" \
        --ci-node-workers 4
      # Consolidate per-worker coverage files into one .coverage file.
      # Each xdist worker wrote to its own COVERAGE_FILE;
      # 'coverage combine' merges them so coverage can be uploaded.
      coverage_files=(.coverage.*)
      if [[ -e "${coverage_files[0]}" ]]; then
        coverage combine
      fi

.ddtest_run_snapshot:
  extends: .ddtest_base_snapshot
  script:
    - |
      scripts/ddtest-riot.py prepare "${RIOT_HASH}"
      eval "$(scripts/ddtest-riot.py venv-env "${RIOT_HASH}")"
      : "${DDTEST_SUITE_PATH:?DDTEST_SUITE_PATH is required for every ddtest venv}"
      _pytest_addopts="${DDTEST_PYTEST_ADDOPTS:-}"
      if [[ "${NIGHTLY_BUILD}" != "true" && "${_pytest_addopts}" != *"--no-cov"* ]]; then
        _pytest_addopts="${_pytest_addopts} --no-cov"
      fi
      export PYTEST_ADDOPTS="${_pytest_addopts# }"
      rm -rf .testoptimization
      mv ".testoptimization-${RIOT_HASH}" .testoptimization
      # Use a unique coverage data file per run to avoid sqlite corruption
      # when multiple xdist workers (--ci-node-workers) write to the
      # same .coverage file simultaneously. Coverage is still collected
      # and can be consolidated afterwards via 'coverage combine'.
      export COVERAGE_FILE=".coverage.${RIOT_HASH}.${CI_NODE_INDEX}"
      # Snapshot suites: send traces to the testagent (not the real agent)
      # for local snapshot comparison. Set DD_TRACE_AGENT_URL only
      # for the inner pytest (ddtest run), not in before_script
      # (so plan uses the real agent).
      export DD_TRACE_AGENT_URL="http://testagent:9126"
      ./bin/ddtest run \
        --platform python \
        --framework pytest \
        --ci-node "${CI_NODE_INDEX}" \
        --ci-node-workers 4
      # Consolidate per-worker coverage files into one .coverage file.
      coverage_files=(.coverage.*)
      if [[ -e "${coverage_files[0]}" ]]; then
        coverage combine
      fi

# Required jobs will appear here
