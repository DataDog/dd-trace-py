stages:
  - setup
  - test
  - exploration

variables:
  REPO_LANG: python # "python" is used everywhere rather than "py"
  # CI_DEBUG_SERVICES: "true"

include:
  - local: ".gitlab/services.yml"
  - local: ".gitlab/testrunner.yml"


.test_base:
  extends: .testrunner
  stage: test
  needs: [prechecks]
  services:
    - !reference [.services, ddagent]
  before_script:
    - !reference [.testrunner, before_script]
    # Artifact extraction preserves build timestamps, so refresh native outputs after checkout.
    - find ddtrace -type f -name '*.so*' -exec touch {} +
    - unset DD_SERVICE
    - unset DD_ENV
    - unset DD_TAGS
    - unset DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED
  script:
    - |
      shard_variable="TEST_ENVIRONMENTS_${CI_NODE_INDEX:-1}"
      read -ra environment_hashes <<< "${!shard_variable:-}"
      if [[ ${#environment_hashes[@]} -eq 0 ]]; then
        echo "No uv environments found for ${TEST_SUITE}"
        exit 1
      fi
      for environment_hash in "${environment_hashes[@]}"
      do
        echo "Running uv environment: ${environment_hash}"
        export _CI_DD_TAGS="test.configuration.environment_id:${environment_hash}"
        scripts/run-tests -s --venv "${environment_hash}" -- --ddtrace
      done
      ./scripts/check-diff ".uv/" \
        "Changes detected in uv locks. Run scripts/test-env lock and commit the result."

.test_base_snapshot:
  extends: .test_base
  services:
    - !reference [.test_base, services]
    - !reference [.services, testagent]
  before_script:
    - !reference [.test_base, before_script]
    - export DD_TRACE_AGENT_URL="http://testagent:9126"

.test_base_gpu:
  extends: .test_base
  image: !reference [.testrunner_gpu, image]
  tags: !reference [.testrunner_gpu, tags]
  timeout: 40m
  parallel: 2
  variables:
    KUBERNETES_MEMORY_REQUEST: "12Gi"
    KUBERNETES_MEMORY_LIMIT: "12Gi"
    KUBERNETES_CPU_REQUEST: "2"
    KUBERNETES_CPU_LIMIT: "2"
  before_script:
    - !reference [.testrunner_gpu, before_script]
    - !reference [.test_base, before_script]

.test_base_gpu_snapshot:
  extends: .test_base_gpu
  services:
    - !reference [.test_base_gpu, services]
    - !reference [.services, testagent]
  before_script:
    - !reference [.test_base_gpu, before_script]
    - export DD_TRACE_AGENT_URL="http://testagent:9126"

