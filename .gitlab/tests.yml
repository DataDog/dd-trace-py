stages:
  - setup
  - riot
  - exploration

variables:
  RIOT_RUN_CMD: riot -P -v run --exitfirst --pass-env -s
  REPO_LANG: python # "python" is used everywhere rather than "py"
  # CI_DEBUG_SERVICES: "true"

include:
  - local: ".gitlab/services.yml"
  - local: ".gitlab/testrunner.yml"


# Do not define a `needs:` in order to depend on the whole `precheck` stage
.test_base_riot:
  extends: .testrunner
  stage: riot
  needs: [ build_base_venvs, prechecks ]
  parallel: 4
  services:
    - !reference [.services, ddagent]
  # DEV: This is the max retries that GitLab currently allows for
  before_script:
    - !reference [.testrunner, before_script]
    - unset DD_SERVICE
    - unset DD_ENV
    - unset DD_TAGS
    - unset DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED
  script:
    - |
      hashes=( $(.gitlab/scripts/get-riot-hashes.sh "${SUITE_NAME}") )
      echo "NIGHTLY_BUILD: ${NIGHTLY_BUILD}"
      if [[ ${#hashes[@]} -eq 0 ]]; then
        echo "No riot hashes found for ${SUITE_NAME}"
        exit 1
      fi
      for hash in "${hashes[@]}"
      do
        echo "Running riot hash: ${hash}"
        riot list "${hash}"
        ${RIOT_RUN_CMD} "${hash}" -- --ddtrace
      done
      ./scripts/check-diff ".riot/requirements/" \
        "Changes detected after running riot. Consider deleting changed files, running scripts/compile-and-prune-test-requirements and committing the result."
      ./scripts/check-diff "scripts/integration_registry/registry.yaml" \
        "Registry YAML file (scripts/integration_registry/registry.yaml) was modified. Please run: scripts/integration_registry/update_and_format_registry.py and commit the changes."


.test_base_riot_snapshot:
  extends: .test_base_riot
  services:
    - !reference [.test_base_riot, services]
    - !reference [.services, testagent]
  before_script:
    - !reference [.test_base_riot, before_script]
    # DEV: All job variables get shared with services, setting `DD_TRACE_AGENT_URL` on the testagent will tell it to forward all requests to the
    # agent at that host. Therefore setting this as a variable will cause recursive requests to the testagent
    - export DD_TRACE_AGENT_URL="http://testagent:9126"
    - ln -s "${CI_PROJECT_DIR}" "/home/bits/project"

.test_base_riot_gpu:
  extends: .test_base_riot
  image: !reference [.testrunner_gpu, image]
  tags: !reference [.testrunner_gpu, tags]
  timeout: 40m
  parallel: 2
  variables:
    KUBERNETES_MEMORY_REQUEST: "12Gi"
    KUBERNETES_MEMORY_LIMIT: "12Gi"
    KUBERNETES_CPU_REQUEST: "2"
    KUBERNETES_CPU_LIMIT: "2"
  before_script:
    - !reference [.testrunner_gpu, before_script]
    - !reference [.test_base_riot, before_script]

.test_base_riot_gpu_snapshot:
  extends: .test_base_riot_gpu
  services:
    - !reference [.test_base_riot_gpu, services]
    - !reference [.services, testagent]
  before_script:
    - !reference [.test_base_riot_gpu, before_script]
    - export DD_TRACE_AGENT_URL="http://testagent:9126"
    - ln -s "${CI_PROJECT_DIR}" "/home/bits/project"

.test_base_uv:
  extends: .testrunner
  stage: riot
  needs: [prechecks]
  services:
    - !reference [.services, ddagent]
  before_script:
    - !reference [.testrunner, before_script]
    # Artifact extraction preserves build timestamps, so refresh native outputs after checkout.
    - find ddtrace -type f -name '*.so*' -exec touch {} +
    - unset DD_SERVICE
    - unset DD_ENV
    - unset DD_TAGS
    - unset DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED
  script:
    - |
      shard_variable="TEST_ENVIRONMENTS_${CI_NODE_INDEX:-1}"
      read -ra environment_hashes <<< "${!shard_variable:-}"
      if [[ ${#environment_hashes[@]} -eq 0 ]]; then
        echo "No uv environments found for ${TEST_SUITE}"
        exit 1
      fi
      for environment_hash in "${environment_hashes[@]}"
      do
        echo "Running uv environment: ${environment_hash}"
        scripts/run-tests -s --venv "${environment_hash}" -- --ddtrace
      done
      ./scripts/check-diff ".riot/requirements/" \
        "Changes detected in committed test locks. Run scripts/compile-and-prune-test-requirements and commit the result."

# ---------------------------------------------------------------------------
# ddtest's uv runner reuses the same suite definitions as normal uv jobs.
# It plans each hash independently because ddtest writes .testoptimization in
# the checkout root, then restores the matching plan in each run matrix job.
.ddtest_base_uv:
  extends: .test_base_uv

.ddtest_base_uv_snapshot:
  extends: .ddtest_base_uv
  services:
    - !reference [.ddtest_base_uv, services]
    - !reference [.services, testagent]
  before_script:
    - !reference [.ddtest_base_uv, before_script]
    - ln -s "${CI_PROJECT_DIR}" "/home/bits/project"

.ddtest_plan_uv:
  extends: .ddtest_base_uv
  script:
    - |
      set -euo pipefail
      for hash_py in ${TEST_ENVIRONMENT_HASH_PYTHON}; do
        IFS=: read -r environment_hash python_version lockfile tests_location <<< "${hash_py}"
        requirements="$(mktemp)"
        grep -vi '^ddtrace==' "${lockfile}" > "${requirements}"
        wheel="$(find ".cache/ddtrace-test-wheels/${python_version}" -name 'ddtrace-*.whl' -print -quit)"
        uv run --isolated --no-project --python "python${python_version}" --no-python-downloads \
          --with-requirements "${requirements}" --with "${wheel}" \
          ddtest plan --platform python --framework pytest --tests-location "${tests_location}" \
          --min-parallelism "${DDTEST_NODES}" --max-parallelism "${DDTEST_NODES}"
        rm -f "${requirements}"
        mv .testoptimization ".testoptimization-${environment_hash}"
      done
  artifacts:
    when: always
    paths:
      - .testoptimization-*/
    expire_in: 1 week

.ddtest_run_uv:
  extends: .ddtest_base_uv
  script:
    - |
      rm -rf .testoptimization
      mv ".testoptimization-${TEST_ENVIRONMENT_HASH}" .testoptimization
      export COVERAGE_FILE=".coverage.${TEST_ENVIRONMENT_HASH}.${CI_NODE_INDEX}"
      requirements="$(mktemp)"
      grep -vi '^ddtrace==' "${TEST_ENVIRONMENT_LOCKFILE}" > "${requirements}"
      wheel="$(find ".cache/ddtrace-test-wheels/${PYTHON_VERSION}" -name 'ddtrace-*.whl' -print -quit)"
      uv run --isolated --no-project --python "python${PYTHON_VERSION}" --no-python-downloads \
        --with-requirements "${requirements}" --with "${wheel}" \
        ddtest run --platform python --framework pytest --ci-node "${CI_NODE_INDEX}" --ci-node-workers 4
      rm -f "${requirements}"
      coverage combine || true

.ddtest_run_uv_snapshot:
  extends: .ddtest_base_uv_snapshot
  script:
    - |
      rm -rf .testoptimization
      mv ".testoptimization-${TEST_ENVIRONMENT_HASH}" .testoptimization
      export COVERAGE_FILE=".coverage.${TEST_ENVIRONMENT_HASH}.${CI_NODE_INDEX}"
      requirements="$(mktemp)"
      grep -vi '^ddtrace==' "${TEST_ENVIRONMENT_LOCKFILE}" > "${requirements}"
      wheel="$(find ".cache/ddtrace-test-wheels/${PYTHON_VERSION}" -name 'ddtrace-*.whl' -print -quit)"
      uv run --isolated --no-project --python "python${PYTHON_VERSION}" --no-python-downloads \
        --with-requirements "${requirements}" --with "${wheel}" \
        ddtest run --platform python --framework pytest --ci-node "${CI_NODE_INDEX}" --ci-node-workers 1
      rm -f "${requirements}"
      coverage combine || true

# ---------------------------------------------------------------------------
# ddtest job templates. Used by gen_gitlab_config.py for suites with
# `ddtest: true` in suitespec. ddtest owns plan/run + file splitting; riot
# knowledge stays in Riot's command override.
#
# before_script and script share the same shell session in GitLab. Venv
# preparation and activation are handled by Riot for each command.
# ---------------------------------------------------------------------------
.ddtest_base:
  extends: .testrunner
  services:
    - !reference [.services, ddagent]
  before_script:
    - !reference [.testrunner, before_script]
    - unset DD_SERVICE
    - unset DD_ENV
    - unset DD_TAGS
    - unset DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED

.ddtest_base_snapshot:
  extends: .ddtest_base
  services:
    - !reference [.ddtest_base, services]
    - !reference [.services, testagent]
  before_script:
    - !reference [.ddtest_base, before_script]
    - ln -s "${CI_PROJECT_DIR}" "/home/bits/project"

.ddtest_base_gpu:
  extends: .ddtest_base
  image: !reference [.testrunner_gpu, image]
  tags: !reference [.testrunner_gpu, tags]
  timeout: 40m
  before_script:
    - !reference [.testrunner_gpu, before_script]
    - unset DD_SERVICE
    - unset DD_ENV
    - unset DD_TAGS
    - unset DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED

.ddtest_base_gpu_snapshot:
  extends: .ddtest_base_gpu
  services:
    - !reference [.ddtest_base_gpu, services]
    - !reference [.services, testagent]
  before_script:
    - !reference [.ddtest_base_gpu, before_script]
    - ln -s "${CI_PROJECT_DIR}" "/home/bits/project"

# Keep GPU ddtest templates hidden until a suite opts in with gpu: true.
.ddtest_plan_gpu:
  extends:
    - .ddtest_plan
    - .ddtest_base_gpu

.ddtest_run_gpu:
  extends:
    - .ddtest_run
    - .ddtest_base_gpu

.ddtest_run_gpu_snapshot:
  extends:
    - .ddtest_run_snapshot
    - .ddtest_base_gpu_snapshot

# Plan: discover the venv's suite files and write .testoptimization/
# No snapshot variant — plan only collects (glob + Datadog API) and sends
# no traces, so the testagent is never needed at plan time.
# --tests-location is a raw glob (ddtest does not combine it with python_files),
# so each Riot venv declares its complete location in DDTEST_TESTS_LOCATION.
.ddtest_plan:
  extends: .ddtest_base
  script:
    - |
      set -euo pipefail
      export DDTEST_PLAN_AGENT_URL="${_CI_DD_AGENT_URL}"
      riot_cmd=(riot -P -v run --pass-env -s)
      # Keep at most one planner active per Python version: Riot's nspkgs()
      # temporarily modifies namespace-package .pth files in the shared base
      # venv. Each hash gets its own worktree, so its hash-specific venv and
      # planner output are isolated, but same-Python planners cannot overlap.
      declare -A hashes_by_python=()
      declare -A plan_workdirs=()
      cleanup_worktrees() {
        local workdir
        for workdir in "${plan_workdirs[@]}"; do
          git worktree remove --force "${workdir}" >/dev/null 2>&1 || rm -rf "${workdir}"
        done
      }
      trap cleanup_worktrees EXIT

      # Each plan writes fixed paths below .testoptimization, so give every
      # hash its own Git worktree and output directory.
      for hash_py in ${RIOT_HASH_PYTHON}; do
        _hash="${hash_py%%:*}"
        _py="${hash_py#*:}"
        _workdir="$(mktemp -d "${TMPDIR:-/tmp}/ddtest-plan.XXXXXX")"
        rmdir "${_workdir}"
        git worktree add --quiet --detach "${_workdir}" HEAD
        # .riot/requirements is tracked, so the directory already exists in
        # the worktree. Share only the built base venvs from the artifact;
        # hash-specific venvs and their outputs remain worktree-local.
        base_venv_count=0
        for _venv in "${CI_PROJECT_DIR}"/.riot/venv_*; do
          [[ -d "${_venv}" ]] || continue
          ln -s "${_venv}" "${_workdir}/.riot/$(basename "${_venv}")"
          ((base_venv_count += 1))
        done
        if ((base_venv_count == 0)); then
          echo "No base Riot venvs found under ${CI_PROJECT_DIR}/.riot" >&2
          exit 1
        fi
        plan_workdirs["${_hash}"]="${_workdir}"
        hashes_by_python["${_py}"]+="${_hash} "
      done

      # Limit concurrent Python groups because each group may install a
      # hash-specific dependency set in the same pod. Four groups preserve
      # useful cross-version parallelism without allowing all six versions to
      # peak during pip installs and exhaust the planner's memory limit.
      plan_parallelism=4
      declare -a plan_pids=()
      plan_status=0
      for _py in "${!hashes_by_python[@]}"; do
        (
          for _hash in ${hashes_by_python[${_py}]}; do
            _workdir="${plan_workdirs[${_hash}]}"
            (
              cd "${_workdir}"
              "${riot_cmd[@]}" --command \
                'export DD_TRACE_AGENT_URL="$DDTEST_PLAN_AGENT_URL"; export PYTEST_ADDOPTS="$DDTEST_PYTEST_ADDOPTS"; case "$NIGHTLY_BUILD" in true) ;; *) case "$PYTEST_ADDOPTS" in *--no-cov*) ;; *) export PYTEST_ADDOPTS="$PYTEST_ADDOPTS --no-cov" ;; esac ;; esac; ddtest plan --platform python --framework pytest --tests-location "$DDTEST_TESTS_LOCATION" --min-parallelism "$DDTEST_NODES" --max-parallelism "$DDTEST_NODES"' \
                "${_hash}"
            )
            mv "${_workdir}/.testoptimization" "${CI_PROJECT_DIR}/.testoptimization-${_hash}"
          done
        ) &
        plan_pids+=("$!")
        if ((${#plan_pids[@]} >= plan_parallelism)); then
          if ! wait "${plan_pids[0]}"; then
            plan_status=1
          fi
          plan_pids=("${plan_pids[@]:1}")
        fi
      done

      for plan_pid in "${plan_pids[@]}"; do
        if ! wait "${plan_pid}"; then
          plan_status=1
        fi
      done
      exit "${plan_status}"
  artifacts:
    when: always
    paths:
      - .testoptimization-*/
    expire_in: 1 week

# Run: execute this CI node's files in the activated venv.
# 4 workers (not ncpu): the testrunner image runs on many-core k8s pods
# where ncpu spawns too many workers and corrupts pytest-cov's sqlite DB;
# matching PYTEST_XDIST_AUTO_NUM_WORKERS=4 from testrunner.yml.
.ddtest_run:
  extends: .ddtest_base
  script:
    - |
      # Restore this venv's plan artifact (partitioned by RIOT_HASH in the plan job).
      rm -rf .testoptimization
      mv ".testoptimization-${RIOT_HASH}" .testoptimization
      export COVERAGE_FILE=".coverage.${RIOT_HASH}.${CI_NODE_INDEX}"
      riot_cmd=(riot -P -v run --pass-env -s)
      # Keep CI Visibility session names tied to the CI job and test command;
      # ddtest expands these placeholders for each local worker.
      "${riot_cmd[@]}" --command \
        'export PYTEST_ADDOPTS="$DDTEST_PYTEST_ADDOPTS"; export DD_TEST_SESSION_NAME="${{CI_JOB_NAME}}-pytest ${{DDTEST_SUITE_PATH}} ${{DDTEST_PYTEST_ADDOPTS}} node-{{{{nodeIndex}}}}-worker-{{{{workerIndex}}}}"; case "$NIGHTLY_BUILD" in true) ;; *) case "$PYTEST_ADDOPTS" in *--no-cov*) ;; *) export PYTEST_ADDOPTS="$PYTEST_ADDOPTS --no-cov" ;; esac ;; esac; export COVERAGE_FILE="$COVERAGE_FILE"; ddtest run --platform python --framework pytest --ci-node "$CI_NODE_INDEX" --ci-node-workers 4; coverage_files=(.coverage.*); if [[ -e "${{coverage_files[0]}}" ]]; then coverage combine; fi' \
        "${RIOT_HASH}"

.ddtest_run_snapshot:
  extends: .ddtest_base_snapshot
  script:
    - |
      rm -rf .testoptimization
      mv ".testoptimization-${RIOT_HASH}" .testoptimization
      export COVERAGE_FILE=".coverage.${RIOT_HASH}.${CI_NODE_INDEX}"
      riot_cmd=(riot -P -v run --pass-env -s)
      # Snapshot suites use --ci-node-workers 1 (not 4): the shared testagent
      # is session-token-keyed, and parallel xdist workers cause cross-session
      # contamination (wrong stats, '400: list index out of range').
      "${riot_cmd[@]}" --command \
        'export PYTEST_ADDOPTS="$DDTEST_PYTEST_ADDOPTS"; export DD_TEST_SESSION_NAME="${{CI_JOB_NAME}}-pytest ${{DDTEST_SUITE_PATH}} ${{DDTEST_PYTEST_ADDOPTS}} node-{{{{nodeIndex}}}}-worker-{{{{workerIndex}}}}"; case "$NIGHTLY_BUILD" in true) ;; *) case "$PYTEST_ADDOPTS" in *--no-cov*) ;; *) export PYTEST_ADDOPTS="$PYTEST_ADDOPTS --no-cov" ;; esac ;; esac; export COVERAGE_FILE="$COVERAGE_FILE"; export DD_TRACE_AGENT_URL="http://testagent:9126"; ddtest run --platform python --framework pytest --ci-node "$CI_NODE_INDEX" --ci-node-workers 1; coverage_files=(.coverage.*); if [[ -e "${{coverage_files[0]}}" ]]; then coverage combine; fi' \
        "${RIOT_HASH}"

# Required jobs will appear here
