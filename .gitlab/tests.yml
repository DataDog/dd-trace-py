stages:
  - setup
  - test
  - exploration

variables:
  REPO_LANG: python # "python" is used everywhere rather than "py"
  # CI_DEBUG_SERVICES: "true"

include:
  - local: ".gitlab/services.yml"
  - local: ".gitlab/testrunner.yml"


.test_base:
  extends: .testrunner
  stage: test
  needs: [prechecks]
  services:
    - !reference [.services, ddagent]
  before_script:
    - !reference [.testrunner, before_script]
    # Artifact extraction preserves build timestamps, so refresh native outputs after checkout.
    - find ddtrace -type f -name '*.so*' -exec touch {} +
    - unset DD_SERVICE
    - unset DD_ENV
    - unset DD_TAGS
    - unset DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED
  script:
    - |
      shard_variable="TEST_ENVIRONMENTS_${CI_NODE_INDEX:-1}"
      read -ra environment_hashes <<< "${!shard_variable:-}"
      if [[ ${#environment_hashes[@]} -eq 0 ]]; then
        echo "No test environments found for ${TEST_SUITE}"
        exit 1
      fi
      for environment_hash in "${environment_hashes[@]}"
      do
        echo "Running test environment: ${environment_hash}"
        scripts/run-tests -s --venv "${environment_hash}" -- --ddtrace
      done
      ./scripts/check-diff ".riot/requirements/" \
        "Changes detected in test dependency locks. Run scripts/test-requirements lock and commit the result."
      ./scripts/check-diff "scripts/integration_registry/registry.yaml" \
        "Registry YAML file was modified. Run scripts/integration_registry/update_and_format_registry.py and commit the result."

.test_base_snapshot:
  extends: .test_base
  services:
    - !reference [.test_base, services]
    - !reference [.services, testagent]
  before_script:
    - !reference [.test_base, before_script]
    - export DD_TRACE_AGENT_URL="http://testagent:9126"

.test_base_gpu:
  extends: .test_base
  image: !reference [.testrunner_gpu, image]
  tags: !reference [.testrunner_gpu, tags]
  timeout: 40m
  parallel: 2
  variables:
    KUBERNETES_MEMORY_REQUEST: "12Gi"
    KUBERNETES_MEMORY_LIMIT: "12Gi"
    KUBERNETES_CPU_REQUEST: "2"
    KUBERNETES_CPU_LIMIT: "2"
  before_script:
    - !reference [.testrunner_gpu, before_script]
    - !reference [.test_base, before_script]

.test_base_gpu_snapshot:
  extends: .test_base_gpu
  services:
    - !reference [.test_base_gpu, services]
    - !reference [.services, testagent]
  before_script:
    - !reference [.test_base_gpu, before_script]
    - export DD_TRACE_AGENT_URL="http://testagent:9126"

# AIDEV-NOTE: DDTest must receive the complete suitespec command. Falling back
# to bare pytest bypasses per-suite exclusions and can select unavailable tools.
.ddtest_base:
  extends: .test_base

.ddtest_base_snapshot:
  extends: .test_base_snapshot

.ddtest_base_gpu:
  image: !reference [.testrunner_gpu, image]
  tags: !reference [.testrunner_gpu, tags]
  timeout: 40m
  variables:
    KUBERNETES_MEMORY_REQUEST: "12Gi"
    KUBERNETES_MEMORY_LIMIT: "12Gi"
    KUBERNETES_CPU_REQUEST: "2"
    KUBERNETES_CPU_LIMIT: "2"
  before_script:
    - !reference [.test_base_gpu, before_script]

.ddtest_base_gpu_snapshot:
  extends: .ddtest_base_gpu
  services:
    - !reference [.services, ddagent]
    - !reference [.services, testagent]
  before_script:
    - !reference [.test_base_gpu_snapshot, before_script]

.ddtest_plan:
  extends: .ddtest_base
  script:
    - |
      set -euo pipefail
      for metadata in ${TEST_ENVIRONMENT_HASH_PYTHON}; do
        IFS=: read -r environment_hash python_version lockfile tests_location <<< "${metadata}"
        command_var="DDTEST_COMMAND_${environment_hash}"
        env_var="DDTEST_ENV_${environment_hash}"
        requirements="$(mktemp)"
        grep -vi '^ddtrace==' "${lockfile}" > "${requirements}"
        wheel="$(find ".cache/ddtrace-test-wheels/${python_version}" -name 'ddtrace-*.whl' -print -quit)"
        set -f
        eval "export ${!env_var}"
        set +f
        uv run --isolated --no-project --python "python${python_version}" --no-python-downloads \
          --with-requirements "${requirements}" --with "${wheel}" \
          ddtest plan --platform python --framework pytest --command "${!command_var}" \
          --tests-location "${tests_location}" --min-parallelism "${DDTEST_NODES}" --max-parallelism "${DDTEST_NODES}"
        rm -f "${requirements}"
        mv .testoptimization ".testoptimization-${environment_hash}"
      done
  artifacts:
    when: always
    paths:
      - .testoptimization-*/
    expire_in: 1 week

.ddtest_plan_gpu:
  extends:
    - .ddtest_plan
    - .ddtest_base_gpu

.ddtest_run:
  extends: .ddtest_base
  script:
    - |
      set -euo pipefail
      rm -rf .testoptimization
      mv ".testoptimization-${TEST_ENVIRONMENT_HASH}" .testoptimization
      command_var="DDTEST_COMMAND_${TEST_ENVIRONMENT_HASH}"
      env_var="DDTEST_ENV_${TEST_ENVIRONMENT_HASH}"
      requirements="$(mktemp)"
      grep -vi '^ddtrace==' "${TEST_ENVIRONMENT_LOCKFILE}" > "${requirements}"
      wheel="$(find ".cache/ddtrace-test-wheels/${PYTHON_VERSION}" -name 'ddtrace-*.whl' -print -quit)"
      set -f
      eval "export ${!env_var}"
      set +f
      export COVERAGE_FILE=".coverage.${TEST_ENVIRONMENT_HASH}.${CI_NODE_INDEX}"
      # Keep CI Visibility session names tied to the CI job and test command;
      # ddtest expands {{nodeIndex}}/{{workerIndex}} for each local worker.
      export DD_TEST_SESSION_NAME="${CI_JOB_NAME}-pytest ${DDTEST_SUITE_PATH} node-{{nodeIndex}}-worker-{{workerIndex}}"
      uv run --isolated --no-project --python "python${PYTHON_VERSION}" --no-python-downloads \
        --with-requirements "${requirements}" --with "${wheel}" \
        ddtest run --platform python --framework pytest --command "${!command_var}" \
          --ci-node "${CI_NODE_INDEX}" --ci-node-workers 1
      rm -f "${requirements}"
      coverage combine || true

.ddtest_run_snapshot:
  extends: .ddtest_run
  services: !reference [.ddtest_base_snapshot, services]

.ddtest_run_gpu:
  extends:
    - .ddtest_run
    - .ddtest_base_gpu

.ddtest_run_gpu_snapshot:
  extends:
    - .ddtest_run_snapshot
    - .ddtest_base_gpu_snapshot

# Required jobs will appear here
