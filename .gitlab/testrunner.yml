variables:
  TESTRUNNER_IMAGE: registry.ddbuild.io/dd-trace-py:v147323619-47c5179-testrunner@sha256:d58e6573df2030a237764832ae4a2b675f6a3cc437b78b0caa3a682f37506fc5

.testrunner:
  extends: .retry_on_infrastructure_failure
  image:
    name: ${TESTRUNNER_IMAGE}
    docker:
      user: bits
  # DEV: we have a larger pool of amd64 runners, prefer that over arm64
  tags: [ "arch:amd64" ]
  timeout: 20m
  before_script:
    - ulimit -c unlimited
    - git config --global --add safe.directory ${CI_PROJECT_DIR}
    - pyenv global 3.12 3.9 3.10 3.11 3.13 3.14 3.15
    - export _CI_DD_AGENT_URL=http://${HOST_IP}:8126/
  after_script:
    - bash .gitlab/scripts/generate-core-backtraces.sh
  variables:
    # Default to 4 when `-n auto` is used
    # DEV: auto/logical doesn't work well in k8s so we manually set it
    PYTEST_XDIST_AUTO_NUM_WORKERS: "4"
    PIP_RETRIES: "10"
    PIP_DEFAULT_TIMEOUT: "60"
  artifacts:
    when: always
    paths:
      - core.*
    reports:
      junit: test-results/junit*.xml
    expire_in: 1 week

.testrunner_gpu:
  extends: .testrunner
  image:
    name: ${TESTRUNNER_IMAGE}
  tags: [ "gpu:a10-amd64" ]
  timeout: 40m
  before_script:
    - !reference [.testrunner, before_script]
    - export NVIDIA_VISIBLE_DEVICES=all
    - export NVIDIA_DRIVER_CAPABILITIES=compute,utility
