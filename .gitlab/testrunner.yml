variables:
  TESTRUNNER_IMAGE: registry.ddbuild.io/dd-trace-py:v134534459-a190793-testrunner@sha256:d0d692805509330d068d544d6e15182428ff87984ba8de4c0f863edc1aa30170

.testrunner:
  image:
    name: ${TESTRUNNER_IMAGE}
    docker:
      user: bits
  # DEV: we have a larger pool of amd64 runners, prefer that over arm64
  tags: [ "arch:amd64" ]
  timeout: 20m
  before_script:
    # AIDEV-NOTE: These one-pipeline build controls are not OpenTelemetry SDK configuration.
    - >-
      unset
      OTEL_OPERATOR_IMAGES_ENABLED
      OTEL_OPERATOR_IMAGE_NAME
      OTEL_OPERATOR_LANGUAGE
      OTEL_OPERATOR_IMAGE_MAX_SIZE_BYTES
    - ulimit -c unlimited
    - git config --global --add safe.directory ${CI_PROJECT_DIR}
    - pyenv global 3.12 3.9 3.10 3.11 3.13 3.14 3.15-dev
    - export _CI_DD_AGENT_URL=http://${HOST_IP}:8126/
  after_script:
    - bash .gitlab/scripts/generate-core-backtraces.sh
  retry: 0
  variables:
    # Default to 4 when `-n auto` is used
    # DEV: auto/logical doesn't work well in k8s so we manually set it
    PYTEST_XDIST_AUTO_NUM_WORKERS: "4"
    PIP_RETRIES: "10"
    PIP_DEFAULT_TIMEOUT: "60"
  artifacts:
    when: always
    paths:
      - core.*
    reports:
      junit: test-results/junit*.xml
    expire_in: 1 week

.testrunner_gpu:
  extends: .testrunner
  image:
    name: ${TESTRUNNER_IMAGE}
  tags: [ "gpu:a10-amd64" ]
  timeout: 40m
  before_script:
    - !reference [.testrunner, before_script]
    - export NVIDIA_VISIBLE_DEVICES=all
    - export NVIDIA_DRIVER_CAPABILITIES=compute,utility
