experiments:
  - name: run-microbenchmarks
    setup:
      - name: datadog-agent
        run: datadog_agent
        cpus: 24-25
        config_sh: /platform/steps/update-dd-agent-config.sh

    steps:
      - name: benchmarks
        cpus: 26-47
        run: shell
        script: export PATH="/pyenv/shims:/pyenv/bin:$PATH" && export SCENARIO=$BP_SCENARIO && /platform/steps/run-benchmarks.sh
