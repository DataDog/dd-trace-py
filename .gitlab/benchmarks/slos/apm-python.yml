# Microbenchmark SLO thresholds owned by @DataDog/apm-python.
#
# This file is one of several per-team SLO sources that gen_gitlab_config.py
# merges into the single generated
# .gitlab/benchmarks/bp-runner.microbenchmarks.fail-on-breach.yml consumed by
# the check-slo-breaches gate. Ownership is enforced by .github/CODEOWNERS via
# this file's path, so editing a threshold here routes review to @DataDog/apm-python -- no
# inline owner comment is needed.
#
# Scenario names are `<lowercased benchmark class>-<config>` (see
# benchmarks/suitespec.yml and .gitlab/benchmarks/microbenchmarks.md). When
# adding a benchmark, add its SLO to the file owned by your team (or create a
# new per-team file + CODEOWNERS rule) and run `scripts/lint slo-ownership`.

experiments:
  - name: SLO Check
    steps:
      - name: SLO Check
        run: fail_on_breach
        scenarios:

          # telemetryaddmetric
          - name: telemetryaddmetric-1-count-metric-1-times
            thresholds:
              - execution_time < 0.005 ms
          - name: telemetryaddmetric-1-count-metrics-100-times
            thresholds:
              - execution_time < 0.22 ms
          - name: telemetryaddmetric-1-distribution-metric-1-times
            thresholds:
              - execution_time < 0.005 ms
          - name: telemetryaddmetric-1-distribution-metrics-100-times
            thresholds:
              - execution_time < 0.22 ms
          - name: telemetryaddmetric-1-gauge-metric-1-times
            thresholds:
              - execution_time < 0.005 ms
          - name: telemetryaddmetric-1-gauge-metrics-100-times
            thresholds:
              - execution_time < 0.22 ms
          - name: telemetryaddmetric-1-rate-metric-1-times
            thresholds:
              - execution_time < 0.005 ms
          - name: telemetryaddmetric-1-rate-metrics-100-times
            thresholds:
              - execution_time < 0.22 ms
          - name: telemetryaddmetric-100-count-metrics-100-times
            thresholds:
              - execution_time < 22.0 ms
          - name: telemetryaddmetric-100-distribution-metrics-100-times
            thresholds:
              - execution_time < 2.30 ms
          - name: telemetryaddmetric-100-gauge-metrics-100-times
            thresholds:
              - execution_time < 2.25 ms
          - name: telemetryaddmetric-100-rate-metrics-100-times
            thresholds:
              - execution_time < 2.25 ms
          - name: telemetryaddmetric-record-1-metric
            thresholds:
              - execution_time < 0.006 ms
          - name: telemetryaddmetric-record-100-metrics
            thresholds:
              - execution_time < 0.23 ms
          - name: telemetryaddmetric-record-1000-metrics
            thresholds:
              - execution_time < 2.30 ms
          # telemetrydependencies
          - name: telemetrydependencies-first-50-deps-sca-off
            thresholds:
              - execution_time < 3.50 ms
