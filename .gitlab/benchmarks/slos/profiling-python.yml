# Microbenchmark SLO thresholds owned by @DataDog/profiling-python.
#
# This file is one of several per-team SLO sources that gen_gitlab_config.py
# merges into the single generated
# .gitlab/benchmarks/bp-runner.microbenchmarks.fail-on-breach.yml consumed by
# the check-slo-breaches gate. Ownership is enforced by .github/CODEOWNERS via
# this file's path, so editing a threshold here routes review to @DataDog/profiling-python -- no
# inline owner comment is needed.
#
# Scenario names are `<lowercased benchmark class>-<config>` (see
# benchmarks/suitespec.yml and .gitlab/benchmarks/microbenchmarks.md). When
# adding a benchmark, add its SLO to the file owned by your team (or create a
# new per-team file + CODEOWNERS rule) and push — `tests-gen` validates SLO integrity via gen_gitlab_config.py.

experiments:
  - name: SLO Check
    steps:
      - name: SLO Check
        run: fail_on_breach
        scenarios:

          - name: djangosimple-profiler
            thresholds:
              - execution_time < 16.55 ms
          - name: flasksimple-profiler
            thresholds:
              - execution_time < 2.10 ms
          - name: recursivecomputation-deep-profiled
            thresholds:
              - execution_time < 359.15 ms
          # codeprovenancefork
          - name: codeprovenancefork-fork-10
            thresholds:
              - execution_time < 2500 ms
