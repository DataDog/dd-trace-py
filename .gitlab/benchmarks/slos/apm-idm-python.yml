# Microbenchmark SLO thresholds owned by @DataDog/apm-idm-python.
#
# This file is one of several per-team SLO sources that gen_gitlab_config.py
# merges into the single generated
# .gitlab/benchmarks/bp-runner.microbenchmarks.fail-on-breach.yml consumed by
# the check-slo-breaches gate. Ownership is enforced by .github/CODEOWNERS via
# this file's path, so editing a threshold here routes review to @DataDog/apm-idm-python -- no
# inline owner comment is needed.
#
# Scenario names are `<lowercased benchmark class>-<config>` (see
# benchmarks/suitespec.yml and .gitlab/benchmarks/microbenchmarks.md). When
# adding a benchmark, add its SLO to the file owned by your team (or create a
# new per-team file + CODEOWNERS rule) and run `scripts/lint slo-ownership`.

experiments:
  - name: SLO Check
    steps:
      - name: SLO Check
        run: fail_on_breach
        scenarios:

          - name: djangosimple-span-code-origin
            thresholds:
              - execution_time < 28.20 ms
          - name: djangosimple-tracer
            thresholds:
              - execution_time < 21.75 ms
          - name: djangosimple-tracer-minimal
            thresholds:
              - execution_time < 18.50 ms
          - name: djangosimple-tracer-and-profiler
            thresholds:
              - execution_time < 23.50 ms
          - name: djangosimple-tracer-no-caches
            thresholds:
              - execution_time < 19.65 ms
          - name: djangosimple-tracer-no-databases
            thresholds:
              - execution_time < 21.40 ms
          - name: djangosimple-tracer-dont-create-db-spans
            thresholds:
              - execution_time < 22.50 ms
          - name: djangosimple-tracer-no-middleware
            thresholds:
              - execution_time < 21.50 ms
          - name: djangosimple-tracer-no-templates
            thresholds:
              - execution_time < 22.00 ms
          - name: djangosimple-resource-renaming
            thresholds:
              - execution_time < 21.75 ms
          # flask_simple
          - name: flasksimple-tracer
            thresholds:
              - execution_time < 3.65 ms
          - name: flasksimple-resource-renaming
            thresholds:
              - execution_time < 3.65 ms
          - name: flasksqli-tracer-enabled
            thresholds:
              - execution_time < 2.31 ms
