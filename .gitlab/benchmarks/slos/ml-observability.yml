# Microbenchmark SLO thresholds owned by @DataDog/ml-observability.
#
# This file is one of several per-team SLO sources that gen_gitlab_config.py
# merges into the single generated
# .gitlab/benchmarks/bp-runner.microbenchmarks.fail-on-breach.yml consumed by
# the check-slo-breaches gate. Ownership is enforced by .github/CODEOWNERS via
# this file's path, so editing a threshold here routes review to @DataDog/ml-observability.
#
# Scenario names are `<lowercased benchmark class>-<config>` (see
# benchmarks/suitespec.yml and .gitlab/benchmarks/microbenchmarks.md).

experiments:
  - name: SLO Check
    steps:
      - name: SLO Check
        run: fail_on_breach
        scenarios:

          # llmobsspan
          - name: llmobsspan-llmobs-disabled
            thresholds:
              - execution_time < 0.50 ms
          - name: llmobsspan-spans
            thresholds:
              - execution_time < 0.53 ms
          - name: llmobsspan-client-spans
            thresholds:
              - execution_time < 0.59 ms
          - name: llmobsspan-tool-client-spans
            thresholds:
              - execution_time < 1.00 ms
