# Microbenchmark SLO thresholds owned by @DataDog/feature-flagging-and-experimentation-sdk.
#
# This file is one of several per-team SLO sources that gen_gitlab_config.py
# merges into the single generated
# .gitlab/benchmarks/bp-runner.microbenchmarks.fail-on-breach.yml consumed by
# the check-slo-breaches gate. Ownership is enforced by .github/CODEOWNERS via
# this file's path, so editing a threshold here routes review to
# @DataDog/feature-flagging-and-experimentation-sdk -- no inline owner comment
# is needed.
#
# Scenario names are `<lowercased benchmark class>-<config>` (see
# benchmarks/suitespec.yml and .gitlab/benchmarks/microbenchmarks.md). When
# adding a benchmark, add its SLO to the file owned by your team (or create a
# new per-team file + CODEOWNERS rule) and push — `tests-gen` validates SLO
# integrity via gen_gitlab_config.py.

experiments:
  - name: SLO Check
    steps:
      - name: SLO Check
        run: fail_on_breach
        scenarios:

          # openfeatureflagevaluation (class OpenFeatureFlagEvaluation)
          - name: openfeatureflagevaluation-aggregate-scale
            thresholds:
              - execution_time < 0.064 ms
          - name: openfeatureflagevaluation-aggregate-stress
            thresholds:
              - execution_time < 0.550 ms
          - name: openfeatureflagevaluation-aggregate-typical
            thresholds:
              - execution_time < 0.029 ms
          - name: openfeatureflagevaluation-hook-enqueue-bounded-adversarial
            thresholds:
              - execution_time < 0.380 ms
          - name: openfeatureflagevaluation-hook-enqueue-scale
            thresholds:
              - execution_time < 0.043 ms
          - name: openfeatureflagevaluation-hook-enqueue-stress
            thresholds:
              - execution_time < 0.300 ms
          - name: openfeatureflagevaluation-hook-enqueue-typical
            thresholds:
              - execution_time < 0.033 ms
          - name: openfeatureflagevaluation-hook-plus-drain-scale
            thresholds:
              - execution_time < 0.120 ms
