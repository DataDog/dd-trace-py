# Microbenchmark SLO thresholds owned by @DataDog/apm-core-python.
#
# This file is one of several per-team SLO sources that gen_gitlab_config.py
# merges into the single generated
# .gitlab/benchmarks/bp-runner.microbenchmarks.fail-on-breach.yml consumed by
# the check-slo-breaches gate. Ownership is enforced by .github/CODEOWNERS via
# this file's path, so editing a threshold here routes review to @DataDog/apm-core-python -- no
# inline owner comment is needed.
#
# Scenario names are `<lowercased benchmark class>-<config>` (see
# benchmarks/suitespec.yml and .gitlab/benchmarks/microbenchmarks.md). When
# adding a benchmark, add its SLO to the file owned by your team (or create a
# new per-team file + CODEOWNERS rule) and run `scripts/lint slo-ownership`.

experiments:
  - name: SLO Check
    steps:
      - name: SLO Check
        run: fail_on_breach
        scenarios:

          # coreapiscenario
          - name: coreapiscenario-has_listeners_no_listeners
            thresholds:
              - execution_time < 0.01 ms
          - name: coreapiscenario-has_listeners_with_listeners
            thresholds:
              - execution_time < 0.01 ms
          - name: coreapiscenario-core_dispatch_no_listeners
            thresholds:
              - execution_time < 0.01 ms
          - name: coreapiscenario-core_dispatch_1_listener
            thresholds:
              - execution_time < 0.01 ms
          - name: coreapiscenario-core_dispatch_listeners
            thresholds:
              - execution_time < 0.01 ms
          - name: coreapiscenario-core_dispatch_50_listeners
            thresholds:
              - execution_time < 0.05 ms
          - name: coreapiscenario-core_dispatch_no_args_no_listeners
            thresholds:
