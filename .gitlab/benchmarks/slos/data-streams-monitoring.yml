# Microbenchmark SLO thresholds owned by @DataDog/data-streams-monitoring.
#
# This file is one of several per-team SLO sources that gen_gitlab_config.py
# merges into the single generated
# .gitlab/benchmarks/bp-runner.microbenchmarks.fail-on-breach.yml consumed by
# the check-slo-breaches gate. Ownership is enforced by .github/CODEOWNERS via
# this file's path, so editing a threshold here routes review to
# @DataDog/data-streams-monitoring -- no inline owner comment is needed.
#
# Scenario names are `<lowercased benchmark class>-<config>` (see
# benchmarks/suitespec.yml and .gitlab/benchmarks/microbenchmarks.md).

experiments:
  - name: SLO Check
    steps:
      - name: SLO Check
        run: fail_on_breach
        scenarios:

          # datastreams (class DataStreams)
          - name: datastreams-consume
            thresholds:
              - execution_time < 0.078 ms
          - name: datastreams-decode
            thresholds:
              - execution_time < 0.0114 ms
          - name: datastreams-encode
            thresholds:
              - execution_time < 0.0088 ms
          - name: datastreams-produce
            thresholds:
              - execution_time < 0.073 ms
