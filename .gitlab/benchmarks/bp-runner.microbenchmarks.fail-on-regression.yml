# Percentage-regression PR gate. Compares the candidate wheel against the
# baseline commit this branch merges into, rather than against fixed SLO
# thresholds like bp-runner.microbenchmarks.fail-on-breach.template.yml does.
#
# Bypass with the 'performance/ignore-performance-regression' label on the PR.
# See https://datadoghq.atlassian.net/wiki/spaces/APMINT/pages/5158175217/Performance+quality+gates+-+User+Guide
experiments:
  - name: Run regression check
    steps:
      - name: Regression Check
        run: fail_on_regression
        regression_threshold: 10.0 # percents
