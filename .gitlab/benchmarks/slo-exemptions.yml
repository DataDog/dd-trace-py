# Benchmark configs that are intentionally not gated by an SLO entry.
#
# gen_gitlab_config.py errors on any benchmark config that has no SLO entry in
# any per-team file under .gitlab/benchmarks/slos/ unless it is listed here,
# and also errors on any entry here that no longer corresponds to a real
# config (so this list cannot go stale silently).
#
# Entries are SLO scenario names: `<lowercased benchmark class>-<config>`.

ungated:
