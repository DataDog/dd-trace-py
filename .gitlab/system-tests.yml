# System tests - migrated from .github/workflows/system-tests.yml
# See: https://github.com/DataDog/system-tests

.system-tests-base:
  image: registry.ddbuild.io/images/docker:27.3.1
  tags: ["docker-in-docker:amd64"]
  stage: system-tests
  id_tokens:
    DD_STS_OIDC_TOKEN:
      aud: dd-sts
  variables:
    TEST_LIBRARY: python
    KUBERNETES_CPU_REQUEST: "4"
    KUBERNETES_CPU_LIMIT: "4"
    KUBERNETES_MEMORY_REQUEST: "8Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
  needs:
    - job: "build linux"
      artifacts: true
      parallel:
        matrix:
          - ARCH_TAG: "amd64"
            PYTHON_TAG:
              - "cp39-cp39"
              - "cp310-cp310"
              - "cp311-cp311"
              - "cp312-cp312"
              - "cp313-cp313"
              - "cp314-cp314"
            IMAGE_TAG: "v113741238-d2b8243-manylinux2014_x86_64"
  before_script:
    - |
      echo -e "\e[0Ksection_start:`date +%s`:system_deps\r\e[0KInstalling system dependencies"
      # build-essential needed for C extensions like zstandard
      apt-get update && apt-get install -y --no-install-recommends patchelf build-essential
      # Install up to date node.js
      curl --output - "https://nodejs.org/dist/v24.14.1/node-v24.14.1-linux-x64.tar.xz" | tar -xJ --strip-components 1 -C /usr/local/
      npm install -g @datadog/datadog-ci
      echo -e "\e[0Ksection_end:`date +%s`:system_deps\r\e[0K"

    - |
      echo -e "\e[0Ksection_start:`date +%s`:install_uv_python\r\e[0KInstalling uv and Python 3.12"
      curl -LsSf https://astral.sh/uv/install.sh | sh
      export PATH="$HOME/.local/bin:$PATH"
      uv python install 3.12
      echo -e "\e[0Ksection_end:`date +%s`:install_uv_python\r\e[0K"

    - |
      echo -e "\e[0Ksection_start:`date +%s`:checkout_system_tests\r\e[0KChecking out system-tests @ ${SYSTEM_TESTS_REF}"
      git clone https://github.com/DataDog/system-tests.git ${CI_PROJECT_DIR}/system-tests
      cd ${CI_PROJECT_DIR}/system-tests && git checkout ${SYSTEM_TESTS_REF}
      echo -e "\e[0Ksection_end:`date +%s`:checkout_system_tests\r\e[0K"

    - |
      echo -e "\e[0Ksection_start:`date +%s`:setup_binaries\r\e[0KCopying ddtrace wheels to binaries/"
      mkdir -p ${CI_PROJECT_DIR}/system-tests/binaries
      cp ${CI_PROJECT_DIR}/pywheels/*.whl ${CI_PROJECT_DIR}/system-tests/binaries/ || true
      ls -la ${CI_PROJECT_DIR}/system-tests/binaries/
      echo -e "\e[0Ksection_end:`date +%s`:setup_binaries\r\e[0K"

    - |
      echo -e "\e[0Ksection_start:`date +%s`:build_runner\r\e[0KBuilding system-tests runner venv"
      uv venv ${CI_PROJECT_DIR}/system-tests/venv --python 3.12
      source ${CI_PROJECT_DIR}/system-tests/venv/bin/activate
      uv pip install --upgrade pip "setuptools==75.8.0"
      uv pip install -e ${CI_PROJECT_DIR}/system-tests
      echo -e "\e[0Ksection_end:`date +%s`:build_runner\r\e[0K"
  after_script:
    - |
      echo -e "\e[0Ksection_start:`date +%s`:dd_sts\r\e[0KFetch dd-sts token"
      DD_STS_API_KEY=$(curl -sS -H "Authorization: Bearer ${DD_STS_OIDC_TOKEN}" "https://dd-sts.us1.ddbuild.io/sts/datadog/exchange?policy=dd-trace-py-gitlab")
      export DD_API_KEY=$(echo "$DD_STS_API_KEY" | jq -re '.api_key')
      echo -e "\e[0Ksection_end:`date +%s`:dd_sts\r\e[0K"
    - |
      echo -e "\e[0Ksection_start:`date +%s`:upload_junit\r\e[0KUpload junit xml results"
      datadog-ci junit upload ${CI_PROJECT_DIR}/system-tests/logs*/reportJunit.xml --service system-tests --env ci --verbose --xpath-tag "test.codeowners=/testcase/properties/property[@name='test.codeowners']"
      echo -e "\e[0Ksection_end:`date +%s`:upload_junit\r\e[0K"

system-tests parametric:
  extends: .system-tests-base
  script:
    - echo -e "\e[0Ksection_start:`date +%s`:run_parametric\r\e[0KRunning PARAMETRIC scenario"
    - cd ${CI_PROJECT_DIR}/system-tests
    - source venv/bin/activate
    - ./run.sh PARAMETRIC
    - echo -e "\e[0Ksection_end:`date +%s`:run_parametric\r\e[0K"
  variables:
    PYTEST_XDIST_AUTO_NUM_WORKERS: "8"
  artifacts:
    when: always
    paths:
      - system-tests/logs*

include:
  - project: 'DataDog/system-tests'
    ref: '1f3f07e9f21f049b63abb0f3ed667583395fc2b6'
    file: 'utils/ci/gitlab/main.yml'
    inputs:
      stage: "tests"
      ref: '1f3f07e9f21f049b63abb0f3ed667583395fc2b6'
      # condition: '$CI_COMMIT_BRANCH == "main"'

"build lambda layer":
  image: registry.ddbuild.io/images/docker:27.3.1
  tags: ["docker-in-docker:amd64"]
  stage: package
  # rules:
  #   - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - job: "build linux: [amd64, cp313-cp313, v113741238-d2b8243-manylinux2014_x86_64]"
      artifacts: true
  script:
    - |
      echo -e "\e[0Ksection_start:`date +%s`:checkout_lambda\r\e[0KChecking out datadog-lambda-python"
      git clone --depth 1 https://github.com/DataDog/datadog-lambda-python.git ${CI_PROJECT_DIR}/datadog-lambda-python
      echo -e "\e[0Ksection_end:`date +%s`:checkout_lambda\r\e[0K"
    - |
      echo -e "\e[0Ksection_start:`date +%s`:build_layer\r\e[0KBuilding datadog_lambda layer"
      wheel_path=$(find "${CI_PROJECT_DIR}/pywheels" -name "*cp313*manylinux*.whl" -print -quit)
      if [ -z "${wheel_path}" ]; then
        echo "ERROR: No cp313 manylinux wheel found in ${CI_PROJECT_DIR}/pywheels" >&2
        exit 1
      fi
      # AIDEV-NOTE: The wheel must be inside this repository because build_layers.sh
      # uses the repository root as its Docker build context.
      mkdir -p "${CI_PROJECT_DIR}/datadog-lambda-python/artifacts"
      cp "${wheel_path}" "${CI_PROJECT_DIR}/datadog-lambda-python/artifacts/"
      wheel_path="artifacts/$(basename "${wheel_path}")"
      cd ${CI_PROJECT_DIR}/datadog-lambda-python
      ARCH=amd64 PYTHON_VERSION=3.13 DD_TRACE_WHEEL="${wheel_path}" ./scripts/build_layers.sh
      echo -e "\e[0Ksection_end:`date +%s`:build_layer\r\e[0K"
    - |
      echo -e "\e[0Ksection_start:`date +%s`:copy_layer\r\e[0KCopying layer into pywheels/"
      mkdir -p ${CI_PROJECT_DIR}/pywheels
      cp ${CI_PROJECT_DIR}/datadog-lambda-python/.layers/datadog_lambda_py-amd64-3.13.zip ${CI_PROJECT_DIR}/pywheels/
      ls -la ${CI_PROJECT_DIR}/pywheels/
      echo -e "\e[0Ksection_end:`date +%s`:copy_layer\r\e[0K"
  artifacts:
    paths:
      - pywheels/*.zip

system_tests_param:
  extends: .system_tests_param_base
  stage: tests
  # rules:
  #   - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - job: "build linux: [amd64, cp311-cp311, v113741238-d2b8243-manylinux2014_x86_64]"
      artifacts: false
    - job: "build linux: [amd64, cp312-cp312, v113741238-d2b8243-manylinux2014_x86_64]"
      artifacts: false
    - job: "build linux: [amd64, cp313-cp313, v113741238-d2b8243-manylinux2014_x86_64]"
      artifacts: false
    - job: "build linux: [amd64, cp314-cp314, v113741238-d2b8243-manylinux2014_x86_64]"
      artifacts: false
    - job: "build lambda layer"
      artifacts: false
  variables:
    LIBRARIES: "python python_lambda"
    SCENARIO_GROUPS: tracer_release
    SYSTEM_TESTS_SKIP_EMPTY_SCENARIO: "true"
    SYSTEM_TESTS_PUSH_TO_TEST_OPTIMIZATION: "true"
    BINARIES_ARTIFACT_PATH: pywheels
    BINARIES_ARTIFACTS: "build linux: [amd64, cp311-cp311, v113741238-d2b8243-manylinux2014_x86_64];build linux: [amd64, cp312-cp312, v113741238-d2b8243-manylinux2014_x86_64];build linux: [amd64, cp313-cp313, v113741238-d2b8243-manylinux2014_x86_64];build linux: [amd64, cp314-cp314, v113741238-d2b8243-manylinux2014_x86_64];build lambda layer"
