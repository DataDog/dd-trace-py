.release_base:
  stage: release
  rules:
    - if: !reference [.is_release]
      when: on_success
    - when: never
  dependencies: [ "ddtrace package" ]

.release_pypi:
  extends: .release_base
  image: ${CI_UTILS_IMAGE}
  tags: [ "arch:amd64" ]
  variables:
    TWINE_USERNAME: "__token__"
    TWINE_NON_INTERACTIVE: "1"
  script:
    - export TWINE_PASSWORD=$(aws ssm get-parameter --region us-east-1 --name "ci.${CI_PROJECT_NAME}.${PYPI_REPOSITORY}_token" --with-decryption --query "Parameter.Value" --out text)
    - uvx --with="twine>=5.0,<7" twine check --strict pywheels/*
    # DEV(py-315): cp315 wheels are built for internal S3 and the private prerelease index,
    # and are withheld from PyPI while Python 3.15 is unsupported. Drop this filter once
    # 3.15 is a supported target. Everything else, sdist included, is still uploaded.
    - |
      set -eu
      set --
      for dist in pywheels/ddtrace-*; do
        case "${dist}" in *cp315*) continue ;; esac
        if [ -f "${dist}" ]; then set -- "$@" "${dist}"; fi
      done
      if [ "$#" -eq 0 ]; then
        echo "[ERROR] no PyPI-eligible distributions found in pywheels/ -- refusing to upload" >&2
        exit 1
      fi
      printf 'Uploading %s distribution(s) to %s:\n' "$#" "${PYPI_REPOSITORY}"
      printf '  %s\n' "$@"
      uvx --with="twine>=5.0,<7" twine upload --repository "${PYPI_REPOSITORY}" "$@"
  artifacts:
    paths:
      - pywheels/*.whl
      - pywheels/*.tar.gz

# Can be used to validate uploading of artifacts
# release_pypi_test:
#   extends: .release_pypi
#   variables:
#     PYPI_REPOSITORY: testpypi

release_pypi_prod:
  extends: .release_pypi
  variables:
    PYPI_REPOSITORY: pypi

notify_datadog_release:
  extends: .release_base
  allow_failure: true
  needs: [ "ddtrace package", "release_pypi_prod" ]
  image: ${CI_UTILS_IMAGE}
  id_tokens:
    DD_STS_OIDC_TOKEN:
      aud: dd-sts
  tags: [ "arch:amd64" ]
  before_script:
    - >-
      DD_STS_RESPONSE=$(curl -sS
      -H "Authorization: Bearer ${DD_STS_OIDC_TOKEN}"
      "https://dd-sts.us1.ddbuild.io/sts/datadog/exchange?policy=dd-trace-py-gitlab-app-key")
    - export DD_API_KEY=$(echo "$DD_STS_RESPONSE" | jq -re '.api_key')
    - export DD_APP_KEY=$(echo "$DD_STS_RESPONSE" | jq -re '.application_key')
  script:
    - sleep 3
    - |
      echo "Tag: ${CI_COMMIT_TAG} -> Commit SHA: ${CI_COMMIT_SHA}"
      PAYLOAD="{\"version\": \"${CI_COMMIT_TAG}\", \"git_commit_sha\": \"${CI_COMMIT_SHA}\"}"
      BODY=$(jq -n --arg input "$PAYLOAD" '{"meta": {"payload": {"input": $input}}}')
      curl --retry 3 --retry-delay 2 --fail -X POST \
        -H "Content-Type: application/json" \
        -H "DD-API-KEY: ${DD_API_KEY}" \
        -H "DD-APPLICATION-KEY: ${DD_APP_KEY}" \
        -d "$BODY" \
        https://api.datadoghq.com/api/v2/workflows/dd0d5405-b38c-4f4f-8f4c-c0cd4a65d4d6/instances
