build_base_test_artifacts:
  extends: .testrunner
  stage: setup
  needs:
{wheel_needs}
  script: |
    set -euo pipefail
    shopt -s nullglob
    wheels=(pywheels/ddtrace-*-cp3*-cp3*-manylinux*_x86_64.whl)
    if [[ ${{#wheels[@]}} -eq 0 ]]; then
      echo "No amd64 manylinux wheels were downloaded"
      exit 1
    fi

    for wheel in "${{wheels[@]}}"; do
      if [[ "${{wheel##*/}}" =~ -cp3([0-9]+)-cp3[0-9]+- ]]; then
        python_version="3.${{BASH_REMATCH[1]}}"
      else
        echo "Cannot determine the Python version for $wheel"
        exit 1
      fi
      wheel_dir="$CI_PROJECT_DIR/.cache/ddtrace-test-wheels/$python_version"
      mkdir -p "$wheel_dir"
      cp "$wheel" "$wheel_dir/"

      # Fresh subprocesses can import the checkout before site-packages. Use the
      # published wheel's native modules so those source imports remain valid.
      extracted="$(mktemp -d)"
      python -m zipfile -e "$wheel" "$extracted"
      (
        cd "$extracted"
        find ddtrace -type f -name '*.so*' -exec cp --parents --target-directory="$CI_PROJECT_DIR" {{}} +
      )
    done
  artifacts:
    name: test_wheels
    paths:
      - ddtrace/**/*.so*
      - .cache/ddtrace-test-wheels/
