# Multi-OS Test Suite
# Tests the application across Ubuntu and Windows with multiple Python versions.
# macOS coverage runs inline in package.yml "build macos arm64" (see Tart note there).

.multi_os_test_base:
  stage: tests
  variables:
    DD_IAST_ENABLED: "false"
    DD_REMOTE_CONFIGURATION_ENABLED: "false"

os tests ubuntu:
  extends: .multi_os_test_base
  image: registry.ddbuild.io/images/mirror/ubuntu:25.04
  tags: ["arch:amd64"]
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.12", "3.14"]
  needs:
    - job: "build linux"
      parallel:
        matrix:
          - ARCH_TAG: "amd64"
            PYTHON_TAG: "cp310-cp310"
            IMAGE_TAG: "v113741238-d2b8243-manylinux2014_x86_64"
          - ARCH_TAG: "amd64"
            PYTHON_TAG: "cp312-cp312"
            IMAGE_TAG: "v113741238-d2b8243-manylinux2014_x86_64"
          - ARCH_TAG: "amd64"
            PYTHON_TAG: "cp314-cp314"
            IMAGE_TAG: "v113741238-d2b8243-manylinux2014_x86_64"
  variables:
    WHEEL_PATTERN: "manylinux2014*x86_64.whl"
    PLATFORM: "Ubuntu"
  script:
    - apt-get update && apt-get install -y curl
    - bash .gitlab/scripts/multi-os-tests.sh

os tests windows:
  extends: .multi_os_test_base
  tags: ["windows-v2:2022"]
  needs:
    - job: "build windows"
      artifacts: true
      parallel:
        matrix:
          - PYTHON_VERSION: ["3.10", "3.12", "3.14"]
            WINDOWS_ARCH: "amd64"
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.12", "3.14"]
  script:
    - powershell -File .gitlab/scripts/multi-os-tests.ps1
