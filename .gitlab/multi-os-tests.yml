# Multi-OS Test Suite
# Tests the application across Ubuntu, macOS, and Windows with multiple Python versions

.multi_os_test_base:
  stage: tests
  variables:
    DD_IAST_ENABLED: "false"
    DD_REMOTE_CONFIGURATION_ENABLED: "false"

.multi_os_test_retry:
  retry: 2
  rules:
    # Job running on main will have no retry
    - if: !reference [.is_main]
      when: never
    - when: on_success

os tests ubuntu:
  extends: [ .multi_os_test_base, .multi_os_test_retry ]
  image: registry.ddbuild.io/images/mirror/ubuntu:25.04
  tags: ["arch:amd64"]
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.12", "3.14"]
  needs:
    - job: "build linux"
      parallel:
        matrix:
          - ARCH_TAG: "amd64"
            PYTHON_TAG: "cp310-cp310"
            IMAGE_TAG: "v133965508-8f84bce-manylinux2014_x86_64"
          - ARCH_TAG: "amd64"
            PYTHON_TAG: "cp312-cp312"
            IMAGE_TAG: "v133965508-8f84bce-manylinux2014_x86_64"
          - ARCH_TAG: "amd64"
            PYTHON_TAG: "cp314-cp314"
            IMAGE_TAG: "v133965508-8f84bce-manylinux2014_x86_64"
  variables:
    WHEEL_PATTERN: "manylinux2014*x86_64.whl"
    PLATFORM: "Ubuntu"
  script:
    - apt-get update && apt-get install -y curl
    - bash .gitlab/scripts/multi-os-tests.sh

"os tests ubuntu (main)":
  extends: "os tests ubuntu"
  retry: 0
  rules:
    - if: !reference [.is_main]

os tests macos:
  extends: [ .multi_os_test_base, .multi_os_test_retry ]
  image: "486234852809.dkr.ecr.us-east-1.amazonaws.com/ci/ci-platform-machine-images/tart-vm:dd-trace-py-sonoma-latest"
  tags: ["macos:tart"]
  needs: [ "build macos arm64" ]
  variables:
    WHEEL_PATTERN: "macosx*arm64.whl"
    PLATFORM: "macOS"
    # Use bash instead of the Tart VM's default zsh
    TART_EXECUTOR_SHELL: "/bin/bash -l"
  script:
    - |
      for PYTHON_VERSION in 3.10 3.12 3.14; do
        export PYTHON_VERSION
        bash .gitlab/scripts/multi-os-tests.sh
      done

"os tests macos (main)":
  extends: "os tests macos"
  retry: 0
  rules:
    - if: !reference [.is_main]

os tests windows:
  extends: [ .multi_os_test_base, .multi_os_test_retry ]
  tags: ["windows-v2:2022"]
  needs:
    - job: "build windows"
      artifacts: true
      parallel:
        matrix:
          - PYTHON_VERSION: ["3.10", "3.12", "3.14"]
            WINDOWS_ARCH: "amd64"
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.12", "3.14"]
  script:
    - powershell -File .gitlab/scripts/multi-os-tests.ps1

"os tests windows (main)":
  extends: "os tests windows"
  retry: 0
  rules:
    - if: !reference [.is_main]
