.multi_os_changes: &multi_os_changes
  - .gitlab-ci.yml
  - .gitlab/multi-os-tests.yml
  - .gitlab/package.yml
  - .gitlab/requirements/multi-os-tests.txt
  - .gitlab/scripts/build-wheel.sh
  - .gitlab/scripts/build-wheel-windows.sh
  - .gitlab/scripts/multi-os-tests.ps1
  - .gitlab/scripts/multi-os-tests.sh
  - setup.py
  - pyproject.toml
  - ddtrace/**/*.c
  - ddtrace/**/*.cpp
  - ddtrace/**/*.h
  - ddtrace/**/*.pxd
  - ddtrace/**/*.pyx
  - ddtrace/appsec/**/*
  - src/native/**/*
  - src/native_heap_gotter/**/*
  - tests/appsec/architectures/**/*
  - tests/internal/service_name/**/*

.multi_os_test_base:
  stage: tests
  retry: 2
  rules:
    - if: $NIGHTLY_BUILD == "true"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_REF_NAME == "main"
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$/
    - if: $CI_COMMIT_BRANCH =~ /^[0-9]+\.[0-9]+$/
    - changes: *multi_os_changes
    - when: never
  variables:
    DD_IAST_ENABLED: "false"
    DD_REMOTE_CONFIGURATION_ENABLED: "false"

os tests ubuntu:
  extends: .multi_os_test_base
  image: registry.ddbuild.io/images/mirror/ubuntu:25.04
  tags: ["arch:amd64"]
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.12", "3.14"]
  needs:
    - job: "build linux"
      parallel:
        matrix:
          - ARCH_TAG: "amd64"
            PYTHON_TAG: "cp310-cp310"
            IMAGE_TAG: "v133965508-8f84bce-manylinux2014_x86_64"
          - ARCH_TAG: "amd64"
            PYTHON_TAG: "cp312-cp312"
            IMAGE_TAG: "v133965508-8f84bce-manylinux2014_x86_64"
          - ARCH_TAG: "amd64"
            PYTHON_TAG: "cp314-cp314"
            IMAGE_TAG: "v133965508-8f84bce-manylinux2014_x86_64"
  variables:
    WHEEL_PATTERN: "manylinux2014*x86_64.whl"
    PLATFORM: "Ubuntu"
  script:
    - apt-get update && apt-get install -y curl
    - bash .gitlab/scripts/multi-os-tests.sh

os tests macos:
  extends: .multi_os_test_base
  image: "486234852809.dkr.ecr.us-east-1.amazonaws.com/ci/ci-platform-machine-images/tart-vm:dd-trace-py-sonoma-latest"
  tags: ["macos:tart"]
  needs: [ "build macos arm64" ]
  variables:
    WHEEL_PATTERN: "macosx*arm64.whl"
    PLATFORM: "macOS"
    # Use bash instead of the Tart VM's default zsh
    TART_EXECUTOR_SHELL: "/bin/bash -l"
  script:
    - |
      for PYTHON_VERSION in 3.10 3.12 3.14; do
        export PYTHON_VERSION
        bash .gitlab/scripts/multi-os-tests.sh
      done

os tests windows:
  extends: .multi_os_test_base
  tags: ["windows-v2:2022"]
  needs:
    - job: "build windows"
      artifacts: true
      parallel:
        matrix:
          - PYTHON_VERSION: ["3.10", "3.12", "3.14"]
            WINDOWS_ARCH: "amd64"
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.12", "3.14"]
  script:
    - powershell -File .gitlab/scripts/multi-os-tests.ps1
