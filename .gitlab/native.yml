include:
  - local: ".gitlab/testrunner.yml"

.rust_changes: &rust_changes
  - .gitlab-ci.yml
  - .gitlab/native.yml
  - setup.py
  - pyproject.toml
  - src/native/**/*
  - src/native_heap_gotter/**/*

.profiling_native_changes: &profiling_native_changes
  - .gitlab-ci.yml
  - .gitlab/native.yml
  - setup.py
  - pyproject.toml
  - ddtrace/internal/datadog/profiling/**/*.cc
  - ddtrace/internal/datadog/profiling/**/*.cmake
  - ddtrace/internal/datadog/profiling/**/*.cpp
  - ddtrace/internal/datadog/profiling/**/*.h
  - ddtrace/internal/datadog/profiling/**/*.hpp
  - ddtrace/internal/datadog/profiling/**/*.pyx
  - ddtrace/internal/datadog/profiling/**/CMakeLists.txt
  - ddtrace/internal/datadog/profiling/**/*.sh
  - ddtrace/internal/datadog/profiling/**/*.supp
  - ddtrace/profiling/**/*.cpp
  - ddtrace/profiling/**/*.h
  - ddtrace/profiling/**/*.hpp
  - ddtrace/profiling/**/*.pxd
  - ddtrace/profiling/**/*.pyx
  - ddtrace/profiling/**/CMakeLists.txt
  - src/native/**/*
  - src/native_heap_gotter/**/*

"rust ci":
  stage: tests
  image: !reference [.testrunner, image]
  tags: !reference [.testrunner, tags]
  timeout: 10m
  needs: []
  rules:
    - if: $NIGHTLY_BUILD == "true"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_REF_NAME == "main"
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$/
    - if: $CI_COMMIT_BRANCH =~ /^[0-9]+\.[0-9]+$/
    - changes: *rust_changes
    - when: never
  before_script: cd src/native
  script:
    - |
      echo -e "\e[0Ksection_start:`date +%s`:cargo_fmt[collapsed=true]\r\e[0Kcargo fmt"
      cargo fmt --all -- --check
      echo -e "\e[0Ksection_end:`date +%s`:cargo_fmt\r\e[0K"
    - |
      echo -e "\e[0Ksection_start:`date +%s`:cargo_clippy[collapsed=true]\r\e[0Kcargo clippy"
      cargo clippy --all-features -- -D warnings
      echo -e "\e[0Ksection_end:`date +%s`:cargo_clippy\r\e[0K"
    - |
      echo -e "\e[0Ksection_start:`date +%s`:cargo_test[collapsed=true]\r\e[0Kcargo test"
      cargo test --no-fail-fast --locked
      echo -e "\e[0Ksection_end:`date +%s`:cargo_test\r\e[0K"
    # The standalone heap-gotter cdylib crate lives outside src/native, so run
    # the same fmt/clippy/test gate against it here to keep it under native CI.
    - |
      cd ../native_heap_gotter
      echo -e "\e[0Ksection_start:`date +%s`:gotter_cargo_fmt[collapsed=true]\r\e[0Kheap-gotter cargo fmt"
      cargo fmt --all -- --check
      echo -e "\e[0Ksection_end:`date +%s`:gotter_cargo_fmt\r\e[0K"
    - |
      echo -e "\e[0Ksection_start:`date +%s`:gotter_cargo_clippy[collapsed=true]\r\e[0Kheap-gotter cargo clippy"
      cargo clippy --locked --all-features -- -D warnings
      echo -e "\e[0Ksection_end:`date +%s`:gotter_cargo_clippy\r\e[0K"
    - |
      echo -e "\e[0Ksection_start:`date +%s`:gotter_cargo_test[collapsed=true]\r\e[0Kheap-gotter cargo test"
      cargo test --no-fail-fast --locked
      echo -e "\e[0Ksection_end:`date +%s`:gotter_cargo_test\r\e[0K"

"clang-tidy profiling":
  stage: tests
  image: registry.ddbuild.io/dd-trace-py:v103334885-be1888c-profiling_native
  tags: ["arch:amd64"]
  timeout: 20m
  needs: []
  rules:
    - if: $NIGHTLY_BUILD == "true"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_REF_NAME == "main"
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$/
    - if: $CI_COMMIT_BRANCH =~ /^[0-9]+\.[0-9]+$/
    - changes: *profiling_native_changes
    - when: never
  before_script:
    - pyenv global 3.12
  script:
    - |
      echo -e "\e[0Ksection_start:`date +%s`:clang_tidy_build[collapsed=true]\r\e[0Kclang-tidy on profiling C++ code"
      export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
      # Run clang-tidy on profiling C++ code (builds only profiling, skips pip install of full package)
      ddtrace/internal/datadog/profiling/run_clang_tidy.sh
      echo -e "\e[0Ksection_end:`date +%s`:clang_tidy_build\r\e[0K"
