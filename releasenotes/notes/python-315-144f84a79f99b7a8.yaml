---
upgrade:
  - |
    This change adds support and tests for Python 3.15 to much of the library's functionality. The following products
    and integrations still **do not** work with Python 3.15:

    * CI Visibility
    * django_hosts / djangorestframework / django:celery
    * kafka - confluent-kafka does not yet support Python 3.15
    * pysqlite3-binary - does not yet support Python 3.15 (stdlib ``sqlite3`` tracing is unaffected)
    * grpc_aio
    * azure_functions / azure_durable_functions / azure_eventhubs
    * openai
    * langchain
    * langgraph
    * litellm
    * crewai
    * ai_guard_litellm_guardrail
    * vertexai
    * llmobs - ragas path does not yet support Python 3.15
    * anthropic (LLM Observability)
    * mcp
    * pydantic_ai
    * vllm
    * ray / ray_serve - ray does not yet support Python 3.15
    * gevent
    * graphene
    * mlflow
    * pytorch
    * redis
    * selenium
    * mysqlpython
    * flask_cache
    * profile-uwsgi / tracer-uwsgi
    * lib_injection - OCI/SSI packaging for 3.15 is not in this change
    * Windows wheels - Windows packaging matrix still ends at 3.14
    * vertica - hasn't been supported by ddtracepy since Python 3.9
    * aredis - untested since Python 3.9
    * rediscluster - untested since Python 3.11
    * asynctest - untested since Python 3.9
