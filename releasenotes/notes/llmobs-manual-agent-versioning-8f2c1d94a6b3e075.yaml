---
features:
  - |
    LLM Observability: Adds support for manually versioning agents. Pass ``version`` when starting an
    agent span, either with ``LLMObs.agent(name="my-agent", version="v3")`` or with the
    ``@agent(version="v3")`` decorator, and the agent span is tagged with ``agent_version``. For
    agents created by an auto-instrumented framework, use
    ``LLMObs.annotation_context(agent={"version": "v3"})``. The tag is set on agent spans only.
