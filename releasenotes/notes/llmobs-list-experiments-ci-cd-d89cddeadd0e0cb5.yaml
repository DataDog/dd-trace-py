---
features:
  - |
    LLM Observability: Adds ``LLMObs.list_experiments()`` to query experiments by logical
    name, metadata containment (e.g. ``{"tags": ["git.commit.sha:abc123"]}``), or parent
    experiment ID. Returns a list of ``ExperimentSummary`` objects that include the run status
    and pre-computed aggregate data (eval score distributions, token costs, error rates), so
    CI/CD workflows can compare a run against a baseline commit and gate on the result.
    Results are ordered newest first and paginated automatically; pass ``max_results`` to stop
    after a given number of experiments instead of fetching the project's whole history.
