---
features:
  - |
    LLM Observability: Adds ``DD_MCP_CAPTURE_SESSION`` to group MCP server tool calls into sessions when MCP has no
    session of its own, such as over stdio or with the stateless protocol. When enabled, the first tool call of a
    conversation gets a generated ID, and its result asks the agent to send that ID back in the
    ``telemetry.conversation_id`` argument on later calls. The ID is set as the ``session_id`` of each MCP server tool
    span. Requests with an ``mcp-session-id`` header, and tool calls that already have a session ID, are not changed.
