---
features:
  - |
    tracing: Adds OpenTelemetry thread-context synchronization for applications using uvloop on Linux with Python 3.13
    and earlier. It rides on the asyncio integration, is enabled by default, and can be disabled with
    ``DD_TRACE_OTEL_CTX_ENABLED=false`` or ``DD_TRACE_ASYNCIO_ENABLED=false``. Callbacks reaching uvloop through its
    Python scheduling API are covered; callbacks uvloop dispatches internally, such as transport and protocol methods,
    and callbacks of an event loop that was already running when the tracer was installed, are not.
