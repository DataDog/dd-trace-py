---
features:
  - |
    AI Guard: With ``DD_AI_GUARD_MCP_ENABLED=true`` (default ``false``), evaluations of remote MCP tools
    run by the OpenAI Responses API identify the MCP server of each call, and MCP approval requests are
    evaluated before the application can approve them. Responses streams whose MCP tools can request
    approval are then buffered until that evaluation completes, even when
    ``DD_AI_GUARD_ANALYZE_STREAM_RESPONSES_ENABLED`` is off. Only the scheme, host and port of the MCP
    server URL are reported: credentials, headers, and the URL user information, path, query string and
    fragment never are.
