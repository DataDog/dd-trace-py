---
features:
  - |
    openfeature: With ``DD_TRACE_DEBUG=true``, the feature flagging provider now logs how it was set up,
    each attempt to fetch flag configuration and its result, when configuration is applied or removed, whether
    provider initialization succeeded, and each evaluation's flag key, variant, reason, and error code.
    Evaluation logs omit flag values, raw error messages, evaluation context, and arbitrary metadata,
    regardless of full-data telemetry consent.
