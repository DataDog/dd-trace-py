---
features:
  - |
    tracing: Adds the ``DD_TRACE_PROPAGATION_AS_SPAN_LINKS`` environment variable, a
    comma-separated list of integration names (e.g. ``google_cloud_pubsub,kafka``) for which
    propagated context is attached as span links instead of a parent-child relationship.
deprecations:
  - |
    google_cloud_pubsub: The ``DD_GOOGLE_CLOUD_PUBSUB_PROPAGATION_AS_SPAN_LINKS`` environment
    variable is deprecated and will be removed in a future release. Add ``google_cloud_pubsub``
    to the ``DD_TRACE_PROPAGATION_AS_SPAN_LINKS`` list instead.
