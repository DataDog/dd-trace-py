---
features:
  - |
    LLM Observability: Adds the reason the model stopped generating to LLM span metadata for the
    ``openai``, ``litellm``, and ``anthropic`` integrations: ``finish_reason`` for ``openai`` and
    ``litellm`` (e.g. ``stop``, ``length``, ``content_filter``) and ``stop_reason`` for
    ``anthropic`` (e.g. ``end_turn``, ``max_tokens``, ``refusal``). Requests that ask for multiple
    choices record a ``finish_reasons`` list instead.
