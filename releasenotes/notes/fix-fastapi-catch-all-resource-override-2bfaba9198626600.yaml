fixes:
  - |
    fastapi: Fixes an issue where request span resource names and ``http.route``
    tags are overwritten by a top-level catch-all route when using included routers
    with FastAPI 0.137 or later.
  - |
    fastapi: Fixes raw-path resource names and missing ``http.route`` tags on inner
    request spans when a mounted sub-application uses included routers with
    FastAPI 0.137 or later.
