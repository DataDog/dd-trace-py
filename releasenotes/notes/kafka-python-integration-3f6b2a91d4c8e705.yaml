---
features:
  - |
    kafka-python: Adds tracing and Data Streams Monitoring support for the ``kafka-python`` library (2.0.2 and later).
    Produce and consume operations create spans, and with ``DD_DATA_STREAMS_ENABLED=true`` they report
    Data Streams Monitoring checkpoints and consumer lag. The integration is enabled by default and can be
    disabled with ``DD_TRACE_KAFKA_PYTHON_ENABLED=false``; set its service name with ``DD_KAFKA_PYTHON_SERVICE``.
