---
features:
  - |
    profiling: Memory allocation samples now carry an ``allocator domain`` label whose value is
    ``obj`` or ``mem``, identifying which CPython allocator the allocation came from. This makes
    it possible to separate the extra allocations that become visible with
    ``DD_PROFILING_MEMORY_MEM_DOMAIN_ENABLED=true`` (Python 3.12+) from those already reported
    when it is disabled.
