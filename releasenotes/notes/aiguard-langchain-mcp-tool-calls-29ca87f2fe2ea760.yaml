---
features:
  - |
    AI Guard: LangChain tool calls to MCP tools loaded with ``langchain-mcp-adapters`` (0.2.0 or later) are now
    evaluated with the MCP server that runs them, including calls made outside an agent, and are blocked before
    the MCP request is sent. Only the server name, transport, URL scheme, host and port, or stdio command and
    the package or module it runs are reported. Set ``DD_AI_GUARD_MCP_ENABLED=false`` to disable.
