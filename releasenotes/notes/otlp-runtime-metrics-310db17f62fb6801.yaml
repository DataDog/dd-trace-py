---
features:
  - |
    runtime metrics: When ``DD_RUNTIME_METRICS_ENABLED`` and ``DD_METRICS_OTEL_ENABLED`` are both true and
    ``opentelemetry-exporter-otlp`` is installed, runtime metrics are exported over OTLP under their OpenTelemetry
    semantic convention names (``cpython.gc.*`` and ``process.*``) instead of being sent to DogStatsD, once the
    application imports ``opentelemetry``. The ``runtime.python.gc.count.*``, ``runtime.python.gc.pause.*`` and
    ``runtime.python.cpu.percent`` metrics, which have no OpenTelemetry equivalent, are not exported over OTLP.
