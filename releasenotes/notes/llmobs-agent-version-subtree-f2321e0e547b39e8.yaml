---
features:
  - |
    LLM Observability: The agent version set through ``LLMObs.agent(version=...)``, ``@agent(version=...)``,
    ``LLMObs.annotate(agent={"version": ...})`` or ``LLMObs.annotation_context(agent={"version": ...})`` is now
    also reported as an ``agent_version`` tag on the spans the agent runs, up to a nested agent. It is not
    propagated across services.
