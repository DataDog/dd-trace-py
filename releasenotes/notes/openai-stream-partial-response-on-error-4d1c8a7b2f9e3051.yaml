---
fixes:
  - |
    LLM Observability: This fix resolves an issue where an OpenAI streamed request that ended in an
    error or was cancelled part-way produced an LLM span with no input or output annotations at all.
    The chunks received before the failure are now processed, so the span carries the request's input
    messages, whatever output arrived before the stream ended, and estimated token metrics.
  - |
    LLM Observability: This fix resolves an issue where the streamed token-count estimation for the
    OpenAI Responses API raised an error and dropped every annotation from the LLM span. The
    estimation only applies to the chat and completion response shapes, so it is no longer attempted
    for Responses API payloads.
