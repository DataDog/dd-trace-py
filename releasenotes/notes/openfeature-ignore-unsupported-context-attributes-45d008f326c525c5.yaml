---
fixes:
  - |
    openfeature: Fixes an issue where flag evaluations return the default value with an
    ``INVALID_CONTEXT`` error when an evaluation context attribute is not a ``str``, ``int``,
    ``float``, ``bool`` or ``None`` value, for example a ``dict``, a ``list`` or a ``datetime``.
    Such attributes are now ignored: the flag returns its evaluated value instead of the default,
    and targeting rules that reference such an attribute treat it as absent.
