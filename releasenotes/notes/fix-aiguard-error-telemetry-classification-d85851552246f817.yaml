---
fixes:
  - |
    AI Guard: Fixes an issue where transport and unexpected internal evaluation failures were
    reported as ``client_error``, making them difficult to diagnose. The ``ai_guard.error`` metric
    now distinguishes ``connection_failed``, ``timeout``, ``invalid_config``, ``network_error`` and
    ``internal_error`` failures, and reports a bounded ``http_status`` tag for ``bad_status``
    errors. Debug logs now include the failure classification and the endpoint origin.
