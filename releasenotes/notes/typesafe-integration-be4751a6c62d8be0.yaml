---
features:
  - |
    typesafe: Adds tracing support for ``TypeSafeClient.system_one`` and ``AsyncTypeSafeClient.system_one`` calls in
    the TypeSafe Python SDK (``typesafe-sdk``).
  - |
    LLM Observability: Adds support for submitting LLM Observability spans for TypeSafe ``system_one`` calls,
    capturing the state, questions, answers, and token usage.
