---
features:
  - |
    LLM Observability: Add ``LLMObs.evaluation()``, a span factory that opens a linked judge
    trace under ``ml_app:datadog-evaluations`` for an external (SDK-run) LLM-as-a-judge evaluator,
    and an optional ``judge_span`` argument to ``LLMObs.submit_evaluation()`` that links a
    submitted evaluation metric to its judge trace.
