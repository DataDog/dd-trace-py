---
upgrade:
  - |
    Support for ddtrace with Python 3.9 is removed after being deprecated in the 4.0 release line.
    ddtrace now requires Python 3.10 or later, wheels are no longer published for Python 3.9, and
    Single Step Instrumentation no longer instruments Python 3.9 applications.
  - |
    tracing: ``@tracer.wrap()`` without an explicit name now includes the class name in the default
    span name for methods (for example ``mymodule.MyClass.method`` instead of ``mymodule.method``).
    Set ``DD_TRACE_WRAP_SPAN_NAME_INCLUDE_CLASS=false`` to keep the previous span names.
  - |
    tracing: Removes the ``DD_TRACE_128_BIT_TRACEID_GENERATION_ENABLED`` environment variable. The
    tracer always generates 128-bit trace IDs, and always keeps the full 128-bit trace ID when
    extracting Datadog headers that carry one.
  - |
    tracing: Removes the ``DD_TRACE_INFERRED_SPANS_ENABLED`` environment variable. Use
    ``DD_TRACE_INFERRED_PROXY_SERVICES_ENABLED`` instead.
  - |
    tracing: Removes the deprecated ``Tracer.data_streams_processor`` property. Use
    ``ddtrace.data_streams.data_streams_processor()`` instead.
  - |
    tracing: Removes the deprecated no-op ``hooks`` attribute from integration configs
    (for example ``config.flask.hooks``). Use ``tracer.current_span()`` or
    ``tracer.current_root_span()`` to interact with spans.
  - |
    tracing: Removes the deprecated ``tracer`` parameter from the asgi, cherrypy, and falcon
    ``TraceMiddleware``, ``DDWSGIMiddleware``, the aiohttp ``trace_app``, the flask_cache
    ``get_traced_cache``, the sqlalchemy ``trace_engine``, and the bottle ``TracePlugin``. Calls that
    pass arguments after ``tracer`` positionally must be updated; the global tracer is always used.
  - |
    runtime metrics: Removes the unused ``tracer`` parameter from ``RuntimeMetrics.enable()``. Pass
    ``dogstatsd_url`` as a keyword argument or as the first positional argument.
  - |
    dbapi: Removes the deprecated ``pin`` parameter from ``TracedCursor`` and ``TracedConnection``.
  - |
    pylibmc: Wrapping an existing client with ``TracedClient(client)`` is no longer supported. Use
    ``ddtrace.patch(pylibmc=True)`` or ``import ddtrace.auto`` and create clients with ``pylibmc.Client``.
  - |
    google_cloud_pubsub: Removes the ``DD_GOOGLE_CLOUD_PUBSUB_PROPAGATION_AS_SPAN_LINKS``
    environment variable. Add ``google_cloud_pubsub`` to ``DD_TRACE_PROPAGATION_AS_SPAN_LINKS``
    instead.
  - |
    vertica: Removes the deprecated Vertica integration, along with the ``DD_TRACE_VERTICA_ENABLED``
    and ``DD_VERTICA_SERVICE`` environment variables.
  - |
    aredis: Removes the aredis integration, along with the ``DD_TRACE_AREDIS_ENABLED``,
    ``DD_AREDIS_SERVICE``, and ``DD_AREDIS_CMD_MAX_LENGTH`` environment variables. aredis does not
    support Python 3.10 or later.
  - |
    LLM Observability: Removes the deprecated ``ml_app`` argument from ``LLMObs.enable()``, the span
    constructors and decorators, ``LLMObs.submit_evaluation()``, ``LLMObs.submit_feedback()``,
    ``LLMObs.get_spans()``, and ``LLMObs.publish_evaluator()``. Use ``agent_service`` instead.
  - |
    LLM Observability: Removes the ``DD_LLMOBS_ML_APP`` environment variable. When no
    ``agent_service`` is set on a span, passed to ``LLMObs.enable()``, or propagated from a parent,
    the agent service now falls back to ``DD_SERVICE``.
  - |
    AI Guard: Removes the deprecated ``ddtrace.appsec.ai_guard`` import path. Import from
    ``ddtrace.aiguard`` instead, and import the Strands Agents classes from
    ``ddtrace.aiguard.integrations.strands``.
