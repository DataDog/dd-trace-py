---
features:
  - |
    profiling: The stack profiler now warns, and reports to telemetry, when another
    component takes over its ``SIGSEGV`` or ``SIGBUS`` handler, naming the component and
    which signal was lost. When a safe syscall fallback is available, sample quality is
    reduced for the rest of the process; otherwise stack sampling stops and CPU/wall-time
    profiles are empty.
