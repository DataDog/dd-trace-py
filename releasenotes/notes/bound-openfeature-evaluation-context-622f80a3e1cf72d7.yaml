---
features:
  - |
    openfeature: Limits the amount and nesting depth of evaluation context data reported with flag
    evaluations; data outside these limits is omitted without affecting flag resolution.
upgrade:
  - |
    openfeature: Reports only strings, numbers, booleans, and datetimes from evaluation context;
    unsupported values are no longer converted to strings, and null values are omitted, without
    affecting flag resolution.
