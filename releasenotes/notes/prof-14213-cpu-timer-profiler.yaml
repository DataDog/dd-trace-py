---
features:
  - |
    profiling: adds an opt-in Linux CPU timer stack profiler for standalone CPython 3.12+ that collects CPU-time samples with best-effort per-thread CPU timers. Embedded interpreters retain wall-sampled CPU time because the host owns process signal handlers. The configured CPU accounting mode remains fixed for the process lifetime. Set ``_DD_PROFILING_STACK_CPU_TIMER_ENABLED=true`` to enable it.
