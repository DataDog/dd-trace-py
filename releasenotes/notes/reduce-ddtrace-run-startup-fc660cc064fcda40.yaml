other:
  - |
    perf: Reduces the overhead of importing ``ddtrace`` and starting applications with ``ddtrace-run``.
    Logging and tracer initialization occur when tracing APIs or automatic instrumentation are imported.
fixes:
  - |
    tracing: Fixes an issue where ddtrace import errors prevent applications launched with
    ``ddtrace-run`` from starting. Errors are reported and application startup continues.
