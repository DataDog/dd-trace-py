features:
  - |
    OpenAI Agents: Adds LLM Observability for Realtime WebSocket conversations and SIP or WebRTC
    call attachments, including generated transcripts preserved across interruptions, safely bounded
    played audio, speech overlap, tools, and token usage. Realtime instrumentation is enabled by default;
    set ``DD_OPENAI_REALTIME_ENABLED=false`` to disable it, or
    ``DD_OPENAI_REALTIME_SIDEBAND_AUDIO_RETRIEVAL_ENABLED=false`` to disable additional stored-audio requests.
