---
features:
  - |
    AAP: The build can now skip bundling libddwaf, with the ``build_py`` option
    ``--no-bundle-libddwaf``.  The library is then loaded from the system at import time
    (``libddwaf.so.2``, resolved by the dynamic linker), which is what Linux distribution
    packages need.  Default builds keep bundling libddwaf and are unchanged.
