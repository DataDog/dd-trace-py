features:
  - |
    litellm: Add ``ddtrace.contrib.litellm.gateway_attribution`` to your gateway's
    callbacks to record users, models, and usage in APM without prompt or response
    text, with LiteLLM end-user IDs retained as an unverified fallback.
    Optionally set ``DD_LITELLM_GATEWAY_ATTRIBUTION_CONFIG`` to a JSON file path
    to add billing details, enable email and selected user metadata, or disable
    end-user collection with ``"capture_end_user": false``.
