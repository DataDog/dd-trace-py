features:
  - |
    litellm: Add ``ddtrace.contrib.litellm.gateway_attribution`` to your gateway's
    callbacks to record users, models, usage, reported pricing settings, and available
    provider organization/workspace IDs in APM
    without prompt or response text, with LiteLLM end-user IDs retained as an
    unverified fallback.
    Optionally set ``DD_LITELLM_GATEWAY_ATTRIBUTION_CONFIG`` to a JSON file path
    to enable email and selected user metadata, or disable
    end-user collection with ``"capture_end_user": false``.
    To match provider usage by key, optionally set the non-secret billing key ID
    in each LiteLLM deployment's ``model_info.datadog_provider_api_key_id``.
