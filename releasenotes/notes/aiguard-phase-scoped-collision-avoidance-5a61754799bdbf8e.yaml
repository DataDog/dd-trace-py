---
fixes:
  - |
    AI Guard: Fixes an issue where a streamed LangChain response was never evaluated when
    ``DD_AI_GUARD_ANALYZE_STREAM_RESPONSES_ENABLED`` was set to ``true``. LangChain suppressed the
    underlying provider's buffered-stream evaluation without performing one of its own, so no
    component scanned the response. Frameworks now suppress only the part of a call they evaluate
    themselves, so the provider still buffers and evaluates streamed responses under LangChain.
  - |
    AI Guard: Fixes a ``ValueError`` that could escape the Strands Agents integration when an
    agent's before- and after-invocation hooks ran in different asyncio contexts. In the same
    situation, AI Guard no longer stays disabled for later OpenAI and Anthropic calls made from
    the task that started the agent invocation.
