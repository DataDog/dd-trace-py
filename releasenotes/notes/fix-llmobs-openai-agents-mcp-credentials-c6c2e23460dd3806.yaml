---
fixes:
  - |
    LLM Observability: Fixes an issue where OpenAI Agents spans recorded credentials from agent tool
    and model configuration: hosted MCP server URL tokens, headers and ``authorization`` values,
    container domain secret values, and extra headers, query parameters and request body or arguments
    of the model settings. Only non-secret settings and the scheme, host and port of MCP server URLs
    are now recorded.
