---
features:
  - |
    tracing: Adds OpenTelemetry thread-context synchronization across asyncio task switches and
    ``asyncio.to_thread()`` worker threads on Python 3.13 and earlier. Python 3.14 already provides this through
    its native context watcher; the asyncio fallback is used if that watcher cannot be registered and only
    supports the event loops built into asyncio, so replacements such as ``uvloop`` are left unsynchronized.
