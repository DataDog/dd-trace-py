upgrade:
  - |
    tracing: Initialize tracing with ``ddtrace-run`` or ``import ddtrace.auto``
    before enabling aiohttp, Bottle, CherryPy, Falcon, Molten, Pyramid, or Sanic
    server instrumentation. Importing an integration alone no longer enables its
    request tracing.
features:
  - |
    aiohttp: With ``DD_TRACE_ENABLED=false``, server instrumentation continues
    to run request lifecycle hooks without creating request spans.
