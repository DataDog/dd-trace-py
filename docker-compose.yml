# Docker-specific networking. Each service extends its shared definition so
# normal commands such as `docker compose up -d testagent` keep working.
services:
    elasticsearch:
        extends:
            file: docker-compose.base.yml
            service: elasticsearch
        ports:
            - "127.0.0.1:9200:9200"
    opensearch:
        extends:
            file: docker-compose.base.yml
            service: opensearch
        ports:
            - "127.0.0.1:9201:9200"
    cassandra:
        extends:
            file: docker-compose.base.yml
            service: cassandra
        ports:
            - "127.0.0.1:9042:9042"
    consul:
        extends:
            file: docker-compose.base.yml
            service: consul
        ports:
            - "127.0.0.1:8500:8500"
    postgres:
        extends:
            file: docker-compose.base.yml
            service: postgres
        ports:
            - "127.0.0.1:5432:5432"
    mariadb:
        extends:
            file: docker-compose.base.yml
            service: mariadb
        ports:
            - "127.0.0.1:3306:3306"
    mysql:
        extends:
            file: docker-compose.base.yml
            service: mysql
        ports:
            - "127.0.0.1:3306:3306"
    redis:
        extends:
            file: docker-compose.base.yml
            service: redis
        ports:
            - "127.0.0.1:6379:6379"
    kafka:
        extends:
            file: docker-compose.base.yml
            service: kafka
        platform: linux/arm64
        ports:
            - "127.0.0.1:29092:29092"
    rediscluster:
        extends:
            file: docker-compose.base.yml
            service: rediscluster
        ports:
            - "127.0.0.1:7000:7000"
            - "127.0.0.1:7001:7001"
            - "127.0.0.1:7002:7002"
            - "127.0.0.1:7003:7003"
            - "127.0.0.1:7004:7004"
            - "127.0.0.1:7005:7005"
    mongo:
        extends:
            file: docker-compose.base.yml
            service: mongo
        ports:
            - "127.0.0.1:27017:27017"
    memcached:
        extends:
            file: docker-compose.base.yml
            service: memcached
        ports:
            - "127.0.0.1:11211:11211"
    moto:
        extends:
            file: docker-compose.base.yml
            service: moto
        ports:
            - "127.0.0.1:3000:3000"
    rabbitmq:
        extends:
            file: docker-compose.base.yml
            service: rabbitmq
        ports:
            - "127.0.0.1:5672:5672"
    ddagent:
        extends:
            file: docker-compose.base.yml
            service: ddagent
        ports:
            - 8126:8126
            - 8125:8125/udp
    testagent:
        extends:
            file: docker-compose.base.yml
            service: testagent
        ports:
            - "127.0.0.1:${TESTAGENT_HOST_PORT:-9126}:8126"
    vertica:
        extends:
            file: docker-compose.base.yml
            service: vertica
        ports:
          - "127.0.0.1:5433:5433"
    azurecosmosemulator:
        extends:
            file: docker-compose.base.yml
            service: azurecosmosemulator
        ports:
            - "127.0.0.1:8081:8081"
            - "127.0.0.1:8080:8080"
            - "127.0.0.1:1234:1234"
    azureeventhubsemulator:
        extends:
            file: docker-compose.base.yml
            service: azureeventhubsemulator
        ports:
            - "127.0.0.1:5672:5672"
            - "127.0.0.1:9092:9092"
            - "127.0.0.1:5300:5300"
    azureservicebusemulator:
        extends:
            file: docker-compose.base.yml
            service: azureservicebusemulator
        ports:
            - "127.0.0.1:5672:5672"
            - "127.0.0.1:5300:5300"
    azuresqledge:
        extends:
            file: docker-compose.base.yml
            service: azuresqledge
        ports:
            - "127.0.0.1:1433:1433"
    azurite:
        extends:
            file: docker-compose.base.yml
            service: azurite
        ports:
            - "127.0.0.1:10000:10000"
            - "127.0.0.1:10001:10001"
            - "127.0.0.1:10002:10002"
    selenium-chrome:
        extends:
            file: docker-compose.base.yml
            service: selenium-chrome
        network_mode: host
    testrunner:
        extends:
            file: docker-compose.base.yml
            service: testrunner
        network_mode: host
    localstack:
        extends:
            file: docker-compose.base.yml
            service: localstack
        ports:
          - "127.0.0.1:4566:4566"
          - "127.0.0.1:4571:4571"
    httpbin:
      extends:
        file: docker-compose.base.yml
        service: httpbin
      ports:
        - "127.0.0.1:8001:80"
    valkey:
        extends:
            file: docker-compose.base.yml
            service: valkey
        ports:
            - "127.0.0.1:6379:6379"
    pubsub:
        extends:
            file: docker-compose.base.yml
            service: pubsub
        ports:
            - "127.0.0.1:8085:8085"
    valkeycluster:
        extends:
            file: docker-compose.base.yml
            service: valkeycluster
        ports:
            - "127.0.0.1:7000:7000"
            - "127.0.0.1:7001:7001"
            - "127.0.0.1:7002:7002"
            - "127.0.0.1:7003:7003"
            - "127.0.0.1:7004:7004"
            - "127.0.0.1:7005:7005"

volumes:
    ddagent:
