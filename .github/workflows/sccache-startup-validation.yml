name: Sccache startup validation
on:
  push:
    branches: [juanjo/sccache-startup-validation]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Hermetic build and watchdog tests
        run: |
          /bin/bash --version
          python3 .gitlab/scripts/test_setup_sccache.py -v
          python3 .gitlab/scripts/test_sccache_watchdog.py -v
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
      - name: Repository formatting
        run: |
          git update-ref refs/remotes/origin/main HEAD^
          scripts/lint fmt -- setup.py .gitlab/scripts/sccache-watchdog.py .gitlab/scripts/test_sccache_watchdog.py .gitlab/scripts/test_setup_sccache.py
          git diff --exit-code
      - name: Repository checks
        run: scripts/lint checks
      - name: Formatting diff
        if: failure()
        run: git diff
