name: Update test locks for a package

on:
  workflow_dispatch:
    inputs:
      integration_name:
        description: "Test environment name to update"
        required: true
        type: string
      package_name:
        description: "Canonical package name for PR metadata"
        required: true
        type: string

jobs:
  update-test-locks:
    name: Update test locks
    runs-on: ubuntu-22.04
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      new_latest: ${{ steps.new-latest.outputs.new_latest }}
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"

      - name: Setup Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker compose --version

      - name: Start docker service
        run: docker compose up -d testagent

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev

      - uses: ./.github/actions/setup-ci-deps

      - name: Install ddtrace from pre-built wheel
        run: |
          curl https://dd-trace-py-builds.s3.amazonaws.com/main/install.sh | bash

      - name: Regenerate test locks
        env:
          TARGET_PACKAGE: ${{ inputs.integration_name }}
        run: scripts/test-requirements lock --upgrade "$TARGET_PACKAGE" >/dev/null

      - name: Run integration registry update
        run: python scripts/integration_registry/update_and_format_registry.py

      - name: Get latest version
        id: new-latest
        env:
          TARGET_PACKAGE: ${{ inputs.package_name }}
        run: |
          NEW_LATEST=$(python scripts/get_latest_version.py "$TARGET_PACKAGE")
          echo "new_latest=$NEW_LATEST" >> "$GITHUB_OUTPUT"

      - name: Prepare generated changes
        id: patch
        uses: ./.github/actions/generated-change-patch
        with:
          mode: create
          patch-file: generated.patch
          profile: package-versions

      - name: Upload generated changes
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-package-version
          path: generated.patch
          retention-days: 1

  create-pull-request:
    name: Create pull request
    needs: update-test-locks
    if: needs.update-test-locks.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download generated changes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-package-version
          path: ${{ runner.temp }}/generated-package-version

      - name: Apply and validate generated changes
        uses: ./.github/actions/generated-change-patch
        with:
          mode: apply
          patch-file: ${{ runner.temp }}/generated-package-version/generated.patch
          profile: package-versions

      - uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        id: octo-sts
        with:
          scope: DataDog/dd-trace-py
          policy: self.update-package-version.create-pr

      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          sign-commits: true
          branch: "upgrade-latest-${{ inputs.package_name }}-version"
          commit-message: "Update package version"
          delete-branch: true
          base: main
          title: "chore: update ${{ inputs.package_name }} latest version to ${{ needs.update-test-locks.outputs.new_latest }}"
          labels: changelog/no-changelog
          body: |
            Update ${{ inputs.package_name }} lockfiles.
            This updates only the uv-generated locks for the selected test suite.
