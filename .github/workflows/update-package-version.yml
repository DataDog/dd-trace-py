name: Update test locks for a package

on:
  workflow_dispatch:
    inputs:
      integration_name:
        description: "Test suite name to update"
        required: true
        type: string
      package_name:
        description: "Canonical package name for PR metadata"
        required: true
        type: string

jobs:
  update-test-locks:
    name: Update test locks
    runs-on: ubuntu-22.04
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      new_latest: ${{ steps.new-latest.outputs.new_latest }}
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python 3.9
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.9"

      - name: Setup Python 3.10
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"

      - name: Setup Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Setup Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Setup Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker compose --version

      - name: Start docker service
        run: docker compose up -d testagent

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev

      - uses: ./.github/actions/setup-ci-deps

      - name: Install ddtrace from pre-built wheel
        run: |
          curl https://dd-trace-py-builds.s3.amazonaws.com/main/install.sh | bash

      - name: Regenerate test locks
        env:
          TARGET_PACKAGE: ${{ inputs.integration_name }}
        run: scripts/regenerate-test-locks-latest.sh "$TARGET_PACKAGE"

      - name: Run integration registry update
        run: python scripts/integration_registry/update_and_format_registry.py

      - name: Get latest version
        id: new-latest
        env:
          TARGET_PACKAGE: ${{ inputs.package_name }}
        run: |
          NEW_LATEST=$(python scripts/get_latest_version.py "$TARGET_PACKAGE")
          echo "new_latest=$NEW_LATEST" >> "$GITHUB_OUTPUT"

      - name: Prepare generated changes
        id: patch
        uses: ./.github/actions/generated-change-patch
        with:
          mode: create
          patch-file: generated.patch
          profile: package-versions

      - name: Upload generated changes
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: generated-package-version
          path: generated.patch
          retention-days: 1

  create-pull-request:
    name: Create pull request
    needs: update-test-locks
    if: needs.update-test-locks.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download generated changes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-package-version
          path: ${{ runner.temp }}/generated-package-version

      - name: Apply and validate generated changes
        uses: ./.github/actions/generated-change-patch
        with:
          mode: apply
          patch-file: ${{ runner.temp }}/generated-package-version/generated.patch
          profile: package-versions

      - uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        id: octo-sts
        with:
          scope: DataDog/dd-trace-py
          policy: self.update-package-version.create-pr

      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          sign-commits: true
          branch: "upgrade-latest-${{ inputs.package_name }}-version"
          commit-message: "Update package version"
          delete-branch: true
          base: main
          title: "chore: update ${{ inputs.package_name }} latest version to ${{ needs.update-test-locks.outputs.new_latest }}"
          labels: changelog/no-changelog
          body: |
            Update ${{ inputs.package_name }} lockfiles.
            This updates only the uv locks for the selected test suite.
