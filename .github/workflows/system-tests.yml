name: System Tests

on:
  push:
    branches:
      - main
      - mq-working-branch-*
  pull_request: {}
  workflow_dispatch: {}
  schedule:
    - cron: '00 04 * * *'

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  should-run:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check if relevant paths changed
        id: check
        run: |
          .github/scripts/should-run.sh "${{ github.event_name }}" \
            "${{ github.event.pull_request.base.sha }}"

  download-s3-wheels:
    needs: [should-run]
    if: needs.should-run.outputs.run == 'true' && (github.event_name != 'schedule' || github.event.repository.fork == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # GitLab publishes all wheels together. Fork PRs build one wheel per interpreter.
        source: >-
          ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
              && '["cp39","cp310","cp311","cp312","cp313","cp314","cp315"]' || '["s3"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build and smoke-test wheel
        if: matrix.source != 's3'
        env:
          PYTHON_TAG: ${{ matrix.source }}-${{ matrix.source }}
        run: |
          docker run --rm -v "$PWD:/project" -w /project --entrypoint .gitlab/scripts/build-wheel.sh \
            -e UV_PYTHON="/opt/python/${PYTHON_TAG}/bin/python" -e CIBW_BUILD=1 \
            ghcr.io/pyo3/maturin:v1.16.0@sha256:2a184457d1d567a77826e36991beda88ade5034c0c38ce6dcf64864f16ca3591

      - name: Download wheels from S3
        if: matrix.source == 's3'
        env:
          WHEEL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # On pushes, the GitLab pipeline that uploads the wheels can start 35-90 min after
          # the push. Keep the 30 min default on PRs, where a failed GitLab build never uploads.
          POLL_TIMEOUT: ${{ github.event_name == 'pull_request' && '1800' || '7200' }}
        run: |
          bash scripts/download-s3-wheels.sh \
            "$WHEEL_SHA" \
            ./pywheels \
            manylinux2014_x86_64

      - name: Upload wheels
        uses: ./.github/actions/upload-artifact
        with:
          name: wheels-${{ matrix.source }}
          path: ./pywheels/*.whl
          if-no-files-found: error

  serverless-system-tests-build-layer:
    runs-on: ubuntu-latest
    needs: [combine-wheels]
    steps:
      - name: Checkout datadog-lambda-python
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          repository: "DataDog/datadog-lambda-python"

      - name: Download wheel to binaries directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels-manylinux_x86_64
          path: artifacts/

      - name: Build datadog_lambda layer
        run: |
          wheel_path=$(find ./artifacts -name "*cp313*manylinux*.whl" | head -n 1)
          ARCH=amd64 PYTHON_VERSION=3.13 DD_TRACE_WHEEL=$wheel_path ./scripts/build_layers.sh

      # The workspace root holds datadog-lambda-python, so local actions live in a subdirectory.
      - name: Checkout local actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
          path: dd-trace-py

      - name: Upload layer artifact
        uses: ./dd-trace-py/.github/actions/upload-artifact
        with:
          path: .layers/datadog_lambda_py-amd64-3.13.zip
          name: serverless_system_tests_binaries

  serverless-system-tests:
    needs: [serverless-system-tests-build-layer]
    # Automatically managed, use scripts/update-system-tests-version to update
    uses: DataDog/system-tests/.github/workflows/system-tests.yml@7beb580eafaab6d2f388a109d4c7ebb7b3f95ca3
    secrets: inherit
    with:
      library: python_lambda
      ref: '7beb580eafaab6d2f388a109d4c7ebb7b3f95ca3'
      binaries_artifact: serverless_system_tests_binaries
      scenarios_groups: lambda_end_to_end
      skip_empty_scenarios: true
      push_to_test_optimization: true

  combine-wheels:
    runs-on: ubuntu-latest
    needs: [download-s3-wheels]
    steps:
      - name: Checkout local actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - name: Download wheels to binaries directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: binaries/
          merge-multiple: true

      - name: Upload combined wheels
        uses: ./.github/actions/upload-artifact
        with:
          name: wheels-manylinux_x86_64
          path: binaries/
          if-no-files-found: error

  integration-frameworks-system-tests:
    if: github.event_name != 'schedule' || github.event.repository.fork == false
    needs: [combine-wheels]
    # Automatically managed, use scripts/update-system-tests-version to update
    uses: DataDog/system-tests/.github/workflows/system-tests.yml@7beb580eafaab6d2f388a109d4c7ebb7b3f95ca3
    secrets: inherit
    with:
      library: python
      ref: '7beb580eafaab6d2f388a109d4c7ebb7b3f95ca3'
      scenarios: INTEGRATION_FRAMEWORKS
      binaries_artifact: wheels-manylinux_x86_64
      push_to_test_optimization: true

  tracer-release:
    needs: [combine-wheels]
    uses: DataDog/system-tests/.github/workflows/system-tests.yml@7beb580eafaab6d2f388a109d4c7ebb7b3f95ca3
    secrets: inherit
    with:
      library: python
      ref: '7beb580eafaab6d2f388a109d4c7ebb7b3f95ca3'
      binaries_artifact: wheels-manylinux_x86_64
      desired_execution_time: 900
      scenarios_groups: tracer-release
      skip_empty_scenarios: ${{github.event_name == 'pull_request'}}
      push_to_test_optimization: true


  finished:
    name: system-tests finished
    runs-on: ubuntu-latest
    needs:
      - should-run
      - download-s3-wheels
      - serverless-system-tests-build-layer
      - serverless-system-tests
      - combine-wheels
      - integration-frameworks-system-tests
      - tracer-release
    if: always()
    steps:
      - name: Print results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$RESULTS"
      - name: Fail if any dependency failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
