name: Build Python 3

on:
  workflow_call:
    inputs:
      cibw_build:
        required: true
        type: string
      cibw_skip:
        required: false
        type: string
      cibw_prerelease_pythons:
        required: false
        type: string

jobs:
  build-wheels-matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{steps.set-matrix.outputs.include}}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-ci-deps
        with:
          python-version: "3.13"
      - id: set-matrix
        env:
          CIBW_BUILD: ${{ inputs.cibw_build }}
          CIBW_SKIP: ${{ inputs.cibw_skip }}
        run: |
          MATRIX_INCLUDE=$(
            cibuildwheel --print-build-identifiers --platform windows --archs ARM64 | jq -cR '{only: ., os: "windows-11-arm"}' \
            | jq -sc
          )
          echo $MATRIX_INCLUDE
          echo "include=${MATRIX_INCLUDE}" >> $GITHUB_OUTPUT

  build:
    needs: ["build-wheels-matrix" ]
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.only }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build-wheels-matrix.outputs.include) }}
    env:
      CIBW_SKIP: ${{ inputs.cibw_skip }}
      CIBW_PRERELEASE_PYTHONS: ${{ inputs.cibw_prerelease_pythons }}
      # rust-tuf has too long paths
      CIBW_BEFORE_ALL_WINDOWS: "git config --global core.longpaths true && rustup target add aarch64-pc-windows-msvc"
      # cibuildwheel repair will copy anything's under /output directory from the
      # build container to the host machine. This is a bit hacky way, but seems
      # to be the only way getting debug symbols out from the container while
      # we don't mess up with RECORD file.
      CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: python scripts/zip_filter.py "{wheel}" "*.c" "*.cpp" "*.cc" "*.h" "*.hpp" "*.pyx" "*.md" && mv "{wheel}" "{dest_dir}"
      CIBW_TEST_COMMAND: "python {project}/tests/smoke_test.py"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        name: Install Python
        with:
          python-version: "3.13"

      - name: Set up QEMU
        if: runner.os == 'Linux' && matrix.os != 'ubuntu-24.04-arm'
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
        with:
          platforms: all

      - name: Install libclang for the ARM64 Rust build host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'llvm-installer.exe'
          curl.exe --fail --location --retry 5 --retry-delay 2 --retry-connrefused `
            --output $installer `
            'https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-woa64.exe'
          if ($LASTEXITCODE -ne 0) { throw 'LLVM download failed' }
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne `
              '7c4ac97eb2ae6b960ca5f9caf3ff6124c8d2a18cc07a7840a4d2ea15537bad8e') {
            throw 'LLVM installer SHA256 mismatch'
          }
          $process = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "LLVM installation failed: $($process.ExitCode)" }
          $env:LIBCLANG_PATH = 'C:\Program Files\LLVM\bin'
          "LIBCLANG_PATH=$env:LIBCLANG_PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
          python .gitlab/scripts/check-libclang.py
          if ($LASTEXITCODE -ne 0) { throw 'libclang C API check failed' }

      - name: Build wheels
        uses: pypa/cibuildwheel@ee02a1537ce3071a004a6b08c41e72f0fdc42d9a # v3.4.0
        with:
          only: ${{ matrix.only }}

      - name: Validate wheel RECORD files
        shell: bash
        run: |
          for wheel in ./wheelhouse/*.whl; do
            if [ -f "$wheel" ]; then
              echo "Validating $(basename $wheel)..."
              python scripts/validate_wheel.py "$wheel"
            fi
          done

      - if: runner.os != 'Windows'
        run: |
          echo "ARTIFACT_NAME=${{ matrix.only }}" >> $GITHUB_ENV
      - if: runner.os == 'Windows'
        run: |
          chcp 65001 #set code page to utf-8
          echo "ARTIFACT_NAME=${{ matrix.only }}"  >> $env:GITHUB_ENV
      - uses: ./.github/actions/upload-artifact
        with:
          name: wheels-${{ env.ARTIFACT_NAME }}
          path: ./wheelhouse/*.whl

      - uses: ./.github/actions/upload-artifact
        if: runner.os != 'Windows'
        with:
          name: debug-symbols-${{ env.ARTIFACT_NAME }}
          path: |
            ./debugwheelhouse/*.zip
            ./wheelhouse/debugwheelhouse/*.zip
