name: Describe sccache PR split
on:
  push:
    branches: [juanjo/sccache-split-validation]
    paths: [.github/workflows/sccache-split-descriptions.yml]
permissions:
  contents: read
  pull-requests: write
jobs:
  describe-split:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Document permanent scope and dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url = 'https://api.github.com/repos/DataDog/dd-trace-py/pulls/21758'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
              pr = json.load(response)
          assert pr['head']['sha'] == "5df4b5c2fb7c29d0c1b6cd12a626509dbd7b9f64", 'Permanent PR head changed'
          assert pr['base']['ref'] == 'main', 'Permanent PR base changed'
          body = "## Description\n\nCache restore/save invoke `setup.py ext_hashes`. With `DD_USE_SCCACHE=1`, this metadata command also checks the cache server and can spend 186 seconds on three 60-second attempts plus backoff when the server is unresponsive. Skip sccache initialization for extension hashing. Extension hashing does not compile anything, so it does not need the compiler cache and should not wait for its server to become available.\n\nKeep cache health-check timing, errors, and uncached-fallback messages on stderr, including byte-safe error rendering. Forward these messages into the wheel job log while preserving the full build log. The hashing fix, basic logging, regression tests, CI wiring, and corresponding documentation are permanent.\n\n## Dependencies and merge order\n\n**Merge this PR first.** It does not depend on #21768. The temporary watchdog log-tail capture is isolated in #21768, which is stacked on this branch and depends on this PR. After this PR merges, rebase/retarget that follow-up onto `main`.\n\nRemoving the temporary capture later does not require reverting this fix or its basic logging.\n\n## Testing\n\n- The permanent-only source passes all 19 focused tests on Linux and macOS: nine cache-startup/logging tests and ten existing watchdog tests.\n- `scripts/lint fmt -- <edited Python files>` and `scripts/lint checks` pass on a clean checkout of the permanent-only commit. [Split validation](https://github.com/DataDog/dd-trace-py/actions/runs/43420937617).\n- The hashing and live-logging regression tests fail against the unchanged source and pass with this change.\n- Previous local comparison, with this same setup/helper implementation and production retry limits: an unresponsive cache caused **186.191 seconds** of initialization during hashing before the fix, versus **zero cache probes** after it. Healthy compilation still enables the compiler wrappers.\n- A small package built with real `uv` verifies that cache warnings are visible while the build is running, the full log is retained, and build failures propagate.\n\n## Risks\n\nLow: hashing performs no compilation, and compiler health-check retry limits and uncached fallback remain unchanged. The timing comparison isolates cache initialization; full native wheel build performance has not been benchmarked.\n\n## Additional Notes\n\nNo release note is needed for internal build-cache handling and CI diagnostics (`changelog/no-changelog`).\n\nRelated: [APMLP-1998](https://datadoghq.atlassian.net/browse/APMLP-1998)."
          previous = pr.get('body') or ''
          if '\n[APMLP-1998]:' in previous:
              body += '\n\n[APMLP-1998]:' + previous.split('\n[APMLP-1998]:', 1)[1]
          request = urllib.request.Request(url, data=json.dumps({'body': body}).encode(), headers=headers, method='PATCH')
          with urllib.request.urlopen(request) as response:
              saved = json.load(response)
          assert saved['body'] == body
          print('Permanent PR description updated; temporary follow-up is #21768.')
          PY
