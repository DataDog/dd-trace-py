# Package-split freeze guard
#
# Enforces docs/package-split/plan.md Deliverable 4 ("Freeze and transfer")
# at the pull-request level: once a package-freeze.toml exists on the target
# branch, frozen source paths may only change through approved rewrites.
#
# Why pull_request_target: the workflow definition, the harness
# (scripts/package_split/) and the freeze rules (package-freeze.toml) are
# always taken from the PR's BASE branch, so a pull request cannot weaken,
# bypass or unfreeze itself. Adding frozen paths (freezing more) from a PR
# has no effect until it lands on the base branch, which is maintainer
# controlled; unfreezing likewise requires a landed change. Freeze
# tightening is therefore open to anyone while unfreezing is restricted --
# the same asymmetry as .github/workflows/team-freeze-guard.yml.
#
# The PR head is only ever inspected (git diff, hashing, AST parsing), never
# executed: no code from the pull request runs in this privileged context.

name: Package split freeze guard

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      # Retargeting a PR (base change) emits `edited`, not `synchronize`:
      # without this trigger a PR could be validated against a branch with
      # no active freeze and then retargeted to a frozen branch without the
      # guard inspecting it under the new rules. Title/body edits also fire
      # `edited`; the run is read-only and idempotent, so the extra runs are
      # harmless.
      - edited
  # When the protected base itself advances (e.g. the freeze-first commit
  # lands while PRs are already open), none of the pull_request activities
  # fire for those PRs and their earlier check results remain attached to the
  # old, weaker rules. Revalidate every open PR head against the new base
  # so a frozen path changed before the freeze cannot ride its old green.
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  freeze-guard:
    name: Package split freeze guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'

    steps:
      - name: Check out the base branch (protected harness and freeze rules)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          # Full history: the freeze gate diffs the extraction revision
          # against the PR head.
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the pull request head (inspected, never executed)
        run: |
          git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pr/head"

      - name: Is a package freeze active on the base branch?
        id: active
        run: |
          if git show "${{ github.event.pull_request.base.sha }}:package-freeze.toml" > /dev/null 2>&1; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            # No freeze has been established yet (plan phase 4 not reached):
            # there are no protected paths to enforce. The freeze gate itself
            # stays fail-closed; this guard only runs when a freeze exists.
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the freeze gate
        if: steps.active.outputs.active == 'true'
        run: |
          scripts/package-split freeze \
            --manifest package-contract.toml \
            --output .package-split \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head refs/remotes/pr/head

      - name: Upload freeze evidence
        if: always() && steps.active.outputs.active == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: freeze-evidence-pr-${{ github.event.pull_request.number }}
          path: .package-split/
          retention-days: 14

      - name: No active freeze
        if: steps.active.outputs.active != 'true'
        run: |
          echo "No package-freeze.toml on ${{ github.event.pull_request.base.ref }}: package-split freeze not yet established."

  revalidate-open-prs:
    # Base-advance path: when the freeze rules themselves land on main (or
    # main moves), revalidate every open PR head against the new rules.
    # Without this, a PR that touched a newly frozen path before the freeze
    # existed keeps its old green check result and can merge unreviewed.
    name: Revalidate open PRs
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Check out the advanced base (protected harness and freeze rules)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: List open PRs touching frozen paths
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "prs<<EOF" >> "$GITHUB_OUTPUT"
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName \
            --jq '.[] | "\(.number) \(.headRefName)"' >> "$GITHUB_OUTPUT" || true
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Revalidate each open PR head
        if: steps.prs.outputs.prs != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '${{ steps.prs.outputs.prs }}' | while read -r number head_ref; do
            [ -z "$number" ] && continue
            echo "Revalidating PR #$number ($head_ref)"
            git fetch --no-tags origin "refs/pull/$number/head:refs/remotes/pr/$number/head"
            if scripts/package-split freeze \
              --manifest package-contract.toml \
              --output ".package-split/pr-$number" \
              --base "$GITHUB_SHA" \
              --head "refs/remotes/pr/$number/head"; then
              echo "PR #$number: PASS"
            else
              echo "::warning::PR #$number fails the freeze guard against the new rules"
            fi
          done

      - name: Upload freeze evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: freeze-evidence-revalidation
          path: .package-split/
          retention-days: 14
