name: WAF ARM64 host probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - shell: pwsh
        run: |
          Get-WindowsOptionalFeature -Online -FeatureName Containers | Format-List FeatureName, State
          Get-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V-All | Format-List FeatureName, State
          Get-Service vmcompute, hns, docker -ErrorAction SilentlyContinue | Format-Table Name, Status
          Get-Command docker, dockerd -ErrorAction SilentlyContinue | Format-Table Name, Source
          $path = 'C:\Program Files\LLVM\bin\libclang.dll'
          if (Test-Path $path) {
            $data = [System.IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($data, 0x3c)
            'libclang.dll PE machine: 0x{0:X4}' -f [BitConverter]::ToUInt16($data, $pe + 4)
          }
          $global:LASTEXITCODE = 0
