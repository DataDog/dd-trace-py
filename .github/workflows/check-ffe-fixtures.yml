name: Check FFE fixtures

on:
  pull_request:
    paths:
      - ".github/workflows/check-ffe-fixtures.yml"
      - "scripts/update-ffe-fixtures.py"
      - "tests/internal/test_update_ffe_fixtures.py"
      - "tests/openfeature/ffe-system-test-data/**"
  merge_group:
  push:
    branches:
      - mq-working-branch-*

permissions:
  contents: read

jobs:
  check-ffe-fixtures:
    name: Check canonical FFE fixture snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify the recorded fixture snapshot
        run: python scripts/update-ffe-fixtures.py --check
