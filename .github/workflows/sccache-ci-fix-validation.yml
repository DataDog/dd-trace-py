name: Validate sccache CI fixes
on:
  push:
    branches: [juanjo/sccache-ci-fix-validation]
    paths: [.github/workflows/sccache-ci-fix-validation.yml]
defaults:
  run:
    shell: bash
permissions:
  contents: read
  checks: write
jobs:
  internal-tests:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VALIDATION_PYTHON: ${{ matrix.python }}
      GITLAB_CI: 'true'
      DD_TRACE_AGENT_URL: http://127.0.0.1:8126
      DD_TRACE_ENABLED: 'false'
      DD_CIVISIBILITY_ENABLED: 'false'
      DD_CIVISIBILITY_AGENTLESS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 14ff975e89f4ac7306274a3225702575e4c1c54c
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
      - name: Reuse runtime-identical wheels from the parent commit
        env:
          POLL_TIMEOUT: '120'
        run: |
          bash scripts/download-s3-wheels.sh 5df4b5c2fb7c29d0c1b6cd12a626509dbd7b9f64 /tmp/sccache-parent-wheels manylinux2014_x86_64 2>&1 | tee /tmp/sccache-ci-fixes.log
          python3 - <<'PY'
          import os, pathlib, shutil, sys, zipfile
          python = os.environ['VALIDATION_PYTHON']
          tag = 'cp' + python.replace('.', '')
          matches = list(pathlib.Path('/tmp/sccache-parent-wheels').glob('ddtrace-*-' + tag + '-*.whl'))
          assert len(matches) == 1, matches
          destination = pathlib.Path('.cache/ddtrace-test-wheels') / python
          destination.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(matches[0], destination / matches[0].name)
          with zipfile.ZipFile(matches[0]) as wheel:
              wheel.extractall('.')
          print('Prepared parent wheel:', matches[0].name)
          PY
      - name: Discover and run existing setup tests through the repository runner
        run: |
          python3 - <<'PY' 2>&1 | tee -a /tmp/sccache-ci-fixes.log
          import json, os, subprocess
          result = subprocess.run(['scripts/run-tests', '--list', 'tests/internal/test_setup_sccache.py'], check=True, capture_output=True, text=True)
          discovery = json.loads(result.stdout)
          suite = next(s for s in discovery['suites'] if s['name'] == 'internal')
          choices = [v for v in suite['venvs'] if v['python_version'] == os.environ['VALIDATION_PYTHON'] and 'pyarmor' not in v['packages'] and 'wrapt<2' not in v['packages']]
          assert choices, suite
          selected = choices[0]
          print('Selected discovered environment:', selected, flush=True)
          subprocess.run(['scripts/run-tests', '--venv', selected['hash'], '--', '-n', '2', '-q', '-k', 'setup_sccache'], check=True)
          PY
      - name: Publish validation details
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ github.sha }}
          REPORT_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          path = pathlib.Path('/tmp/sccache-ci-fixes.log')
          report = path.read_text(errors='replace') if path.exists() else 'No command output captured.'
          payload = {'name': 'Sccache CI fix details (' + os.environ.get('GITHUB_JOB', '') + ' ' + os.environ.get('VALIDATION_PYTHON', '') + ')', 'head_sha': os.environ['REPORT_SHA'], 'status': 'completed', 'conclusion': 'neutral', 'output': {'title': 'Existing tests and Sphinx validation', 'summary': '```text\n' + report[-55000:] + '\n```'}}
          request = urllib.request.Request('https://api.github.com/repos/' + os.environ['REPORT_REPOSITORY'] + '/check-runs', data=json.dumps(payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}, method='POST')
          with urllib.request.urlopen(request) as response:
              print('Published validation details:', response.status)
          PY
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VALIDATION_PYTHON: '3.10'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 5c2df3e96dcd8e24413866370b5e0a3b94a56915
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
      - name: Install spelling dictionary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libenchant-2-2 aspell aspell-en
      - name: Reuse runtime-identical wheels from the parent commit
        env:
          POLL_TIMEOUT: '120'
        run: |
          bash scripts/download-s3-wheels.sh 5df4b5c2fb7c29d0c1b6cd12a626509dbd7b9f64 /tmp/sccache-parent-wheels manylinux2014_x86_64 2>&1 | tee /tmp/sccache-ci-fixes.log
          python3 - <<'PY'
          import os, pathlib, shutil, sys, zipfile
          python = os.environ['VALIDATION_PYTHON']
          tag = 'cp' + python.replace('.', '')
          matches = list(pathlib.Path('/tmp/sccache-parent-wheels').glob('ddtrace-*-' + tag + '-*.whl'))
          assert len(matches) == 1, matches
          destination = pathlib.Path('.cache/ddtrace-test-wheels') / python
          destination.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(matches[0], destination / matches[0].name)
          with zipfile.ZipFile(matches[0]) as wheel:
              wheel.extractall('.')
          print('Prepared parent wheel:', matches[0].name)
          PY
      - name: Run the same Sphinx spelling and HTML build as GitLab
        run: uv run --no-project --python 3.10 --no-python-downloads --with-requirements .uv/build-docs--py310--*.txt scripts/docs/build.sh 2>&1 | tee -a /tmp/sccache-ci-fixes.log
      - name: Publish validation details
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ github.sha }}
          REPORT_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          path = pathlib.Path('/tmp/sccache-ci-fixes.log')
          report = path.read_text(errors='replace') if path.exists() else 'No command output captured.'
          payload = {'name': 'Sccache CI fix details (' + os.environ.get('GITHUB_JOB', '') + ' ' + os.environ.get('VALIDATION_PYTHON', '') + ')', 'head_sha': os.environ['REPORT_SHA'], 'status': 'completed', 'conclusion': 'neutral', 'output': {'title': 'Existing tests and Sphinx validation', 'summary': '```text\n' + report[-55000:] + '\n```'}}
          request = urllib.request.Request('https://api.github.com/repos/' + os.environ['REPORT_REPOSITORY'] + '/check-runs', data=json.dumps(payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}, method='POST')
          with urllib.request.urlopen(request) as response:
              print('Published validation details:', response.status)
          PY
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 14ff975e89f4ac7306274a3225702575e4c1c54c
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
      - name: Repository formatting and checks
        run: |
          git update-ref refs/remotes/origin/main aa95eef7a6294c0d1b288f298cc8589e3d879501
          scripts/lint fmt -- tests/internal/test_setup_sccache.py 2>&1 | tee /tmp/sccache-ci-fixes.log
          git diff --exit-code
          scripts/lint checks 2>&1 | tee -a /tmp/sccache-ci-fixes.log
      - name: Formatting diff
        if: always()
        run: git diff | tee -a /tmp/sccache-ci-fixes.log
      - name: Publish validation details
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ github.sha }}
          REPORT_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          path = pathlib.Path('/tmp/sccache-ci-fixes.log')
          report = path.read_text(errors='replace') if path.exists() else 'No command output captured.'
          payload = {'name': 'Sccache CI fix details (' + os.environ.get('GITHUB_JOB', '') + ' ' + os.environ.get('VALIDATION_PYTHON', '') + ')', 'head_sha': os.environ['REPORT_SHA'], 'status': 'completed', 'conclusion': 'neutral', 'output': {'title': 'Existing tests and Sphinx validation', 'summary': '```text\n' + report[-55000:] + '\n```'}}
          request = urllib.request.Request('https://api.github.com/repos/' + os.environ['REPORT_REPOSITORY'] + '/check-runs', data=json.dumps(payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}, method='POST')
          with urllib.request.urlopen(request) as response:
              print('Published validation details:', response.status)
          PY
