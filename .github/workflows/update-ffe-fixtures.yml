name: Update FFE fixtures

on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at midnight UTC
  workflow_dispatch:
    inputs:
      fixture_ref:
        description: Branch, tag, or commit from DataDog/ffe-system-test-data
        required: true
        default: main
        type: string

concurrency:
  group: update-ffe-fixtures
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  update-ffe-fixtures:
    name: Update FFE fixtures
    if: github.event_name != 'schedule' || github.event.repository.fork == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Update fixture snapshot
        id: fixtures
        env:
          FFE_FIXTURE_REF: ${{ inputs.fixture_ref || 'main' }}
        run: python scripts/update-ffe-fixtures.py --ref "$FFE_FIXTURE_REF"

      - uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        if: steps.fixtures.outputs.changed == 'true'
        id: octo-sts
        with:
          scope: DataDog/dd-trace-py
          policy: self.update-ffe-fixtures.create-pr

      - name: Create Pull Request
        if: steps.fixtures.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          sign-commits: true
          branch: ci/update-ffe-fixtures
          commit-message: "test(openfeature): update canonical FFE fixtures"
          delete-branch: true
          base: main
          title: "test(openfeature): update canonical FFE fixtures"
          draft: true
          labels: changelog/no-changelog
          body: |
            ## Description

            Updates the checked-in FFE test snapshot to commit ${{ steps.fixtures.outputs.source_commit }} from [DataDog/ffe-system-test-data](https://github.com/DataDog/ffe-system-test-data).

            New fixtures may intentionally make unit tests fail when they expose evaluator bugs. Address those failures in this update PR before merging it.

            ## Testing

            The existing OpenFeature tests run against ${{ steps.fixtures.outputs.fixture_count }} canonical fixture cases.

            ## Risks

            None. This PR updates test fixtures only.

            ## Additional Notes

            Generated by the [Update FFE fixtures](https://github.com/DataDog/dd-trace-py/actions/workflows/update-ffe-fixtures.yml) workflow.
