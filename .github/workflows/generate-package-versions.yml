name: Update test locks

on:
  workflow_dispatch: # can be triggered manually
  schedule:
    - cron: "0 0 * * *" # daily at midnight

jobs:
  update-test-locks:
    name: Update test locks
    if: github.event_name != 'schedule' || github.event.repository.fork == false
    runs-on: ubuntu-22.04
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      new_latest: ${{ steps.new-latest.outputs.new_latest }}
      venv_name: ${{ steps.new-latest.outputs.venv_name }}
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"

      - name: Setup Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker compose --version

      - name: Start docker service
        run: docker compose up -d testagent

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev

      - uses: ./.github/actions/setup-ci-deps

      - name: Install ddtrace from pre-built wheel
        run: |
          curl https://dd-trace-py-builds.s3.amazonaws.com/main/install.sh | bash

      - name: Regenerate test locks
        id: lock
        run: |
          OUTDATED_ENVIRONMENTS=$(scripts/freshvenvs.py output)
          VENV_NAME=${OUTDATED_ENVIRONMENTS%% *}
          if [[ -n "$VENV_NAME" ]]; then
            scripts/test-requirements lock --upgrade "$VENV_NAME" >/dev/null
          fi
          echo "venv_name=$VENV_NAME" >> "$GITHUB_OUTPUT"
          echo "VENV_NAME=$VENV_NAME" >> "$GITHUB_ENV"

      - name: Run integration registry update
        if: steps.lock.outputs.venv_name != ''
        run: python scripts/integration_registry/update_and_format_registry.py

      - name: Get latest version
        if: steps.lock.outputs.venv_name != ''
        id: new-latest
        run: |
          NEW_LATEST=$(python scripts/get_latest_version.py ${{ env.VENV_NAME }})
          echo "new_latest=$NEW_LATEST" >> "$GITHUB_OUTPUT"
          echo "venv_name=$VENV_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare generated changes
        if: steps.lock.outputs.venv_name != ''
        id: patch
        uses: ./.github/actions/generated-change-patch
        with:
          mode: create
          patch-file: generated.patch
          profile: package-versions

      - name: Upload generated changes
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-package-versions
          path: generated.patch
          retention-days: 1

  create-pull-request:
    name: Create pull request
    needs: update-test-locks
    if: needs.update-test-locks.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download generated changes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-package-versions
          path: ${{ runner.temp }}/generated-package-versions

      - name: Apply and validate generated changes
        uses: ./.github/actions/generated-change-patch
        with:
          mode: apply
          patch-file: ${{ runner.temp }}/generated-package-versions/generated.patch
          profile: package-versions

      - uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        id: octo-sts
        with:
          scope: DataDog/dd-trace-py
          policy: self.generate-package-versions.create-pr

      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          sign-commits: true
          branch: "upgrade-latest-${{ needs.update-test-locks.outputs.venv_name }}-version"
          commit-message: "Update package version"
          delete-branch: true
          base: main
          title: "chore: update ${{ needs.update-test-locks.outputs.venv_name }} latest version to ${{ needs.update-test-locks.outputs.new_latest }}"
          labels: changelog/no-changelog
          body: |
            Update ${{ needs.update-test-locks.outputs.venv_name }} lockfiles and dependency package lockfiles.
            This performs the following updates:
              1) Some ${{ needs.update-test-locks.outputs.venv_name }} locks use ${{ needs.update-test-locks.outputs.venv_name }} `latest`. This updates that package and its dependencies.
              2) Some locks pin ${{ needs.update-test-locks.outputs.venv_name }} but use the latest version of another package. This updates those dependencies.
