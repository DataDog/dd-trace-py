name: Update test locks

on:
  workflow_dispatch: # can be triggered manually
    inputs:
      drop_failed:
        description: "Split packages whose CI suites failed out of the batch PR instead of locking"
        type: boolean
        default: false
  schedule:
    - cron: "0 0 * * *" # daily at midnight: lock every outdated package into the batch PR
  status: # the batch PR's GitLab pipeline finished: drop failed packages from it

concurrency:
  group: generate-package-versions
  cancel-in-progress: false

jobs:
  update-test-locks:
    name: Update test locks
    if: >-
      (github.event_name != 'schedule' || github.event.repository.fork == false) &&
      (github.event_name != 'status' || (
        github.event.context == 'dd-gitlab/default-pipeline' &&
        github.event.state != 'pending' &&
        contains(github.event.branches.*.name, 'upgrade-latest-all-versions')))
    runs-on: ubuntu-22.04
    env:
      DROP_FAILED: ${{ inputs.drop_failed || github.event_name == 'status' }}
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      dropped: ${{ steps.lock.outputs.dropped }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python 3.9
        if: env.DROP_FAILED != 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.9"

      - name: Setup Python 3.10
        if: env.DROP_FAILED != 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"

      - name: Setup Python 3.11
        if: env.DROP_FAILED != 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Setup Python 3.12
        if: env.DROP_FAILED != 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Setup Python 3.13
        if: env.DROP_FAILED != 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Setup Python 3.14
        if: env.DROP_FAILED != 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Set up QEMU
        if: env.DROP_FAILED != 'true'
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        if: env.DROP_FAILED != 'true'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Install Docker Compose
        if: env.DROP_FAILED != 'true'
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker compose --version

      - name: Start docker service
        if: env.DROP_FAILED != 'true'
        run: docker compose up -d testagent

      - name: Install system dependencies
        if: env.DROP_FAILED != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev

      - uses: ./.github/actions/setup-ci-deps
        if: env.DROP_FAILED != 'true'

      - name: Install ddtrace from pre-built wheel
        if: env.DROP_FAILED != 'true'
        run: |
          curl https://dd-trace-py-builds.s3.amazonaws.com/main/install.sh | bash

      - name: Regenerate test locks
        id: lock
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BATCH_BRANCH: upgrade-latest-all-versions
        run: |
          if [[ "$DROP_FAILED" == "true" ]]; then
            # Restore the batch PR's files, then revert the locks of packages whose CI suites failed.
            pr=$(gh pr view "$BATCH_BRANCH" --json number,state,statusCheckRollup) || exit 0
            [[ "$(jq -r .state <<<"$pr")" == "OPEN" ]] || exit 0
            # Wait until every GitLab check has finished (other checks, like the merge gate, can stay pending).
            jq -e '.statusCheckRollup | any(.[]; ((.name // .context) | startswith("dd-gitlab/")) and ((.status // "COMPLETED") != "COMPLETED" or ((.state // "") | IN("PENDING", "EXPECTED"))))' <<<"$pr" >/dev/null && exit 0
            failed=$(jq -r '.statusCheckRollup[] | select((.conclusion // .state) | IN("FAILURE", "ERROR", "TIMED_OUT")) | (.name // .context)' <<<"$pr")
            [[ -z "$failed" ]] && exit 0
            # The batch PR must still be based on the current main, or restoring its files would revert main's changes.
            [[ "$(gh api "repos/$GH_REPO/compare/main...$BATCH_BRANCH" --jq .merge_base_commit.sha)" == "$(git rev-parse HEAD)" ]] || exit 0
            git fetch --depth=1 origin "$BATCH_BRANCH"
            gh api --paginate "repos/$GH_REPO/pulls/$(jq .number <<<"$pr")/files" --jq '.[] | [.status, .filename] | @tsv' |
              while IFS=$'\t' read -r status path; do
                if [[ "$status" == "removed" ]]; then git rm -q -- "$path"; else git restore --source=FETCH_HEAD --staged --worktree -- "$path"; fi
              done
            dropped=$(scripts/drop_failed_bumps.py --base HEAD <<<"$failed" | tr '\n' ' ')
            echo "dropped=$dropped" >> "$GITHUB_OUTPUT"
          else
            # Skip packages that already have their own open bump PR.
            names=
            for name in $(scripts/freshvenvs.py output); do
              [[ -z "$(gh pr list --head "upgrade-latest-$name-version" --state open --json number --jq '.[].number')" ]] && names="$names $name"
            done
            [[ -z "$names" ]] && exit 0
            scripts/test-requirements lock --upgrade $names >/dev/null
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Run integration registry update
        if: steps.lock.outputs.run == 'true'
        run: python scripts/integration_registry/update_and_format_registry.py

      - name: Prepare generated changes
        if: steps.lock.outputs.run == 'true'
        id: patch
        uses: ./.github/actions/generated-change-patch
        with:
          mode: create
          patch-file: generated.patch
          profile: package-versions

      - name: Upload generated changes
        if: steps.patch.outputs.changed == 'true'
        uses: ./.github/actions/upload-artifact
        with:
          name: generated-package-versions
          path: generated.patch
          retention-days: 1

  create-pull-request:
    name: Create pull request
    needs: update-test-locks
    if: needs.update-test-locks.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download generated changes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-package-versions
          path: ${{ runner.temp }}/generated-package-versions

      - name: Apply and validate generated changes
        uses: ./.github/actions/generated-change-patch
        with:
          mode: apply
          patch-file: ${{ runner.temp }}/generated-package-versions/generated.patch
          profile: package-versions

      - uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        id: octo-sts
        with:
          scope: DataDog/dd-trace-py
          policy: self.generate-package-versions.create-pr

      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          sign-commits: true
          branch: upgrade-latest-all-versions
          commit-message: "Update package version"
          delete-branch: true
          base: main
          title: "chore: update latest versions of outdated packages"
          labels: changelog/no-changelog
          body: |
            Update the lockfiles of every outdated package in one batch. This performs the following updates:
              1) Locks that use a package's `latest` get that package and its dependencies updated.
              2) Locks that pin a package but use the latest version of another package get those dependencies updated.

            Packages whose CI suites fail are removed from this PR when its pipeline finishes and get their own
            `upgrade-latest-<package>-version` PR.

  split-dropped-packages:
    name: Open per-package PRs for dropped packages
    needs: [update-test-locks, create-pull-request]
    if: >-
      !cancelled() && needs.update-test-locks.outputs.dropped != '' &&
      needs.create-pull-request.result != 'failure'
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - name: Dispatch update-package-version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DROPPED: ${{ needs.update-test-locks.outputs.dropped }}
        run: |
          for name in $DROPPED; do
            gh workflow run update-package-version.yml -f integration_name="$name" -f package_name="$name"
          done
