name: Testrunner

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'docker/**'

jobs:
  build-and-publish:
    uses: ./.github/workflows/build-and-publish-image.yml
    permissions:
      contents: read
      packages: write
    with:
      tags: 'ghcr.io/datadog/dd-trace-py/testrunner:${{ github.sha }},ghcr.io/datadog/dd-trace-py/testrunner:latest'
      # No "/v8": buildx publishes the arm64 image without a variant, and the
      # numeric-USER check looks each platform up by this exact string.
      platforms: 'linux/amd64,linux/arm64'
      build-args: ''
      context: ./docker
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
