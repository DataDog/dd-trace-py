name: Update system-tests pin

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute pin bump and print diff; do not create PR, auto-merge, or Slack'
        type: boolean
        default: false
  schedule:
    - cron: '0 14 * * 1-5' # weekdays at 09:00 EST (14:00 UTC)

permissions:
  id-token: write
  contents: read

jobs:
  update-system-tests-pin:
    name: Update system-tests pin
    if: github.event_name != 'schedule' || github.event.repository.fork == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Run update script
        run: python scripts/update-system-tests-version.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            NEW_SHA=$(git diff .github/workflows/system-tests.yml | grep '^+.*ref:' | grep -oE "[0-9a-f]{40}" | head -1)
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "new_sha=${NEW_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry-run summary
        if: inputs.dry_run
        run: |
          echo "dry_run=true"
          echo "changed=${{ steps.changes.outputs.changed }}"
          echo "new_sha=${{ steps.changes.outputs.new_sha }}"
          echo "base=main (hardcoded; release branches are not updated by this workflow)"
          git diff --stat
          git diff

      - uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        if: ${{ !inputs.dry_run && steps.changes.outputs.changed == 'true' }}
        id: octo-sts
        with:
          scope: DataDog/dd-trace-py
          policy: self.update-system-tests.create-pr

      - name: Create Pull Request
        if: ${{ !inputs.dry_run && steps.changes.outputs.changed == 'true' }}
        id: create-pr
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          branch: ci/update-system-tests-pin
          commit-message: "ci: update system-tests pin to ${{ steps.changes.outputs.new_sha }}"
          delete-branch: true
          base: main
          title: "ci: update system-tests pin to ${{ steps.changes.outputs.new_sha }}"
          labels: changelog/no-changelog
          body: |
            Automated bump of the system-tests SHA pin to the latest `main`.

            Run by the [Update system-tests pin](https://github.com/DataDog/dd-trace-py/actions/workflows/update-system-tests-pin.yml) workflow.

            Auto-merge is enabled (squash) once required checks pass and the PR is approved.

      - name: Enable auto-merge
        if: ${{ !inputs.dry_run && steps.changes.outputs.changed == 'true' && steps.create-pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json number,autoMergeRequest

      - name: Notify Slack on PR created
        if: ${{ !inputs.dry_run && steps.changes.outputs.changed == 'true' && steps.create-pr.outputs.pull-request-operation == 'created' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_APM_PYTHON_RELEASE }}
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
          NEW_SHA: ${{ steps.changes.outputs.new_sha }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"text\": \":robot_face: *Automated PR created:* <${PR_URL}|ci: update system-tests pin to \`${NEW_SHA}\`>\n\nAuto-merge is queued (squash). Approve the PR so it can land when required checks are green.\", \"unfurl_links\": false}"
