name: Watchdog formatter diagnostics
on:
  push:
    branches:
      - juanjo/macos-watchdog-format-diagnostics
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 87bc74838d440666be55e913dcf0d083ffc7af6f
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
      - name: Report pinned formatter and lint output
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          import sys

          files = [".gitlab/scripts/sccache-watchdog.py", ".gitlab/scripts/test_sccache_watchdog.py"]
          failed = False
          for args in (["format", "--diff"], ["check"]):
              result = subprocess.run(
                  ["scripts/lint", "ruff", *args, *files],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              print(result.stdout, flush=True)
              message = result.stdout.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice title=Ruff {args[0]}::{message}", flush=True)
              failed |= result.returncode != 0
          sys.exit(failed)
          PY
