name: Generate Supported Integration Versions

on:
  workflow_dispatch: # can be triggered manually

jobs:
  generate-supported-versions:
    name: Generate supported integration versions
    runs-on: ubuntu-22.04
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"

      - name: Setup Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev

      - uses: ./.github/actions/setup-ci-deps

      - name: Install ddtrace from pre-built wheel
        run: |
          curl https://dd-trace-py-builds.s3.amazonaws.com/main/install.sh | bash

      - name: Generate supported versions
        run: python scripts/integration_registry/generate_supported_versions.py ${{ github.ref_name == 'main' && '--main' || '' }}

      - name: Preview supported versions output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          supported_versions = json.loads(Path("supported_versions.json").read_text())
          print(f"Generated {len(supported_versions)} supported version entries.")
          print(json.dumps(supported_versions[:3], indent=2))
          PY

      - name: Preview changes
        run: git diff

      - name: Prepare generated changes
        id: patch
        uses: ./.github/actions/generated-change-patch
        with:
          mode: create
          patch-file: generated.patch
          profile: supported-versions

      - name: Upload generated changes
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-supported-versions
          path: generated.patch
          retention-days: 1

  create-pull-request:
    name: Create pull request
    needs: generate-supported-versions
    if: needs.generate-supported-versions.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download generated changes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-supported-versions
          path: ${{ runner.temp }}/generated-supported-versions

      - name: Apply and validate generated changes
        uses: ./.github/actions/generated-change-patch
        with:
          mode: apply
          patch-file: ${{ runner.temp }}/generated-supported-versions/generated.patch
          profile: supported-versions

      - uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        id: octo-sts
        with:
          scope: DataDog/dd-trace-py
          policy: self.generate-supported-versions.create-pr

      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          branch: "update-supported-versions"
          commit-message: "Update supported versions"
          delete-branch: true
          base: main
          title: "chore: update supported versions"
          labels: changelog/no-changelog
          body: |
            Generates / updates the supported versions for integrations.
            This should be tied to releases, or triggered manually.
            Workflow runs: [Generate Supported Integration Versions](https://github.com/DataDog/dd-trace-py/actions/workflows/generate-supported-versions.yml)
