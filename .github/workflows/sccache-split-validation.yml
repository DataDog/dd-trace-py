name: Validate permanent sccache split
on:
  push:
    branches: [juanjo/sccache-split-validation]
    paths: [.github/workflows/sccache-split-validation.yml]
defaults:
  run:
    shell: bash
permissions:
  contents: read
  checks: write
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 5df4b5c2fb7c29d0c1b6cd12a626509dbd7b9f64
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Permanent change and existing watchdog tests
        run: |
          /bin/bash --version
          python3 .gitlab/scripts/test_setup_sccache.py -v 2>&1 | tee /tmp/sccache-split.log
          python3 .gitlab/scripts/test_sccache_watchdog.py -v 2>&1 | tee -a /tmp/sccache-split.log
      - name: Publish diagnostic details
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ github.sha }}
          REPORT_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          path = pathlib.Path('/tmp/sccache-split.log')
          text = path.read_text(errors='replace') if path.exists() else 'No command output captured.'
          payload = {'name': 'Split validation details (' + os.environ.get('RUNNER_OS', '') + ')', 'head_sha': os.environ['REPORT_SHA'], 'status': 'completed', 'conclusion': 'neutral', 'output': {'title': 'Sccache split validation', 'summary': '```text\n' + text[-55000:] + '\n```'}}
          request = urllib.request.Request('https://api.github.com/repos/' + os.environ['REPORT_REPOSITORY'] + '/check-runs', data=json.dumps(payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}, method='POST')
          with urllib.request.urlopen(request) as response:
              print('Published validation details:', response.status)
          PY
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 5df4b5c2fb7c29d0c1b6cd12a626509dbd7b9f64
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
      - name: Repository formatting
        run: |
          git update-ref refs/remotes/origin/main aa95eef7a6294c0d1b288f298cc8589e3d879501
          scripts/lint fmt -- setup.py .gitlab/scripts/test_setup_sccache.py 2>&1 | tee /tmp/sccache-split.log
          git diff --exit-code
      - name: Repository checks
        run: scripts/lint checks 2>&1 | tee -a /tmp/sccache-split.log
      - name: Formatting diff
        if: always()
        run: git diff | tee -a /tmp/sccache-split.log
      - name: Publish diagnostic details
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ github.sha }}
          REPORT_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          path = pathlib.Path('/tmp/sccache-split.log')
          text = path.read_text(errors='replace') if path.exists() else 'No command output captured.'
          payload = {'name': 'Split validation details (' + os.environ.get('RUNNER_OS', '') + ')', 'head_sha': os.environ['REPORT_SHA'], 'status': 'completed', 'conclusion': 'neutral', 'output': {'title': 'Sccache split validation', 'summary': '```text\n' + text[-55000:] + '\n```'}}
          request = urllib.request.Request('https://api.github.com/repos/' + os.environ['REPORT_REPOSITORY'] + '/check-runs', data=json.dumps(payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}, method='POST')
          with urllib.request.urlopen(request) as response:
              print('Published validation details:', response.status)
          PY
