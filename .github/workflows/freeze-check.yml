name: Freeze check

# On main, require this check and "Require branches to be up to date before
# merging": advancing the base alone does not trigger pull_request workflows.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Use GitHub's PR merge commit so unchanged files inherit base updates.
          fetch-depth: 0
          persist-credentials: false
      - name: Check frozen files
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          # Merge rules validate freezes on the merge result, including newly
          # added freezes and this workflow's first run. Base rules use the
          # target base, so branches predating a freeze are checked too, and
          # they keep a hash update within the same PR from lifting a freeze.
          # Removing an entry is the only way to unfreeze a path, and the
          # removal may share a PR with the change it authorizes, e.g.
          # replacing the file with a bridge to the extracted package, so the
          # unfreeze and the change land together instead of leaving the path
          # unprotected on main between two PRs. Manifest edits are gated by
          # CODEOWNERS on /frozen-paths.txt.
          head_manifest="$RUNNER_TEMP/frozen-paths-head.txt"
          if [[ -n "$(git ls-tree --name-only HEAD -- frozen-paths.txt)" ]]; then
            git show HEAD:frozen-paths.txt > "$head_manifest"
          else
            : > "$head_manifest"
          fi
          declare -A kept=()
          while IFS='=' read -r p h || [[ -n "$p" ]]; do
            [[ -z "$p" || "$p" == \#* ]] && continue
            kept["$p"]="$h"
          done < "$head_manifest"
          for revision in "$BASE_REF" HEAD; do
            manifest=$(git ls-tree --name-only "$revision" -- frozen-paths.txt)
            [[ -z "$manifest" ]] && continue
            git show "$revision:frozen-paths.txt" > "$RUNNER_TEMP/frozen-paths.txt"
            while IFS='=' read -r path hash || [[ -n "$path" ]]; do
              [[ -z "$path" || "$path" == \#* ]] && continue
              if [[ -z "${kept[$path]+x}" ]]; then
                echo "::notice::$path is unfrozen by this PR"
                continue
              fi
              actual=$(git show "HEAD:$path" | sha256sum | cut -d' ' -f1)
              if [[ "$actual" != "$hash" ]]; then
                echo "::error::$path is frozen but was changed"
                exit 1
              fi
            done < "$RUNNER_TEMP/frozen-paths.txt"
          done
