[package]
name = "ddtrace-native"
version = "0.1.0"
edition = "2021"
resolver = "2"

[profile.release]
lto = true
debug = "line-tables-only"
opt-level = 's'
codegen-units = 1

[features]
crashtracker = ["dep:libdd-crashtracker", "dep:pyo3-ffi", "dep:libc"]
profiling = ["dep:libdd-profiling-ffi"]
ffe = ["dep:libdd-ffe"]
stats = ["dep:libdd-ddsketch"]

[dependencies]
anyhow = { version = "1.0" }
base64 = "0.22"
# `bytes 1.10+` is required for `Bytes::from_owner` (used in http_client to
# wrap PyBackedBytes zero-copy across the GIL release).
bytes = "1.10"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
url = "2"
libc = { version = "0.2", optional = true }
once_cell = "1"
rand = "0.9"
rustc-hash = "1.1"
serde = "1.0"
serde_json = "1.0"
smallvec = "1"
tokio = "1"
libdd-ffe = { version = "2.0.0", optional = true, features = ["pyo3"] }
libdd-ipc = { version = "2.0.0", features = ["one_way_shm_futex"] }
libdd-live-debugger = { version = "1.0.0" }
libdd-remote-config = { version = "5.0.0", features = [ "agentless" ] }
libdd-telemetry = { version = "8.0.0" }
libdd-tracer-flare = { version = "3.0.0" }
libdd-crashtracker = { version = "3.0.0", optional = true }
libdd-ddsketch = { version = "1.1.1", optional = true }
libdd-library-config = { version = "4.0.0" }
libdd-log = { version = "1.0.0" }
libdd-capabilities-impl = { version = "5.0.0" }
libdd-data-pipeline = { version = "10.0.0", features = [
    "stats-obfuscation",
    "compression"
] }
# DEV: `hyper-backend` (rather than the default `reqwest-backend`) avoids
# hickory-dns, a pure-Rust DNS resolver that mishandles bare, single-label
# hostnames resolved through custom search/ndots resolv.conf setups (e.g.
# Docker Compose/Kubernetes service names via embedded DNS) — it uses the
# system resolver instead, like the stdlib http.client this replaces did.
libdd-http-client = { version = "2.0.0", default-features = false, features = [
  "https",
  "hyper-backend",
  "hyper-proxy",
] }
libdd-shared-runtime = { version = "4.0.0" }
libdd-profiling-ffi = { git = "https://github.com/DataDog/libdatadog", rev = "v44.0.0", optional = true, features = [
    "cbindgen",
] }
libdd-common = { version = "6.0.0" }
libdd-trace-utils = { version = "12.0.0" }
native-proc-macro = { path = "native_proc_macro" }
strum = { version = "0.26", default-features = false }
percent-encoding = "2.3"
# TODO(py-315): 0.29 blocked — libdatadog v43.0.0 libdd-ffe requires pyo3 = "^0.28" (links = "python")
pyo3 = { version = "0.28", features = ["extension-module", "anyhow"] }
tracing = { version = "0.1", default-features = false }
pyo3-ffi = { version = "0.28", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libdd-library-config = { version = "4.0.0", features = ["otel-thread-ctx"]}
libdd-otel-thread-ctx = { version = "1.1.0" }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[build-dependencies]
pyo3-build-config = "0.28"
build_common = { git = "https://github.com/DataDog/libdatadog", rev = "v43.0.0", features = [
    "cbindgen",
] }

[lib]
name = "_native"
path = "lib.rs"
crate-type = ["cdylib"]
