[package]
name = "ddtrace-native"
version = "0.1.0"
edition = "2021"
resolver = "2"

[profile.release]
lto = true
debug = "line-tables-only"
opt-level = 's'
codegen-units = 1

[features]
crashtracker = ["dep:libdd-crashtracker", "dep:pyo3-ffi", "dep:libc"]
profiling = ["dep:libdd-profiling-ffi"]
ffe = ["dep:libdd-ffe"]
stats = ["dep:libdd-ddsketch"]

[dependencies]
anyhow = { version = "1.0" }
base64 = "0.22"
# `bytes 1.10+` is required for `Bytes::from_owner` (used in http_client to
# wrap PyBackedBytes zero-copy across the GIL release).
bytes = "1.10"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
url = "2"
libc = { version = "0.2", optional = true }
once_cell = "1"
rand = "0.9"
rustc-hash = "1.1"
serde = "1.0"
serde_json = "1.0"
smallvec = "1"
tokio = "1"
libdd-ffe = { git = "https://github.com/DataDog/libdatadog", rev = "cf299e07f9b87c9da9dc4b775612dbd1644699a8", optional = true, features = ["pyo3"] }
libdd-ipc = { git = "https://github.com/DataDog/libdatadog", rev = "cf299e07f9b87c9da9dc4b775612dbd1644699a8", features = ["one_way_shm_futex"] }
libdd-live-debugger = { git = "https://github.com/DataDog/libdatadog", rev = "cf299e07f9b87c9da9dc4b775612dbd1644699a8" }
libdd-remote-config = { git = "https://github.com/DataDog/libdatadog", rev = "cf299e07f9b87c9da9dc4b775612dbd1644699a8", features = [
  "agentless",
] }
libdd-telemetry = { git = "https://github.com/DataDog/libdatadog", rev = "cf299e07f9b87c9da9dc4b775612dbd1644699a8" }
libdd-tracer-flare = { git = "https://github.com/DataDog/libdatadog", rev = "cf299e07f9b87c9da9dc4b775612dbd1644699a8" }
libdd-crashtracker = { git = "https://github.com/DataDog/libdatadog", rev = "cf299e07f9b87c9da9dc4b775612dbd1644699a8", optional = true }
libdd-ddsketch = { git = "https://github.com/DataDog/libdatadog", rev = "cf299e07f9b87c9da9dc4b775612dbd1644699a8", optional = true }
libdd-library-config = { git = "https://github.com/DataDog/libdatadog", rev = "cf299e07f9b87c9da9dc4b775612dbd1644699a8" }
libdd-log = { git = "https://github.com/DataDog/libdatadog", rev = "cf299e07f9b87c9da9dc4b775612dbd1644699a8" }
libdd-capabilities-impl = { git = "https://github.com/DataDog/libdatadog", rev = "cf299e07f9b87c9da9dc4b775612dbd1644699a8" }
libdd-data-pipeline = { git = "https://github.com/DataDog/libdatadog", rev = "cf299e07f9b87c9da9dc4b775612dbd1644699a8", features = [
  "stats-obfuscation",
  "compression"
] }
# DEV: `hyper-backend` (rather than the default `reqwest-backend`) avoids
# hickory-dns, a pure-Rust DNS resolver that mishandles bare, single-label
# hostnames resolved through custom search/ndots resolv.conf setups (e.g.
# Docker Compose/Kubernetes service names via embedded DNS) — it uses the
# system resolver instead, like the stdlib http.client this replaces did.
libdd-http-client = { git = "https://github.com/DataDog/libdatadog", rev = "cf299e07f9b87c9da9dc4b775612dbd1644699a8", default-features = false, features = [
  "https",
  "hyper-backend",
  "hyper-proxy",
] }
libdd-shared-runtime = { git = "https://github.com/DataDog/libdatadog", rev = "cf299e07f9b87c9da9dc4b775612dbd1644699a8" }
libdd-profiling-ffi = { git = "https://github.com/DataDog/libdatadog", rev = "cf299e07f9b87c9da9dc4b775612dbd1644699a8", optional = true, features = [
    "cbindgen",
] }
libdd-common = { git = "https://github.com/DataDog/libdatadog", rev = "cf299e07f9b87c9da9dc4b775612dbd1644699a8" }
libdd-trace-model = { git = "https://github.com/DataDog/libdatadog", rev = "cf299e07f9b87c9da9dc4b775612dbd1644699a8" }
libdd-trace-utils = { git = "https://github.com/DataDog/libdatadog", rev = "cf299e07f9b87c9da9dc4b775612dbd1644699a8" }
native-proc-macro = { path = "native_proc_macro" }
strum = { version = "0.26", default-features = false }
percent-encoding = "2.3"
pyo3 = { version = "0.29", features = ["extension-module", "anyhow"] }
tracing = { version = "0.1", default-features = false }
# used to read distributions from zip archives on sys.path.
zip = { version = "4.6", default-features = false, features = ["deflate"] }
pyo3-ffi = { version = "0.29", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libdd-library-config = { git = "https://github.com/DataDog/libdatadog", rev = "cf299e07f9b87c9da9dc4b775612dbd1644699a8", features = ["otel-thread-ctx"]}
libdd-otel-thread-ctx = { git = "https://github.com/DataDog/libdatadog", rev = "cf299e07f9b87c9da9dc4b775612dbd1644699a8", features = ["thread-exit-autoclean"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[build-dependencies]
pyo3-build-config = "0.29"
build_common = { git = "https://github.com/DataDog/libdatadog", rev = "cf299e07f9b87c9da9dc4b775612dbd1644699a8", features = [
    "cbindgen",
] }

[lib]
name = "_native"
path = "lib.rs"
crate-type = ["cdylib"]
