# Builds libdatadog's `libdd-profiling-heap-gotter-ffi` cdylib for dd-trace-py.
# Source mirrors upstream `libdatadog/libdd-profiling-heap-gotter-ffi` (git rev
# 56dab857b — heap-gotter-ffi landed after v37.0.0; re-pin when tagged).
#
# Produces `liblibdd_profiling_heap_gotter_ffi.so` (libdatadog's double-`lib`
# convention). setup.py copies it to `liblibdd_profiling_heap_gotter_ffi<EXT_SUFFIX>.so`
# under `ddtrace/internal/datadog/profiling/` for the ctypes activator.
#
# Phase 1 is allocation-only: `live-heap` stays off via `default-features = false`
# on the gotter dependency. Enable `test-support` for hook-hit counter tests.
[package]
name = "libdd-profiling-heap-gotter-ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"
crate-type = ["cdylib"]
bench = false

[profile.release]
opt-level = "s"
debug = "line-tables-only"
codegen-units = 1

[features]
default = []
test-support = ["libdd-profiling-heap-gotter/test-support"]

[dependencies]
anyhow = "1.0"
function_name = "0.3.0"
libdd-common-ffi = { git = "https://github.com/DataDog/libdatadog", rev = "56dab857b23a088b24e72195184cb8adb472ebfb", default-features = false }
libdd-profiling-heap-gotter = { git = "https://github.com/DataDog/libdatadog", rev = "56dab857b23a088b24e72195184cb8adb472ebfb", default-features = false }
